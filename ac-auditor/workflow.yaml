version: '2'
keep_runs: 1000
start: prepare
# ac-auditor (scheme crew_team, Auditor): three finders on different models look for violations of rule
# ac.check.11111r. One judge decides PASS or FAIL from their results. PASS: to_prepare, returns 0.
# FAIL: to_decide, returns + 1, a note with the accepted findings. returns at RETURNS_LIMIT: tag stuck.
# A missing finder result or an invalid judge output is a technical failure: the stage stays.
timeout: &workflow_timeout 7200
on_timeout: failed
defaults:
  timeout: *workflow_timeout
vars:
  PLANNING_PYTHON: python3
  # launch.py supplies the shared flow stages, the selected item and the publication policy.
  CREW_FLOW_STAGES: ''
  FLOW_PUBLICATION: ''
  AGY_PROFILE_HOME: ''
  # The project supplies these in config.vars.
  # Joppa schema rev 52 computes the AC stage from its status and refuses a stage save. Keep false until it changes.
  STAGE_WRITES: 'false'
  RETURNS_LIMIT: '3'
  STUCK_TAG: stuck
  PASS_STAGE: to_prepare
  FAIL_STAGE: to_decide
  FINDER_ONE_MODEL: gpt-6.2-sol
  FINDER_TWO_MODEL: gpt-6.1-sol
  FINDER_THREE_MODEL: gemini-4-carbon-high
  JUDGE_MODEL: claude-opus-5-5
  # true: run the whole flow, publish nothing and release the claim with outcome DRY_RUN.
  DRY_RUN: 'false'
  audit_ac: ''
  audit_artifacts: ''
  auditor_finder_one_reader_config: ''
  auditor_finder_one_reader_home: ''
  auditor_finder_two_reader_config: ''
  auditor_finder_two_reader_home: ''
  auditor_finder_three_reader_config: ''
  auditor_finder_three_reader_home: ''
  auditor_judge_reader_config: ''
  auditor_judge_reader_home: ''
  finder_one_path: ''
  finder_two_path: ''
  finder_three_path: ''
nodes:
  prepare:
    shell: |
      set -eu
      for name in CREW_FLOW_STAGES FLOW_PUBLICATION; do
        eval "value=\${$name:-}"
        [ -n "$value" ] || { echo "ac-auditor: $name is required" >&2; exit 2; }
      done
      case "$RETURNS_LIMIT" in ''|*[!0-9]*|0) echo 'ac-auditor: RETURNS_LIMIT must be positive' >&2; exit 2 ;; esac
      [ -n "$STUCK_TAG" ] || { echo 'ac-auditor: STUCK_TAG is required' >&2; exit 2; }
      case "$DRY_RUN" in true|false) ;; *) echo 'ac-auditor: DRY_RUN must be true or false' >&2; exit 2 ;; esac
      case "$STAGE_WRITES" in true|false) ;; *) echo 'ac-auditor: STAGE_WRITES must be true or false' >&2; exit 2 ;; esac
      printf '%s' "$FLOW_PUBLICATION" | jq -e '.allowed_operations == ["save_object", "note"] and .create_kinds == [] and .update_kinds == ["ac"]' >/dev/null || {
        echo 'ac-auditor: publication must allow only save_object and note on the ac, and create nothing' >&2; exit 2; }
      prepared="$(FLOW_ASSIGNMENT_INLINE=false "$PLANNING_PYTHON" "$CREW_FLOW_STAGES" prepare)"
      # Keep the contracts. Shared capture, publish and fail use artifacts, not the assignment variable.
      printf '%s\n' "$prepared" | grep -v -e '^<signal:PREPARED>' -e '^<signal:var key=assignment>' || true
      case "$prepared" in *'<signal:PREPARED>'*) ;; *) exit 0 ;; esac
      a="$(cd "$MEDULLA_RUN_DIR/artifacts" && pwd -P)"
      "$PLANNING_PYTHON" "$MEDULLA_WORKFLOW_DIR/context.py"
      # Models receive only the AC, Sources, consumer and sibling ACs.
      # Escape template markers in JSON strings. Decoding the JSON preserves the complete input.
      jq -r --slurpfile requirement "$a/requirement.json" '
        ([.selected.kind, "requirement"] + [.references[]?[]?.kind]) as $kinds |
        del(.help, .claim_revision, .claim_revisions) | .children = [] |
        .schema.types |= with_entries(select(.key as $kind | $kinds | index($kind) != null)) |
        . + {requirement: $requirement[0].requirement, sibling_acs: $requirement[0].siblings} |
        tojson | gsub("\\{\\{"; "\\u007b\\u007b")' "$a/input.json" > "$a/audit-assignment.json.tmp"
      mv "$a/audit-assignment.json.tmp" "$a/audit-assignment.json"
      # A prompt holds the role prompt and the AC address. Each model finds its contract, the assignment and for the
      # judge the finder results through read_context of its own read-only reader.
      for role in finder judge; do jq -r --arg role "$role" '.[$role].content' "$a/contracts.json" > "$a/contract-$role.md"; done
      # A prompt has at most 1024 characters: the role file holds the steps and the answer format.
      reader="$(dirname "$CREW_FLOW_STAGES")/agent-reader.mjs"
      for role in finder judge; do cp "$MEDULLA_WORKFLOW_DIR/prompts/$role.md" "$a/$role.md"; done
      files() { jq -nc --arg a "$a" '$ARGS.positional | map($a + "/" + .)' --args "$@"; }
      node "$reader" prepare auditor_finder_one "$(files finder.md contract-finder.md audit-assignment.json)"
      node "$reader" prepare auditor_finder_two "$(files finder.md contract-finder.md audit-assignment.json)"
      node "$reader" prepare auditor_finder_three "$(files finder.md contract-finder.md audit-assignment.json)" --agy
      node "$reader" prepare auditor_judge "$(files judge.md contract-judge.md audit-assignment.json finder-one.json finder-two.json finder-three.json)"
      printf '<signal:var key=audit_artifacts>%s</signal:var>\n' "$a"
      printf '<signal:var key=audit_ac>%s</signal:var>\n' "$(jq -er .selected.address "$a/input.json")"
      for n in one two three; do printf '<signal:var key=finder_%s_path>%s</signal:var>\n' "$n" "$a/finder-$n.json"; done
      echo '<signal:READY_TO_AUDIT>The claim and the specification context are ready.</signal:READY_TO_AUDIT>'
    on_signal:
      READY_TO_AUDIT: finders
      BLOCKED: __exit_fail__
      __failed__: failed
      __default__: failed
  finders:
    # Three finders on different models look for violations of rule ac.check.11111r. Each one works alone.
    # A finder that fails is a technical failure: the claim is released and the stage stays.
    max_attempts: 2
    env:
      LANE_MEMORY_CONFIG: ''
      JOPPA_TOKEN: ''
      JOPPA_TOKEN_FILE: ''
      NTK_KEY: ''
      NTK_CONFIG: /dev/null
    max_parallel: 3
    min_success: 3
    inputs:
      shell: |
        node "$MEDULLA_WORKFLOW_DIR/seats.mjs"
    agent:
      harness: '{{input.harness}}'
      model: '{{input.model}}'
      effort: high
      sandbox: read-only
      args:
        - '{{input.a1:-}}'
        - '{{input.a2:-}}'
        - '{{input.a3:-}}'
        - '{{input.a4:-}}'
        - '{{input.a5:-}}'
        - '{{input.a6:-}}'
        - '{{input.a7:-}}'
        - '{{input.a8:-}}'
        - '{{input.a9:-}}'
        - '{{input.a10:-}}'
        - '{{input.a11:-}}'
        - '{{input.a12:-}}'
        - '{{input.a13:-}}'
    prompt: |
      AC audit finder. Read your role file with mcp__joppa__read_file and follow it.
      Role file: {{var:audit_artifacts}}/finder.md
      AC: {{var:audit_ac}}
    post: '"$PLANNING_PYTHON" "$CREW_FLOW_STAGES" capture "finder-$(printf %s "$MEDULLA_INPUT" | jq -r .slug)"'
    on_signal:
      __done__: finder_check
      __failed__: failed
      __empty__: failed
  finder_check:
    # Fewer than three valid finder results is a technical failure: the stage stays.
    shell: |
      set -eu
      a="$MEDULLA_RUN_DIR/artifacts"
      for n in one two three; do
        f="$a/finder-$n.json"
        if [ ! -s "$f" ] || [ "$(jq -c -f "$MEDULLA_WORKFLOW_DIR/finder-shape.jq" "$f" 2>/dev/null || echo bad)" != '[]' ]; then
          echo "ac-auditor technical failure: finder $n returned no valid result." > "$a/failure.txt"
          echo '<signal:TECHNICAL>A finder result is missing or invalid.</signal:TECHNICAL>'
          exit 0
        fi
      done
      echo '<signal:VALID>Three valid finder results.</signal:VALID>'
    on_signal:
      VALID: judge
      TECHNICAL: failed
      __failed__: failed
      __default__: failed
  judge:
    max_attempts: 2
    env:
      LANE_MEMORY_CONFIG: ''
      JOPPA_TOKEN: ''
      JOPPA_TOKEN_FILE: ''
      NTK_KEY: ''
      NTK_CONFIG: /dev/null
    agent:
      harness: claude-code
      model: '{{var:JUDGE_MODEL}}'
      effort: high
      sandbox: read-only
      args:
        - --strict-mcp-config
        - --setting-sources=
        - --mcp-config
        - '{{var:auditor_judge_reader_config}}'
        - --tools=
    prompt: |
      AC audit judge. Read your role file with mcp__joppa__read_file and follow it.
      Role file: {{var:audit_artifacts}}/judge.md
      AC: {{var:audit_ac}}
    post: '"$PLANNING_PYTHON" "$CREW_FLOW_STAGES" capture judge'
    on_signal:
      CAPTURED: judge_check
      __failed__: failed
      __default__: failed
  judge_check:
    # judge-shape.jq: PASS or FAIL with three-part findings. INCOMPLETE or an invalid decision twice is technical.
    shell: |
      set -eu
      a="$MEDULLA_RUN_DIR/artifacts"
      file="$(printf '%s' "$FLOW_PUBLICATION" | jq -er '.file | select(type == "string" and test("^[A-Za-z0-9._-]+[.]json$"))')"
      problems="$(jq -c -f "$MEDULLA_WORKFLOW_DIR/judge-shape.jq" "$a/judge.json")"
      if [ "$problems" != '[]' ]; then
        jq -r '"ac-auditor technical failure: the judge output is invalid. " + join(" ") | .[0:1000]' <<< "$problems" > "$a/failure.txt"
        echo '<signal:TECHNICAL>The judge output is invalid.</signal:TECHNICAL>'
        exit 0
      fi
      if [ "$(jq -r .verdict "$a/judge.json")" = INCOMPLETE ]; then
        echo 'ac-auditor technical failure: fewer than three finder results.' > "$a/failure.txt"
        echo '<signal:TECHNICAL>The judge returned INCOMPLETE.</signal:TECHNICAL>'
        exit 0
      fi
      verdict="$(jq -nc --arg run "$(basename "$MEDULLA_RUN_DIR")" --arg date "$(date -u +%F)" \
        --arg stages "$STAGE_WRITES" --arg dry "$DRY_RUN" --arg limit "$RETURNS_LIMIT" --arg stuck_tag "$STUCK_TAG" --arg pass_stage "$PASS_STAGE" --arg fail_stage "$FAIL_STAGE" \
        --slurpfile judge "$a/judge.json" --slurpfile input "$a/input.json" -f "$MEDULLA_WORKFLOW_DIR/judge.jq")"
      printf '%s' "$verdict" | jq .would_publish > "$a/would-publish.json"
      printf '%s' "$verdict" | jq .publication > "$a/$file"
      echo '<signal:DECIDED>The judge decided.</signal:DECIDED>'
    on_signal:
      DECIDED: publish
      TECHNICAL: failed
      __failed__: failed
      __default__: failed
  publish:
    # The shared stage adds the claim release and refuses operations outside config.publication.
    shell: |
      rc=0
      "$PLANNING_PYTHON" "$CREW_FLOW_STAGES" publish || rc=$?
      exit "$rc"
    on_signal:
      READY: __exit_ok__
      BLOCKED: __exit_fail__
      __failed__: failed
      __default__: failed
  failed:
    # A shared stage that already recorded result.json released or retained its claim. Do not repeat it.
    shell: |
      set -eu
      a="$MEDULLA_RUN_DIR/artifacts"
      if [ -e "$a/result.json" ]; then
        echo '<signal:BLOCKED>The shared stage already recorded the result.</signal:BLOCKED>'
        exit 0
      fi
      [ -s "$a/failure.txt" ] || printf '%s\n' "${MEDULLA_LAST_MESSAGE:-ac-auditor stopped before publication}" | cut -c1-1000 > "$a/failure.txt"
      exec "$PLANNING_PYTHON" "$CREW_FLOW_STAGES" fail
    on_signal:
      BLOCKED: __exit_fail__
      __failed__: __exit_fail__
      __default__: __exit_fail__
