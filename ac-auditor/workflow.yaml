version: '2'
keep_runs: 1000
start: prepare
# ac-auditor scores one claimed AC by rule ac.check.11111r (G A U M V + R). It changes no AC text, Test or Task.
# It publishes one note with the scores. With STAGE_WRITES=true it also moves the AC: to_decide when it fails,
# to_prepare without Tests or to_implement with Tests when it passes. Owner, 21 Nov 2026: no tags.
# Owner 17 Nov: 2 hours in all, no per-step limits. The deadline runs failed once to release the claim.
timeout: &workflow_timeout 7200
on_timeout: failed
defaults:
  timeout: *workflow_timeout
vars:
  PLANNING_PYTHON: python3
  # launch.py supplies the shared flow stages, the selected item and the publication policy.
  CREW_FLOW_STAGES: ''
  FLOW_PUBLICATION: ''
  AGY_PROFILE_HOME: ''
  # The project supplies these in config.vars.
  # Joppa schema rev 52 computes the AC stage from its status and refuses a stage save. Keep false until it changes.
  STAGE_WRITES: 'false'
  AUDIT_FAIL_LIMIT: '3'
  AUDIT_FAIL_TAG: manual-check
  AUDITOR_MODEL: claude-opus-5-5
  CRITIC_CODEX_MODEL: gpt-6.2-sol
  CRITIC_SECOND_HARNESS: claude-code
  CRITIC_SECOND_MODEL: claude-sonnet-5-5
  REWORK_LIMIT: '2'
  # true: run the whole flow, publish nothing and release the claim with outcome DRY_RUN.
  DRY_RUN: 'false'
  round: '1'
  shape_retries: '0'
  shape_feedback: ''
  audit_assignment_path: ''
  draft: ''
  draft_digest: ''
  critique: ''
nodes:
  prepare:
    shell: |
      set -eu
      for name in CREW_FLOW_STAGES FLOW_PUBLICATION; do
        eval "value=\${$name:-}"
        [ -n "$value" ] || { echo "ac-auditor: $name is required" >&2; exit 2; }
      done
      case "$REWORK_LIMIT" in ''|*[!0-9]*) echo 'ac-auditor: REWORK_LIMIT must be a nonnegative integer' >&2; exit 2 ;; esac
      case "$AUDIT_FAIL_LIMIT" in ''|*[!0-9]*) echo 'ac-auditor: AUDIT_FAIL_LIMIT must be positive' >&2; exit 2 ;; esac
      [ "$AUDIT_FAIL_LIMIT" -gt 0 ] || { echo 'ac-auditor: AUDIT_FAIL_LIMIT must be positive' >&2; exit 2; }
      [ -n "$AUDIT_FAIL_TAG" ] || { echo 'ac-auditor: AUDIT_FAIL_TAG is required' >&2; exit 2; }
      case "$DRY_RUN" in true|false) ;; *) echo 'ac-auditor: DRY_RUN must be true or false' >&2; exit 2 ;; esac
      case "$STAGE_WRITES" in true|false) ;; *) echo 'ac-auditor: STAGE_WRITES must be true or false' >&2; exit 2 ;; esac
      case "$CRITIC_SECOND_HARNESS" in claude-code|codex) ;; *) echo 'ac-auditor: CRITIC_SECOND_HARNESS must be claude-code or codex' >&2; exit 2 ;; esac
      [ "$CRITIC_CODEX_MODEL" != "$CRITIC_SECOND_MODEL" ] && [ "$AUDITOR_MODEL" != "$CRITIC_SECOND_MODEL" ] || {
        echo 'ac-auditor: the auditor and the two critics need distinct models' >&2; exit 2; }
      printf '%s' "$FLOW_PUBLICATION" | jq -e '.allowed_operations == ["save_object", "note"] and .create_kinds == [] and .update_kinds == ["ac"]' >/dev/null || {
        echo 'ac-auditor: publication must allow only save_object and note on the ac, and create nothing' >&2; exit 2; }
      prepared="$(FLOW_ASSIGNMENT_INLINE=false "$PLANNING_PYTHON" "$CREW_FLOW_STAGES" prepare)"
      # Keep the contracts. Shared capture, publish and fail use artifacts, not the assignment variable.
      printf '%s\n' "$prepared" | grep -v -e '^<signal:PREPARED>' -e '^<signal:var key=assignment>' || true
      case "$prepared" in *'<signal:PREPARED>'*) ;; *) exit 0 ;; esac
      a="$(cd "$MEDULLA_RUN_DIR/artifacts" && pwd -P)"
      "$PLANNING_PYTHON" "$MEDULLA_WORKFLOW_DIR/context.py"
      # Models receive only the AC, Sources, consumer and sibling ACs.
      # Escape template markers in JSON strings. Decoding the JSON preserves the complete input.
      jq -r --slurpfile requirement "$a/requirement.json" '
        ([.selected.kind, "requirement"] + [.references[]?[]?.kind]) as $kinds |
        del(.help, .claim_revision, .claim_revisions) | .children = [] |
        .schema.types |= with_entries(select(.key as $kind | $kinds | index($kind) != null)) |
        . + {requirement: $requirement[0].requirement, sibling_acs: $requirement[0].siblings} |
        tojson | gsub("\\{\\{"; "\\u007b\\u007b")' "$a/input.json" > "$a/audit-assignment.json.tmp"
      mv "$a/audit-assignment.json.tmp" "$a/audit-assignment.json"
      printf '<signal:var key=audit_assignment_path>%s</signal:var>\n' "$a/audit-assignment.json"
      echo '<signal:READY_TO_AUDIT>The claim and the specification context are ready.</signal:READY_TO_AUDIT>'
    on_signal:
      READY_TO_AUDIT: auditor
      BLOCKED: __exit_fail__
      __failed__: failed
      __default__: failed
  auditor:
    max_attempts: 2
    # No tracker credentials, MCP servers or built-in tools. All evidence is in the assignment.
    env:
      LANE_MEMORY_CONFIG: ''
      JOPPA_TOKEN: ''
      JOPPA_TOKEN_FILE: ''
      NTK_KEY: ''
      NTK_CONFIG: /dev/null
    agent:
      harness: claude-code
      model: '{{var:AUDITOR_MODEL}}'
      effort: high
      sandbox: read-only
      args:
        - --strict-mcp-config
        - --setting-sources=
        - --mcp-config
        - '{"mcpServers":{}}'
        - --tools=
    prompt: |
      {{file:prompts/auditor.md}}
      Mandatory role contract (rule ac.check.11111r):
      {{var:auditor_contract}}
      Assignment: {{file:{{var:audit_assignment_path}}}}
      Your previous audit (empty in the first round): {{var:draft}}
      Critic findings on your previous audit (empty in the first round): {{var:critique}}
      Output format problems (empty after a valid audit): {{var:shape_feedback}}
      Keep the critic findings when you correct the output format.
    post: '"$PLANNING_PYTHON" "$CREW_FLOW_STAGES" capture draft'
    on_signal:
      CAPTURED: draft_check
      __failed__: failed
      __default__: failed
  draft_check:
    # shape.jq: six scores of 0 or 1, each with evidence, and a fix for each 0. The critics review these exact bytes.
    shell: |
      set -eu
      a="$MEDULLA_RUN_DIR/artifacts"
      rm -f "$a"/critic-*.json
      problems="$(jq -c -f "$MEDULLA_WORKFLOW_DIR/shape.jq" "$a/draft.json")"
      if [ "$problems" = '[]' ]; then
        if command -v sha256sum >/dev/null; then hash="$(sha256sum "$a/draft.json")"; else hash="$(shasum -a 256 "$a/draft.json")"; fi
        printf '<signal:var key=draft_digest>%s</signal:var>\n' "${hash%% *}"
        printf '<signal:var key=shape_retries>0</signal:var>\n'
        printf '<signal:var key=shape_feedback></signal:var>\n'
        echo '<signal:CHECKED>The audit has six scores with evidence. The critics review it.</signal:CHECKED>'
      elif [ "${shape_retries:-0}" -lt 1 ]; then
        # Name each problem, so that the auditor knows what to correct.
        printf '<signal:var key=shape_feedback>%s</signal:var>\n' "$(jq -r 'tojson | gsub("<"; "\\u003c")' <<< "$problems")"
        printf '<signal:var key=shape_retries>1</signal:var>\n'
        echo '<signal:REVISE>The audit does not match the output contract.</signal:REVISE>'
      else
        jq -r '"ac-auditor stopped: the revised audit still does not match the output contract. " + join(" ") | .[0:1000]' <<< "$problems" > "$a/failure.txt"
        echo '<signal:DISPUTED>The revised audit does not match the output contract.</signal:DISPUTED>'
      fi
    on_signal:
      CHECKED: critics
      REVISE: auditor
      DISPUTED: disputed
      __failed__: failed
      __default__: failed
  critics:
    max_attempts: 2
    env:
      LANE_MEMORY_CONFIG: ''
      JOPPA_TOKEN: ''
      JOPPA_TOKEN_FILE: ''
      NTK_KEY: ''
      NTK_CONFIG: /dev/null
      AUDIT_DRAFT_DIGEST: '{{var:draft_digest}}'
    max_parallel: 2
    min_success: 2
    # Two independent seats with different models. Neither seat sees the other seat.
    inputs:
      shell: |
        jq -nc --arg codex "$CRITIC_CODEX_MODEL" --arg harness "$CRITIC_SECOND_HARNESS" --arg model "$CRITIC_SECOND_MODEL" '
          def codex: {a1: "--ignore-user-config", a2: "-c", a3: "features.shell_tool=false",
            a4: "-c", a5: "features.view_image=false", a6: "-c", a7: "features.apps=false",
            a8: "-c", a9: "features.browser_use=false", a10: "-c", a11: "features.multi_agent=false"};
          [{slug: "codex", harness: "codex", model: $codex} + codex,
           ({slug: "second", harness: $harness, model: $model} +
            if $harness == "codex" then codex
            else {a1: "--strict-mcp-config", a2: "--setting-sources=", a3: "--mcp-config", a4: "{\"mcpServers\":{}}",
              a5: "--tools="} end)]'
    agent:
      harness: '{{input.harness}}'
      model: '{{input.model}}'
      effort: high
      sandbox: read-only
      args:
        - '{{input.a1:-}}'
        - '{{input.a2:-}}'
        - '{{input.a3:-}}'
        - '{{input.a4:-}}'
        - '{{input.a5:-}}'
        - '{{input.a6:-}}'
        - '{{input.a7:-}}'
        - '{{input.a8:-}}'
        - '{{input.a9:-}}'
        - '{{input.a10:-}}'
        - '{{input.a11:-}}'
    prompt: |
      {{file:prompts/critic.md}}
      Mandatory role contract (rule ac.check.11111r):
      {{var:critic_contract}}
      Assignment: {{file:{{var:audit_assignment_path}}}}
      Draft digest: {{var:draft_digest}}
      Frozen audit: {{var:draft}}
    post: '"$PLANNING_PYTHON" "$CREW_FLOW_STAGES" capture "critic-$(printf %s "$MEDULLA_INPUT" | jq -r .slug)"'
    on_signal:
      __done__: review_join
      __failed__: failed
      __empty__: failed
  review_join:
    # Publish only when both seats reviewed this exact audit and agree with every score.
    shell: |
      set -eu
      a="$MEDULLA_RUN_DIR/artifacts"
      file="$(printf '%s' "$FLOW_PUBLICATION" | jq -er '.file | select(type == "string" and test("^[A-Za-z0-9._-]+[.]json$"))')"
      if command -v sha256sum >/dev/null; then hash="$(sha256sum "$a/draft.json")"; else hash="$(shasum -a 256 "$a/draft.json")"; fi
      verdict="$(jq -L "$MEDULLA_WORKFLOW_DIR" -nc --arg digest "${hash%% *}" --arg run "$(basename "$MEDULLA_RUN_DIR")" --arg date "$(date -u +%F)" \
        --arg stages "$STAGE_WRITES" --arg dry "$DRY_RUN" --arg fail_limit "$AUDIT_FAIL_LIMIT" --arg fail_tag "$AUDIT_FAIL_TAG" \
        --slurpfile draft "$a/draft.json" --slurpfile input "$a/input.json" \
        --slurpfile codex "$a/critic-codex.json" --slurpfile second "$a/critic-second.json" \
        -f "$MEDULLA_WORKFLOW_DIR/publication.jq")"
      if [ "$(printf '%s' "$verdict" | jq -r .approved)" = true ]; then
        printf '%s' "$verdict" | jq .would_publish > "$a/would-publish.json"
        printf '%s' "$verdict" | jq .publication > "$a/$file"
        echo '<signal:APPROVED>Both independent critics agree with every score.</signal:APPROVED>'
      elif [ "${round:-1}" -le "$REWORK_LIMIT" ]; then
        critique="$(printf '%s' "$verdict" | jq -c '.critique | tojson | gsub("</signal:var>"; "") | fromjson? // {}')"
        printf '<signal:var key=critique>%s</signal:var>\n' "$critique"
        printf '<signal:var key=round>%s</signal:var>\n' "$(( ${round:-1} + 1 ))"
        echo '<signal:REVISE>The critics disagree with the audit. The auditor revises it within the configured limit.</signal:REVISE>'
      else
        printf '%s' "$verdict" | jq -r --arg limit "$REWORK_LIMIT" '"ac-auditor stopped after " + $limit + " reworks. " +
          (.critique | to_entries | map(.key + ": " + ((((.value.disputed[0] | select(.) | .item + ": " + .evidence) //
            (.value.findings[0] | select(.) | .problem) // .value.invalid // .value.summary // "no agreement") +
            ((.value.findings[0] | select(.) | " Fix: " + (.advice // "")) // "")) | .[0:400])) | join(" "))' |
          cut -c1-1000 > "$a/failure.txt"
        echo '<signal:DISPUTED>The critics still disagree with the revised audit.</signal:DISPUTED>'
      fi
    on_signal:
      APPROVED: publish
      REVISE: auditor
      DISPUTED: disputed
      __failed__: failed
      __default__: failed
  disputed:
    # Owner, 21 Nov 2026: an audit still disputed or invalid after the rework limit is a failed audit. The AC goes to
    # to_decide with a note: the last scores and the objections (disputed.jq). Else it stays in to_audit unchanged.
    shell: |
      set -eu
      a="$MEDULLA_RUN_DIR/artifacts"
      file="$(printf '%s' "$FLOW_PUBLICATION" | jq -er '.file | select(type == "string" and test("^[A-Za-z0-9._-]+[.]json$"))')"
      draft="$a/draft.json"; [ -f "$draft" ] || draft=/dev/null
      jq -L "$MEDULLA_WORKFLOW_DIR" -n --rawfile reason "$a/failure.txt" --slurpfile input "$a/input.json" --slurpfile draft "$draft" \
        --arg run "$(basename "$MEDULLA_RUN_DIR")" --arg date "$(date -u +%F)" --arg stages "$STAGE_WRITES" --arg fail_limit "$AUDIT_FAIL_LIMIT" --arg fail_tag "$AUDIT_FAIL_TAG" \
        -f "$MEDULLA_WORKFLOW_DIR/disputed.jq" > "$a/$file"
      echo '<signal:RELEASE>Return the AC to to_decide with the scores and the objections.</signal:RELEASE>'
    on_signal:
      RELEASE: publish
      __failed__: failed
      __default__: failed
  publish:
    # The shared stage adds the claim release and refuses operations outside config.publication.
    shell: |
      rc=0
      "$PLANNING_PYTHON" "$CREW_FLOW_STAGES" publish || rc=$?
      exit "$rc"
    on_signal:
      READY: __exit_ok__
      BLOCKED: __exit_fail__
      __failed__: failed
      __default__: failed
  failed:
    # A shared stage that already recorded result.json released or retained its claim. Do not repeat it.
    shell: |
      set -eu
      a="$MEDULLA_RUN_DIR/artifacts"
      if [ -e "$a/result.json" ]; then
        echo '<signal:BLOCKED>The shared stage already recorded the result.</signal:BLOCKED>'
        exit 0
      fi
      [ -s "$a/failure.txt" ] || printf '%s\n' "${MEDULLA_LAST_MESSAGE:-ac-auditor stopped before publication}" | cut -c1-1000 > "$a/failure.txt"
      exec "$PLANNING_PYTHON" "$CREW_FLOW_STAGES" fail
    on_signal:
      BLOCKED: __exit_fail__
      __failed__: __exit_fail__
      __default__: __exit_fail__
