version: '2'
start: prepare
timeout: 1800
defaults:
  timeout: 120
nodes:
  prepare:
    shell: 'node "$MEDULLA_WORKFLOW_DIR/stages.mjs" prepare'
    on_signal:
      PREPARED: audit
      __timeout__: __exit_fail__
      __failed__: __exit_fail__
  audit:
    timeout: 900
    max_attempts: 2
    agent:
      harness: codex
      model: '{{var:AUDIT_MODEL}}'
      effort: high
      sandbox: read-only
      args:
        - --ignore-user-config
        - -c
        - '{{var:AUDIT_MCP_TOML}}'
    prompt: |
      You are the code auditor.
      Read and follow {{var:AUDIT_INSTRUCTIONS}}.

    post: 'node "$MEDULLA_WORKFLOW_DIR/stages.mjs" capture audit'
    on_signal:
      FINDINGS: review
      NO_FINDINGS: finish
      __timeout__: __exit_fail__
      __failed__: __exit_fail__
      __default__: __exit_fail__
  review:
    timeout: 600
    max_attempts: 2
    agent:
      harness: claude-code
      model: '{{var:REVIEW_MODEL}}'
      effort: high
      sandbox: read-only
      args:
        - --strict-mcp-config
        - --setting-sources=
        - --mcp-config
        - '{{var:AUDIT_MCP_CONFIG}}'
        - --allowedTools
        - '{{var:AUDIT_READ_TOOLS}}'
    prompt: |
      You are the code audit verifier.
      Read and follow {{var:AUDIT_REVIEW_INSTRUCTIONS}}.

    post: 'node "$MEDULLA_WORKFLOW_DIR/stages.mjs" capture review'
    on_signal:
      REVIEWED: finish
      __timeout__: __exit_fail__
      __failed__: __exit_fail__
      __default__: __exit_fail__
  finish:
    shell: 'node "$MEDULLA_WORKFLOW_DIR/stages.mjs" finish'
    on_signal:
      AUDITED: __exit_ok__
      __timeout__: __exit_fail__
      __failed__: __exit_fail__
