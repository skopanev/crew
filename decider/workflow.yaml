# Scheme crew_team, step Decider. READY moves the AC to READY_STAGE and sets returns to 0. GAP and CONFLICT add
# the question tag and keep the stage and returns. A decision that the critics reject keeps the stage and adds 1
# to returns. At RETURNS_LIMIT the AC gets STUCK_TAG and a question to the Owner. A technical failure (an invalid
# draft or critic output, a search error) changes nothing.
# MOVE and SPLIT (split-move.mjs) add host-built creates and a parent change. New parts start in NEW_STAGE.
version: '2'
keep_runs: 1000
start: prepare
timeout: &budget 7200
on_timeout: failed
defaults:
  timeout: *budget
vars:
  PLANNING_PYTHON: python3
  CREW_FLOW_STAGES: ''
  FLOW_PUBLICATION: ''
  AUTHOR_MODEL: ''
  CRITIC_CODEX_MODEL: ''
  CRITIC_SECOND_HARNESS: ''
  CRITIC_SECOND_MODEL: ''
  BRAIN_ROOT: ''
  MANUALS_ROOT: ''
  BRAIN_EXCLUDE: ''
  # The host command that sends the frozen archive plan of DUPLICATE or OBSOLETE. It gets the artifacts folder.
  ARCHIVE_HOOK: ''
  REWORK_LIMIT: '1'
  READY_STAGE: ''
  NEW_STAGE: ''
  READER_KINDS: source
  RETURNS_LIMIT: ''
  STUCK_TAG: ''
  CTO_TAG: ''
  CEO_TAG: ''
  # Business dry runs still claim and release. Root trials replace prepare and publication locally.
  DRY_RUN: 'false'
  round: '1'
  shape_retries: '0'
  shape_feedback: ''
  decider_ac: ''
  decider_artifacts: ''
  decider_feedback: ''
  decider_author_reader_config: ''
  decider_author_reader_home: ''
  decider_critic_reader_config: ''
  decider_critic_reader_home: ''
  DECIDER_MCP_CONFIG: ''
  draft: ''
  draft_digest: ''
  context_digest: ''
  critique: ''
nodes:
  prepare:
    shell: |
      set -eu
      node "$MEDULLA_WORKFLOW_DIR/control.mjs" policy
      prepared="$(FLOW_ASSIGNMENT_INLINE=false "$PLANNING_PYTHON" "$CREW_FLOW_STAGES" prepare)"
      printf '%s\n' "$prepared" | grep -v -e '^<signal:PREPARED>' -e '^<signal:var key=assignment>' || true
      case "$prepared" in *'<signal:PREPARED>'*) ;; *) exit 0 ;; esac
      "$PLANNING_PYTHON" "$MEDULLA_WORKFLOW_DIR/context.py" prepare
      # The shared reader reads only these files. The author also gets the settings and the retry files.
      a="$MEDULLA_RUN_DIR/artifacts" reader="$(dirname "$CREW_FLOW_STAGES")/agent-reader.mjs"
      files() { jq -nc --arg a "$a" '$ARGS.positional | map($a + "/" + .)' --args "$@"; }
      node "$reader" prepare decider_author "$(files contract-decider.md contract-audit.md decider-settings.json decider-assignment.json draft.json critique.json shape-feedback.json)" "$a/reader-mcp.json"
      node "$reader" prepare decider_critic "$(files contract-decider.md contract-audit.md decider-assignment.json draft.json)" "$a/reader-mcp.json"
      echo '<signal:PREPARED>The decision context and the live contracts are ready.</signal:PREPARED>'
    on_signal:
      PREPARED: author
      BLOCKED: __exit_fail__
      __failed__: failed
      __default__: failed
  author:
    max_attempts: 2
    env:
      LANE_MEMORY_CONFIG: ''
      JOPPA_TOKEN: ''
      JOPPA_TOKEN_FILE: ''
      NTK_KEY: ''
      NTK_CONFIG: /dev/null
    agent:
      harness: claude-code
      model: '{{var:AUTHOR_MODEL}}'
      effort: high
      sandbox: read-only
      args:
        - --strict-mcp-config
        - --setting-sources=
        - --mcp-config
        - '{{var:decider_author_reader_config}}'
        - --tools=Read,Glob,Grep
        - --add-dir
        - '{{var:BRAIN_ROOT}}'
        - --add-dir
        - '{{var:MANUALS_ROOT}}'
    prompt: |
      {{file:prompts/author.md}}
      AC: {{var:decider_ac}}
      {{var:decider_feedback}}
    post: '"$PLANNING_PYTHON" "$CREW_FLOW_STAGES" capture draft'
    on_signal:
      CAPTURED: draft_check
      __failed__: failed
      __default__: failed
  draft_check:
    shell: |
      set -eu
      node "$MEDULLA_WORKFLOW_DIR/control.mjs" check "$MEDULLA_RUN_DIR/artifacts"
    on_signal:
      CHECKED: freeze
      REVISE: author
      FAILED: failed
      __failed__: failed
      __default__: failed
  freeze:
    shell: |
      set -eu
      rm -f "$MEDULLA_RUN_DIR/artifacts/critic-codex.json" "$MEDULLA_RUN_DIR/artifacts/critic-second.json" "$MEDULLA_RUN_DIR/artifacts/freeze-issues.json"
      "$PLANNING_PYTHON" "$MEDULLA_WORKFLOW_DIR/context.py" freeze
      node "$MEDULLA_WORKFLOW_DIR/control.mjs" digest "$MEDULLA_RUN_DIR/artifacts"
    on_signal:
      FROZEN: critics
      REVISE: author
      FAILED: failed
      __failed__: failed
      __default__: failed
  critics:
    max_attempts: 2
    env:
      LANE_MEMORY_CONFIG: ''
      JOPPA_TOKEN: ''
      JOPPA_TOKEN_FILE: ''
      NTK_KEY: ''
      NTK_CONFIG: /dev/null
    max_parallel: 2
    min_success: 2
    inputs:
      shell: |
        set -eu
        seats="$(node "$(dirname "$CREW_FLOW_STAGES")/agent-reader.mjs" seats "$decider_critic_reader_config" "$decider_critic_reader_home")"
        # A seat without the reader would judge the decision blind. Fail the node instead.
        printf '%s' "$seats" | jq -e --arg c "$decider_critic_reader_config" 'length == 2 and all(.[]; (.env.BROKER_AGY_HOME // "") != "" or
          ([to_entries[] | select(.key | test("^a[0-9]+$")) | .value] | any((startswith("mcp_servers") and contains("joppa")) or . == $c)))' >/dev/null
        printf '%s\n' "$seats"
    agent:
      harness: '{{input.harness}}'
      model: '{{input.model}}'
      effort: high
      sandbox: read-only
      args:
        - '{{input.a1:-}}'
        - '{{input.a2:-}}'
        - '{{input.a3:-}}'
        - '{{input.a4:-}}'
        - '{{input.a5:-}}'
        - '{{input.a6:-}}'
        - '{{input.a7:-}}'
        - '{{input.a8:-}}'
        - '{{input.a9:-}}'
        - '{{input.a10:-}}'
        - '{{input.a11:-}}'
        - '{{input.a12:-}}'
        - '{{input.a13:-}}'
    prompt: |
      {{file:prompts/critic.md}}
      AC: {{var:decider_ac}}
      Draft: {{var:decider_artifacts}}/draft.json
    post: '"$PLANNING_PYTHON" "$CREW_FLOW_STAGES" capture "critic-$(printf %s "$MEDULLA_INPUT" | jq -r .slug)"'
    on_signal:
      __done__: review_join
      __failed__: failed
      __empty__: failed
  review_join:
    shell: |
      set -eu
      node "$MEDULLA_WORKFLOW_DIR/control.mjs" review "$MEDULLA_RUN_DIR/artifacts"
    on_signal:
      APPROVED: publish
      ARCHIVE: archive
      REVISE: author
      REJECTED: rejected
      FAILED: failed
      __failed__: failed
      __default__: failed
  rejected:
    # Release the claim with the AC in its stage, returns + 1 and the full reason as a note.
    shell: |
      set -eu
      node "$MEDULLA_WORKFLOW_DIR/control.mjs" rejected "$MEDULLA_RUN_DIR/artifacts"
    on_signal:
      RETURN: publish
      __failed__: failed
      __default__: failed
  archive:
    # DUPLICATE or OBSOLETE. The hook stops the own lanes of the AC and waits until they finish. It writes a fresh read of
    # the own children to archive-children.json. archive.mjs plan freezes the plan: Tests, Tasks, then the AC.
    # The hook sends each batch with its receipt (archive.mjs next) and records result.json.
    # Without a configured hook this is a technical failure, and nothing changes.
    shell: |
      set -eu
      a="$MEDULLA_RUN_DIR/artifacts"
      "$PLANNING_PYTHON" "$MEDULLA_WORKFLOW_DIR/context.py" verify
      if [ -z "$ARCHIVE_HOOK" ]; then
        echo 'Decider technical failure: ARCHIVE_HOOK is not configured, so the approved archive is not sent.' > "$a/failure.txt"
        echo '<signal:FAILED>ARCHIVE_HOOK is not configured.</signal:FAILED>'
        exit 0
      fi
      $ARCHIVE_HOOK "$a"
    on_signal:
      READY: __exit_ok__
      BLOCKED: __exit_fail__
      FAILED: failed
      __failed__: failed
      __default__: failed
  publish:
    shell: |
      set -eu
      "$PLANNING_PYTHON" "$MEDULLA_WORKFLOW_DIR/context.py" verify
      "$PLANNING_PYTHON" "$CREW_FLOW_STAGES" publish
    on_signal:
      READY: __exit_ok__
      BLOCKED: __exit_fail__
      __failed__: failed
      __default__: failed
  failed:
    shell: |
      set -eu
      a="$MEDULLA_RUN_DIR/artifacts"
      if [ -e "$a/result.json" ]; then
        echo '<signal:BLOCKED>The shared stage already recorded the result.</signal:BLOCKED>'
        exit 0
      fi
      [ -s "$a/failure.txt" ] || printf '%s\n' "${MEDULLA_LAST_MESSAGE:-Decider stopped before publication}" > "$a/failure.txt"
      exec "$PLANNING_PYTHON" "$CREW_FLOW_STAGES" fail
    on_signal:
      BLOCKED: __exit_fail__
      __failed__: __exit_fail__
      __default__: __exit_fail__
