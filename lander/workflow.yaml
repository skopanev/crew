version: '2'
start: prepare
# The launcher overrides this default from config.workflow_timeout_seconds.
# The workflow deadline invokes failed once to release its claim.
timeout: &workflow_timeout 3600
on_timeout: failed
# Override Medulla's shorter action fallback with the same global budget.
defaults:
  timeout: *workflow_timeout
vars:
  CONFIGURED_TIMEOUT_PROTOCOL: '1'
  PLANNING_PYTHON: python3
  CREW_FLOW_STAGES: ''
  WORKTREE_ROOT: ''
  FAILED_DATA: ''
nodes:
  prepare:
    shell: |
      set -eu
      [ -n "$WORKTREE_ROOT" ] && [ -n "$FAILED_DATA" ]
      exec "$PLANNING_PYTHON" "$CREW_FLOW_STAGES" prepare
    on_signal:
      PREPARED: build
      __failed__: failed
      __default__: failed
  build:
    shell: 'node "${CREW_FLOW_WORKFLOW_DIR:-$MEDULLA_WORKFLOW_DIR}/lander.mjs" build'
    on_signal:
      BUILT: verify
      REPORT: publish
      __failed__: failed
      __default__: failed
  verify:
    shell: '"$PLANNING_PYTHON" "$CREW_FLOW_STAGES" verify'
    on_signal:
      VERIFIED: push
      __failed__: failed
      __default__: failed
  push:
    shell: 'node "${CREW_FLOW_WORKFLOW_DIR:-$MEDULLA_WORKFLOW_DIR}/lander.mjs" push'
    on_signal:
      REPORT: publish
      __failed__: failed
      __default__: failed
  publish:
    shell: '"$PLANNING_PYTHON" "$CREW_FLOW_STAGES" publish'
    on_signal:
      READY: complete_ac
      BLOCKED: complete_ac
      __failed__: failed
      __default__: failed
  complete_ac:
    shell: 'node "${CREW_FLOW_WORKFLOW_DIR:-$MEDULLA_WORKFLOW_DIR}/ac-completion.mjs"'
    on_signal:
      READY: clean_success
      BLOCKED: clean_failure
      __failed__: failed
      __default__: failed
  failed:
    shell: |
      set -eu
      if [ -e "$MEDULLA_RUN_DIR/artifacts/result.json" ]; then
        echo '<signal:BLOCKED>The shared stage already recorded the result.</signal:BLOCKED>'
      else
        "$PLANNING_PYTHON" "$CREW_FLOW_STAGES" fail
      fi
      node "${CREW_FLOW_WORKFLOW_DIR:-$MEDULLA_WORKFLOW_DIR}/lander.mjs" cleanup
    on_signal:
      __default__: __exit_fail__
      __failed__: __exit_fail__
  clean_success:
    shell: 'node "${CREW_FLOW_WORKFLOW_DIR:-$MEDULLA_WORKFLOW_DIR}/lander.mjs" cleanup'
    on_signal:
      __default__: __exit_ok__
      __failed__: __exit_fail__
  clean_failure:
    shell: 'node "${CREW_FLOW_WORKFLOW_DIR:-$MEDULLA_WORKFLOW_DIR}/lander.mjs" cleanup'
    on_signal:
      __default__: __exit_fail__
      __failed__: __exit_fail__
