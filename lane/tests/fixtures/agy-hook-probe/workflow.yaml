# Probe which native AGY hook events reach a command inside the lane image.
# Run from the Crew root:
#   medulla --docker --cwd-ro -w lane/tests/fixtures/agy-hook-probe --runs-folder <dir>
# The hooks file goes into the container-private $HOME only. The log keeps event names,
# input keys and tool names, never prompt text, transcripts or tokens.
version: '2'
start: install_hooks
timeout: 180
defaults:
  timeout: 30
vars:
  AGY_MODEL: gemini-4-carbon-high
nodes:
  install_hooks:
    on_signal:
      OK: probe
      __done__: __exit_fail__
      __failed__: __exit_fail__
      __timeout__: __exit_fail__
      __default__: __exit_fail__
    shell: |
      set -eu
      # Write only into a container HOME: refuse a host run and a root container.
      [ "${MEDULLA_DOCKER:-}" = 1 ] && [ "$(id -u)" != 0 ] || {
        echo 'probe needs medulla --docker and a non-root container user'; exit 1; }
      # Report only paths, metadata and booleans. Never print credential values.
      printf 'auth diagnostic: uid=%s gid=%s HOME=%s\n' "$(id -u)" "$(id -g)" "$HOME"
      for path in /.dockerenv /run/.containerenv; do
        if [ -e "$path" ]; then printf '%s: present\n' "$path"; else printf '%s: absent\n' "$path"; fi
      done
      for name in agy broker-agy sudo dbus-daemon gnome-keyring-daemon secret-tool; do
        printf '%s: ' "$name"
        command -v "$name" || echo missing
      done
      printf 'DBUS_SESSION_BUS_ADDRESS present: %s\n' "$(test -n "${DBUS_SESSION_BUS_ADDRESS:-}" && echo true || echo false)"
      printf 'BROKER_ACTIVE present: %s\n' "$(test -n "${BROKER_ACTIVE:-}" && echo true || echo false)"
      file_info() {
        printf '%s: ' "$1"
        if [ ! -f "$1" ]; then echo absent; return; fi
        stat -Lc 'size=%s uid=%u gid=%g mode=%a' "$1"
        printf 'readable: %s\n' "$(test -r "$1" && echo true || echo false)"
      }
      for path in /mnt/agy-token /mnt/agy-safe-key \
        /mnt/gemini/antigravity-cli/antigravity-oauth-token \
        "$HOME/.gemini/antigravity-cli/antigravity-oauth-token"; do file_info "$path"; done
      token="$HOME/.gemini/antigravity-cli/antigravity-oauth-token"
      if [ -r "$token" ]; then
        if jq -e 'type == "object"' "$token" >/dev/null 2>&1; then
          jq -c '{valid_json: true, has_id_token: ((.id_token | type) == "string" and (.id_token | length) > 0)}' "$token"
        else echo 'valid_json: false'; fi
      fi
      if command -v secret-tool >/dev/null 2>&1; then
        if timeout 5s secret-tool lookup service gemini username antigravity >/dev/null 2>&1; then
          echo 'keyring lookup: success'
        else echo 'keyring lookup: unavailable'; fi
      fi
      mkdir -p "$HOME/.gemini/config" "$MEDULLA_RUN_DIR/artifacts"
      [ ! -e "$HOME/.gemini/config/hooks.json" ] || { echo 'hooks.json already exists; probe refused'; exit 1; }
      log="$MEDULLA_RUN_DIR/artifacts/agy-hooks.jsonl"
      hook="$HOME/agy-hook-probe.sh"
      cat > "$hook" <<HOOK
      #!/bin/sh
      # Record the event (argv), the input keys, the tool name and argument keys, one node env value and cwd.
      jq -c --arg event "\$1" --arg env "\${PROBE_ENV:-}" --arg cwd "\$(pwd)" '
        {event: \$event, probeEnv: \$env, cwd: \$cwd, inputKeys: (keys? // []),
         hookEventName: (.hookEventName? // null), toolName: (.toolCall.name? // null),
         toolArgKeys: ((.toolCall.args? // {}) | keys? // []), terminationReason: (.terminationReason? // null)}
      ' >> "$log" 2>/dev/null || echo "{\"event\":\"\$1\",\"inputKeys\":null}" >> "$log"
      case "\$1" in PreToolUse) echo '{"decision":"allow"}' ;; *) echo '{}' ;; esac
      HOOK
      chmod +x "$hook"
      jq -n --arg h "$hook" '
        def flat(e): [{type: "command", command: ("sh " + $h + " " + e), timeout: 20}];
        def grouped(e): [{matcher: ".*", hooks: flat(e)}];
        {"crew-probe": {SessionStart: flat("SessionStart"), PreInvocation: flat("PreInvocation"),
          PostInvocation: flat("PostInvocation"), Stop: flat("Stop"),
          PreToolUse: grouped("PreToolUse"), PostToolUse: grouped("PostToolUse")}}' > "$HOME/.gemini/config/hooks.json"
      agy --version
      echo '<signal:OK>hooks installed</signal:OK>'
  probe:
    timeout: 120
    env:
      PROBE_ENV: node-env-visible
    on_signal:
      __done__: report
      __failed__: report
      __timeout__: report
      __empty__: report
      __default__: report
    agent:
      harness: agy
      model: '{{var:AGY_MODEL}}'
    prompt: |
      Use your terminal tool once to run the command `true`. Then reply with the single word DONE.
  report:
    on_signal:
      OK: __exit_ok__
      __done__: __exit_fail__
      __failed__: __exit_fail__
      __timeout__: __exit_fail__
      __default__: __exit_fail__
    shell: |
      set -eu
      log="$MEDULLA_RUN_DIR/artifacts/agy-hooks.jsonl"
      touch "$log"
      counts="$(jq -sc 'reduce .[] as $row ({SessionStart: 0, PreInvocation: 0, PreToolUse: 0, PostToolUse: 0,
        PostInvocation: 0, Stop: 0}; .[$row.event] += 1)' "$log")"
      echo "hook event counts: $counts"
      # One SessionStart from a failed sign-in must not pass: a tool call and the stop must also arrive.
      jq -e 'all(.SessionStart, .PreToolUse, .PostToolUse, .Stop; . > 0)' <<<"$counts" >/dev/null || {
        echo "required native events are missing; see $log"; exit 1; }
      echo "<signal:OK>hook events recorded in $log</signal:OK>"
