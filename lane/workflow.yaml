version: '2'
start: ntk_claim
timeout: 86400
defaults:
  timeout: 300
vars:
  REJECT_ROUNDS: '3'
  ticket_title: ''
  gate_commands: '[]'
  TOOLING_ROOT: /workspace
  LANE_PATH: /home/medulla/.bun/bin:/home/medulla/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
nodes:
  ntk_claim:
    env:
      # СБОРКА КОНТРАКТА РАЗВЕДКИ ИДЁТ ОТСЮДА, а equill требует имя пишущего
      # из окружения и отказывает ДО чтения стора, если его нет. Пусковик обе
      # переменные передаёт, узлу их надо только принять.
      EQUILL_ACTOR: '{{var:EQUILL_ACTOR}}'
      EQUILL_STORE: '{{var:EQUILL_STORE}}'
      LANE_PATH: '{{var:LANE_PATH}}'   # читает inject.sh, не тело узла
      # Нужны ЗДЕСЬ, а не только у агентных узлов: codex-home.sh пишет их в
      # config.toml дома кодекса. Кодекс запускает MCP-сервер сам и окружение
      # узла ему не передаёт - в прогоне eead888a оба поиска вернули
      # "project not found or not indexed" именно поэтому.
      CBM_MCP_COMMAND: '{{var:CBM_MCP_COMMAND}}'
      TOOLING_ROOT: '{{var:TOOLING_ROOT}}'
      project_dir: '{{var:project_dir}}'
      project_name: '{{var:project_name}}'
      ticket_id: '{{var:ticket_id}}'
    timeout: 120
    on_signal:
      CLAIM_REFUSED: notify_failure
      __failed__: notify_failure
      __default__: cbm_discovery
    shell: |
      set -euo pipefail
      mkdir -p "$MEDULLA_RUN_DIR/artifacts"
      rm -f "$MEDULLA_RUN_DIR/artifacts/claim.json"
      cd "${project_dir}"
      bash "${TOOLING_ROOT}/lane/hooks/inject.sh" \
        /tmp/lane-settings.json \
        "${TOOLING_ROOT}/lane/hooks/claude-settings.json"
      # Разведке отнимается ЗАПИСЬ В ДЕРЕВО. Два прогона подряд она создавала
      # файлы (zz-probe2.mjs, repro-tmp.mjs) и убирала за собой - но права быть
      # не должно: узел выносит вердикт, а не правит код. Через deny, а не
      # через режим плана: план глушит MCP, а разведка без CBM бессмысленна.
      jq '.permissions.deny += ["Write","Edit","NotebookEdit"]' \
        /tmp/lane-settings.json > /tmp/lane-settings-scout.json
      # Дом кодекса: хуки те же пять событий из того же файла, плюс MCP в
      # config.toml - кодекс не принимает --settings и --mcp-config.
      bash "${TOOLING_ROOT}/lane/hooks/codex-home.sh" \
        /tmp/codex-home /tmp/lane-settings.json
      # The server claims atomically; the launcher's queue preview never claims.
      claim="$MEDULLA_RUN_DIR/artifacts/claim.json"
      if ! bash "${TOOLING_ROOT}/lane-launcher/ntk-status" "${ticket_id}" -W "${project_name}" -s in_progress --claim > "$claim.raw" 2> "$claim.err"; then
        cat "$claim.err" >&2
        echo "<signal:CLAIM_REFUSED>claim not confirmed for ${ticket_id}; see artifacts/claim.json.err. Ticket unchanged by failure handling.</signal:CLAIM_REFUSED>"
        exit 0
      fi
      jq -e --arg id "$ticket_id" --arg ws "$project_name" --arg run "$MEDULLA_RUN_DIR" '
        select(.claimed == true and .status == "in_progress" and
          (.id | ascii_downcase) == ($id | ascii_downcase)) |
        . + {workspace: $ws, run_dir: $run}
      ' "$claim.raw" > "$claim.tmp"
      mv "$claim.tmp" "$claim"
      # Full ticket body and acceptance criteria, read by shell over HTTP.
      node "${TOOLING_ROOT}/lane/bin/ticket-input.mjs"
      # КОНТРАКТ РАЗВЕДЧИКА ТОЖЕ ФАЙЛОМ, по образцу контракта панели. Хук был
      # единственным путём, и держался он на --dangerously-bypass-hook-trust;
      # с codex 0.154.0 флаг больше не включает хуки, а РУШИТ оборот.
      # Через временный файл: `>` обрезает цель ДО запуска, и при отказе
      # equill остаётся файл нулевой длины - агент читает "контракт пустой"
      # вместо "контракта нет" и тратит на это круг. Замерено.
      mkdir -p "$MEDULLA_RUN_DIR/artifacts"
      _sc="$MEDULLA_RUN_DIR/artifacts/scout-contract.txt"
      if equill context --store "${EQUILL_STORE:-$HOME/.equill/dev}" \
           --profile agent.context.target --role crew-lane-scout \
           --process crew-lane-scout --coordinate rules=none --json 2>"$_sc.err" \
         | jq -r '.content // empty' > "$_sc.tmp" && [ -s "$_sc.tmp" ]; then
        mv "$_sc.tmp" "$_sc"
      else
        rm -f "$_sc.tmp" "$_sc"
        echo "контракт разведки не собрался ($(head -1 "$_sc.err" 2>/dev/null)) - узел пойдёт на одном промпте" >&2
      fi
      rm -f "$_sc.err"
  cbm_discovery:
    timeout: 900
    env:
      EQUILL_ROLE: crew-lane-scout
      CODEX_HOME: /tmp/codex-home
      # ОБЩАЯ ГРУППА, как у флота. Координата называет ПРЕДМЕТ - comm или
      # tickets, - а сужает её поле role внутри записи. Своей группы у полосы
      # нет и не нужно: замерено, что в роли lane, pm и triage наши записи не
      # попадают НИ ПРИ КАКИХ координатах, отсекает адресат.
      # Значение medulla я завёл по ошибке, прочитав "назвать медулла" как
      # заказ на координату, хотя речь была о ролях. Снято.
      EQUILL_RULES: none
      # ВЫДАЧА УРОКОВ. Без него хук выходит на строке 203 - "unset profile
      # disables retrieval" - молча, без предупреждения. Так у нас НИ РАЗУ
      # не приехало ни одного урока: событие было ни при чём, выдачу просто
      # никогда не включали. Флотский пусковик ставит его с самого начала.
      EQUILL_PROMPT_PROFILE: agent.memory.hybrid
      EQUILL_RULE_MODULES: tickets # и снимает tools.rtk: в образе rtk НЕТ, проверено запуском
      EQUILL_PROCESS: crew-lane-scout
      EQUILL_TICKET: '{{var:ticket_id}}'
      EQUILL_PROJECT: '{{var:project_name}}'
      EQUILL_MODULE: '{{var:module_name}}'
      CBM_MCP_COMMAND: '{{var:CBM_MCP_COMMAND}}'
    on_signal:
      OK: create_worktree          # закрытый набор скаута: OK, DUPLICATE, OUT_OF_MODULE, PREMISE_BROKEN
      DUPLICATE: notify_failure
      # ТРИАЖА В ПОЛОСЕ НЕТ. Полоса берёт тикет, делает его, а неисполнимый
      # кладёт в blocked с причиной: резать и переформулировать задачу решает
      # человек снаружи. Записи medulla-triage в Equill принадлежат флоту и
      # этим графом не используются.
      PREMISE_BROKEN: notify_failure
      OUT_OF_MODULE: notify_failure
      __failed__: notify_failure
      __default__: notify_failure
    agent:
      harness: codex
      model: gpt-6-astra
      effort: high
      # ЧИТАЕТ, НЕ ПИШЕТ — но НЕ через sandbox: read-only. Он включает режим
      # плана, а тот блокирует MCP целиком: в прогоне 15:35 разведчик сказал
      # дословно «the mandated CBM tools are hard-blocked by plan mode» и ушёл
      # читать исходники руками. Запрет записи закрывал ровно тот инструмент,
      # ради которого узел заведён.
      # Запись отнимается списком deny: под skip-permissions он держит, это
      # замерено, в отличие от allow, который там инертен.
      # -s read-only ограничивает ТОЛЬКО shell и MCP не глушит - в отличие от
      # режима плана у claude, который закрывал CBM целиком.
      # ФЛАГА --dangerously-bypass-hook-trust ЗДЕСЬ БОЛЬШЕ НЕТ. Он ставился,
      # чтобы кодекс не пропускал наши хуки молча (прогон eead888a: журнал
      # событий ПУСТ, разведчик работал вслепую). На codex 0.154.0 он делает
      # обратное - оборот умирает с input_tokens=0, не начавшись. Слепота
      # лечится контрактом-файлом из ntk_claim, а не опасным флагом.
      args: [-s, read-only]
    prompt: |
      YOUR CONTRACT - role, ordered steps, rules - is at
      $MEDULLA_RUN_DIR/artifacts/scout-contract.txt. Read it first; it is what
      you are held to, and it is not repeated here. If that file is absent the
      contract did not build: say so plainly in your report and work from this
      prompt alone - do not invent the missing rules.

      Read the full ticket at $MEDULLA_RUN_DIR/artifacts/ticket.json, including
      its description, acceptance criteria and module. NTK MCP is not provided.
      Run the CBM preflight now: search_code and search_graph, once each, before
      any Bash; check SIMILAR_TO before writing anything new. Cite both.
      CBM is a shared host service. Its paths refer to host repositories.
      Match the returned project to the mounted repository and verify each
      relevant finding against current files under ${project_dir}. Never
      index a lane worktree or change shared CBM project paths.
      Do not survey unrelated code.

      WRITE YOUR RECONNAISSANCE TO $MEDULLA_RUN_DIR/artifacts/scout.txt BEFORE
      YOU FINISH. That file is the whole of what the coder receives from you -
      your signal is one line and carries nothing. Files you read, what you
      found where, with file:line, and what remains unknown. Say the unknowns
      plainly: the coder is told to trust this file, so a guess written as a
      finding costs more than a gap named as one.

      MANDATORY: Always ask yourself: 'Do we really need this? Can we do it simpler and more reliably?' Keep the solution extensible, minimal, and reliable. Do not overengineer.

  create_worktree:
    env:
      GIT_SSH_COMMAND: '{{var:GIT_SSH_COMMAND}}'
      project_dir: '{{var:project_dir}}'
      ticket_id: '{{var:ticket_id}}'
    # БЮДЖЕТ ИЗ ЗАМЕРА, А НЕ С ПОТОЛКА. Прогон 4df5b72f упал на 180.04 с при
    # пределе узла 180, и установка зависимостей в нём даже НЕ НАЧИНАЛАСЬ: все
    # 180 секунд ушли на сам чекаут - git выкладывал 1377 файлов на
    # примонтированный том, где Docker Desktop пишет медленно. Дорогая часть
    # здесь - выкладка дерева, а не bun. Прежние 180 на узел и 600 на установку
    # внутри были оба выдуманы и друг другу противоречили.
    timeout: 900   # the fetch cap inside is 120s, so its signal wins
    on_signal:
      READY: implement_code
      NO_GIT_KEY: notify_failure
      FETCH_FAILED: notify_failure
      NO_TARGET_BRANCH: notify_failure
      BRANCH_HAS_WORK: notify_failure
      __failed__: notify_failure
      __default__: notify_failure
    shell: |
      set -euo pipefail
      cd "${project_dir}"
      # GIT ЧИТАЕТ КОНФИГУРАЦИЮ ИЛИ НЕТ - ПРОВЕРЯЕТСЯ ПЕРВЫМ, И С ПРИЧИНОЙ.
      # Прогон b0917389 умер здесь с rc=128 и двумя строками "fatal: unknown
      # error occurred while reading the configuration files" - без указания
      # ФАЙЛА, на котором споткнулся. Вне прогона не воспроизвелось: ни ключи
      # GIT_CONFIG_*, ни хостовый .gitconfig, ни конфиг репозитория не ломались.
      # Поэтому спрашиваем git сам и сохраняем, откуда он читает.
      mkdir -p "$MEDULLA_RUN_DIR/artifacts"
      if ! git config --list --show-origin > "$MEDULLA_RUN_DIR/artifacts/git-config.txt" 2>&1; then
        echo "<signal:FETCH_FAILED>git не читает конфигурацию: $(head -2 "$MEDULLA_RUN_DIR/artifacts/git-config.txt" | tr '\n' ' ' | cut -c1-200) HOME=$HOME GIT_CONFIG_COUNT=${GIT_CONFIG_COUNT:-нет}; полный вывод: ${MEDULLA_RUN_DIR}/artifacts/git-config.txt</signal:FETCH_FAILED>"
        exit 0
      fi
      if [ -z "${GIT_SSH_COMMAND:-}" ] && git remote get-url origin | grep -q '^ssh://\|^git@'; then
        echo "<signal:NO_GIT_KEY>origin is ssh and no key was mounted; launch with --ssh-dir</signal:NO_GIT_KEY>"
        exit 0
      fi
      # Bounded INSIDE the node's 180s, so the run stops on this signal, which
      # names the reason, rather than on a timeout, which names nothing.
      out="$(timeout 120 git fetch origin 2>&1)" && rc=0 || rc=$?
      if [ "$rc" -ne 0 ]; then
        [ "$rc" -ne 124 ] || out="did not finish in 120s - unreachable host, or a key waiting on a passphrase"
        echo "<signal:FETCH_FAILED>git fetch origin exited ${rc}: $(printf '%s' "$out" | tr '\n' ' ' | cut -c1-300)</signal:FETCH_FAILED>"
        exit 0
      fi
      target=$(jq -r '.target_branch // "develop"' .ntkrc 2>/dev/null || echo develop)
      # Before it is used twice below: otherwise a wrong target_branch surfaces
      # as `worktree add` failing, which names the worktree, not the branch.
      if ! git rev-parse --verify --quiet "refs/remotes/origin/${target}" >/dev/null; then
        echo "<signal:NO_TARGET_BRANCH>origin/${target} does not exist after a successful fetch. .ntkrc says target_branch=${target}</signal:NO_TARGET_BRANCH>"
        exit 0
      fi
      # ТОЛЬКО СВОЯ ЗАПИСЬ, НИКОГДА `worktree prune`. Prune снимает регистрацию
      # у ВСЕХ ворктри, чьих каталогов нет на месте, - а деревья чужих полос
      # живут в /tmp ИХ контейнеров и из нашего невидимы. Для prune они
      # "исчезли", и он их вычистил: полоса pCY получила `fatal: not a git
      # repository: (null)` на git add, потому что её .git указывал на
      # .git/worktrees/<чужого тикета>, которого prune больше не оставил.
      # Работа чужой полосы уцелела только потому, что её коммит держал ref.
      wt_meta="$(git rev-parse --git-common-dir)/worktrees/wt-${ticket_id}"
      [ ! -d "$wt_meta" ] || rm -rf -- "$wt_meta"
      if git rev-parse --verify --quiet "refs/heads/ticket-${ticket_id}" >/dev/null; then
        n="$(git rev-list --count "origin/${target}..ticket-${ticket_id}" 2>/dev/null || echo 0)"
        [ "${n:-0}" -eq 0 ] || {
          last="$(git log -1 --format='%h %s' "ticket-${ticket_id}" 2>/dev/null || echo '?')"
          echo "<signal:BRANCH_HAS_WORK>ticket-${ticket_id} carries ${n} commit(s) not on ${target}, last: ${last}. A previous run broke - crashed, rejected by the panel, or failed to land. Look before rerunning.</signal:BRANCH_HAS_WORK>"
          exit 0; }
      fi
      # ДЕРЕВО ЖИВЁТ НА ХОСТЕ, А НЕ В /tmp КОНТЕЙНЕРА. Замер, ради которого
      # переезд: кодер отработал 12 минут, 70 вызовов, нашёл причину и написал
      # починку - узел упал, контейнер кончился, дерево ушло вместе с ним.
      # Терялась не только работа: без дерева нельзя ни посмотреть руками, ни
      # продолжить с упавшего шага через --resume или --node.
      # Каталог прогонов смонтирован с хоста: дерево переживает контейнер и
      # НЕ ВИДНО проверкам репозитория. Внутри репозитория ему не место -
      # guard сканировал его как свой исходник и валил каждый коммит в чекауте.
      mkdir -p "${LANE_WT_ROOT}"
      git worktree add -B "ticket-${ticket_id}" "${LANE_WT_ROOT}/wt-${ticket_id}" "origin/${target}" >/dev/null
      # Свежее дерево без зависимостей: ни один тест в нём не значит ничего, и
      # кодер первым делом тратит контекст на то, чтобы это обнаружить и
      # поставить. Ставим здесь. НЕ фатально: репозиторий может быть не
      # bun-овым, а отсутствие зависимостей кодер увидит сам.
      # PATH ЯВНО. Оболочечные узлы не видят bun: в прогоне 884d6f08 условие
      # срубилось на `command -v bun`, весь блок тихо пропустился, кодер получил
      # пустое дерево и пошёл ставить зависимости САМ - тратя контекст на то,
      # ради чего этот блок и написан. Записки "install failed" тоже не было:
      # не сработала вся ветка целиком.
      # Та же причина роняла посадку - хук репозитория зовёт bun и не находил.
      export PATH="/home/medulla/.bun/bin:${PATH}"
      # ПРЕДПОЛЁТ РЕПОЗИТОРИЯ - НА КАЖДЫЙ ЗАПУСК И ДО ВСЕГО ОСТАЛЬНОГО.
      # Воркфлоу обязан оставаться ОБЩИМ: что нужно ЭТОМУ проекту, чтобы свежее
      # дерево стало сборочным, знает сам проект. Объявляется в .ntkrc, который
      # тут и так читается ради target_branch:
      #     { "v": 2, ..., "preflight": "scripts/lane-preflight.sh" }
      # НЕ ВНУТРИ проверки package.json и bun: сперва я его туда и положил, и
      # тогда репозиторий на Rust своего предполёта не получил бы вовсе.
      # Замер, из-за которого это появилось: в одном из проектов пин на
      # внутренний пакет обгоняет собственный локфайл и в реестр не
      # опубликован, поэтому `bun install` не проходит НИКАК - ни с
      # --frozen-lockfile, ни без него.
      # Лечится линковкой ПОВЕРХ уже стоящих node_modules, без переустановки, и
      # порядок этот меняется от ветки к ветке - значит принадлежит репозиторию.
      deps=""
      pf="$(jq -r '.preflight // empty' "${project_dir}/.ntkrc" 2>/dev/null || true)"
      if [ -n "$pf" ]; then
        if [ -x "${LANE_WT_ROOT}/wt-${ticket_id}/$pf" ]; then
          if (cd "${LANE_WT_ROOT}/wt-${ticket_id}" && timeout 600 "./$pf" \
                > "$MEDULLA_RUN_DIR/artifacts/preflight.txt" 2>&1); then
            deps=" Repository preflight ($pf) ran."
          else
            deps=" NOTE: repository preflight ($pf) failed: $(tail -2 "$MEDULLA_RUN_DIR/artifacts/preflight.txt" 2>/dev/null | tr '\n' ' ' | cut -c1-200) Full log: ${MEDULLA_RUN_DIR}/artifacts/preflight.txt"
          fi
        else
          deps=" NOTE: .ntkrc names preflight $pf and it is not executable here."
        fi
      # Объявил предполёт - он и отвечает за зависимости; нашей установки нет.
      elif [ -f "${LANE_WT_ROOT}/wt-${ticket_id}/package.json" ] && command -v bun >/dev/null 2>&1; then
        # ПРИЧИНА ОТКАЗА СОХРАНЯЕТСЯ, А НЕ ГЛУШИТСЯ. Вывод уходил в /dev/null, и
        # сигнал говорил голое "bun install failed here": кодер шёл ставить
        # зависимости руками, а починить узел было нечем.
        if (cd "${LANE_WT_ROOT}/wt-${ticket_id}" && timeout 240 bun install --frozen-lockfile \
              > "$MEDULLA_RUN_DIR/artifacts/bun-install.txt" 2>&1); then
          deps=" Dependencies are installed."
        else
          deps=" NOTE: bun install did not complete: $(grep -iE 'error|failed' "$MEDULLA_RUN_DIR/artifacts/bun-install.txt" 2>/dev/null | tail -2 | tr '\n' ' ' | cut -c1-200) Full log: ${MEDULLA_RUN_DIR}/artifacts/bun-install.txt"
        fi
      fi
      # Находка разведчика - ТЕКСТ МОДЕЛИ. Подставлять его в исходник шелла
      # нельзя: одна кавычка внутри превращает сообщение в исполняемый код.
      # Пишем как ДАННЫЕ, через printf, и несём дальше СТАТИЧЕСКИЙ путь.
      # ТОЛЬКО ЕСЛИ РАЗВЕДЧИК НЕ НАПИСАЛ САМ. Раньше сюда всегда ложился текст
      # сигнала - 119 байт "runtime premise remains unverified, UNKNOWN", - и
      # это было всё, что доходило до кодера от узла, прочитавшего два десятка
      # файлов и съевшего 634 тысячи токенов.
      mkdir -p "$MEDULLA_RUN_DIR/artifacts"
      if [ ! -s "$MEDULLA_RUN_DIR/artifacts/scout.txt" ]; then
        printf 'РАЗВЕДЧИК НЕ ОСТАВИЛ ОТЧЁТА. Всё, что от него есть:\n%s\n' \
          "${MEDULLA_LAST_MESSAGE:-}" > "$MEDULLA_RUN_DIR/artifacts/scout.txt"
      fi
      # Shared CBM describes host repositories, which may differ from this
      # ticket worktree. Reuse the scout report, then verify cited code locally.
      echo "<signal:READY>Branch ticket-${ticket_id} is checked out at ${LANE_WT_ROOT}/wt-${ticket_id}, cut from origin/${target}.${deps:-}

      CODEBASE RECONNAISSANCE - verify its findings against your current worktree: ${MEDULLA_RUN_DIR}/artifacts/scout.txt
      Read it first. Shared CBM describes host repositories; its paths and code
      may differ from this worktree. Check cited files here before relying on a
      finding. Reuse verified findings and investigate only gaps or differences.
      Never index this worktree or change shared CBM project paths.

      Implement the ticket.</signal:READY>"
  implement_code:
    timeout: 7200   # writing the code
    env:
      EQUILL_ROLE: crew-lane-coder
      EQUILL_RULES: none
      # ВЫДАЧА УРОКОВ. Без него хук выходит на строке 203 - "unset profile
      # disables retrieval" - молча, без предупреждения. Так у нас НИ РАЗУ
      # не приехало ни одного урока: событие было ни при чём, выдачу просто
      # никогда не включали. Флотский пусковик ставит его с самого начала.
      EQUILL_PROMPT_PROFILE: agent.memory.hybrid
      EQUILL_RULE_MODULES: tickets
      EQUILL_PROCESS: crew-lane-coder
      EQUILL_TICKET: '{{var:ticket_id}}'
      EQUILL_PROJECT: '{{var:project_name}}'
      EQUILL_MODULE: '{{var:module_name}}'
      EQUILL_PHASE: unit
      CBM_MCP_COMMAND: '{{var:CBM_MCP_COMMAND}}'
      LANE_WORKTREE: '{{var:LANE_WT_ROOT}}/wt-{{var:ticket_id}}'
    on_signal:
      OK: prepare_review
      GATE_FAIL: notify_failure
      __failed__: notify_failure
      __default__: notify_failure
    agent:
      harness: claude-code
      model: claude-opus-5
      effort: high
      # ОДНА СЕССИЯ НА ВСЕ КРУГИ. Узел проходится заново после каждого отказа
      # панели, и без имени сессии это КАЖДЫЙ РАЗ новый разговор: кодер не
      # помнит ничего из написанного им же двадцать минут назад и заново читает
      # тикет, дифф и те же файлы. Замер: круг 1 - 45 вызовов и 16м, круг 2 -
      # 41 вызов и 11м на правку в несколько строк. Продолжая разговор, он
      # начинает с того, что ему сказала панель, а не с осмотра местности.
      session: coder
      args:
      - --settings
      - /tmp/lane-settings.json
      - --mcp-config
      - /tmp/codex-home/mcp.json
      - --strict-mcp-config
      - --setting-sources=
    prompt: |
      MANDATORY: Always ask yourself: 'Do we really need this? Can we do it simpler and more reliably?' Keep the solution extensible, minimal, and reliable. Do not overengineer.

      Task: {{last.message}}
      Before emitting your final signal, write $MEDULLA_RUN_DIR/artifacts/coder-report.txt:
      what you attempted, changed files, checks and their results, and any exact blocker
      with evidence and what must change to unblock the ticket. Do not create new tickets.
  prepare_review:
    env:
      TOOLING_ROOT: '{{var:TOOLING_ROOT}}'
      gate_commands: '{{var:gate_commands}}'
      module_name: '{{var:module_name}}'
      ticket_id: '{{var:ticket_id}}'
      project_dir: '{{var:project_dir}}'
      EQUILL_STORE: '{{var:EQUILL_STORE}}'
      # БЕЗ АКТОРА КОНТРАКТ ПАНЕЛИ НЕ СОБИРАЛСЯ НИ РАЗУ: equill читает имя
      # пишущего только из окружения и отказывает до чтения стора словами
      # "EQUILL_ACTOR must be supplied by the calling orchestrator". Отказ
      # уходил в 2>/dev/null, на месте оставался пустой файл, и панель шла
      # на одном промпте - молча и с виду исправно.
      EQUILL_ACTOR: '{{var:EQUILL_ACTOR}}'
    timeout: 3600
    on_signal:
      SNAPSHOT: expert_review
      GATE_FAIL: notify_failure
      NOTHING_DONE: notify_failure
      __failed__: notify_failure
      __default__: notify_failure
    shell: |
      set -euo pipefail
      cd "${LANE_WT_ROOT}/wt-${ticket_id}"
      git add -A
      # Панель СМОТРИТ ИМЕННО ЭТОТ снимок, и посадка обязана закоммитить его же.
      # Без фиксации `git add -A` после панели превратил бы любую правку
      # ревьюера — а у них есть запись в дерево — в одобренный коммит.
      tree="$(git write-tree)"
      base="$(git rev-parse HEAD)"
      # И ЕЩЁ УСЛОВИЕ: НЕТ КОММИТОВ НАД ЦЕЛЬЮ. Пустой индекс означает "ничего не
      # сделано" только на пути юнита, где кодер оставляет работу незакоммиченной.
      # Сюда же ведёт ребро git_fix→OK, а сведение конфликта КОММИТИТ само
      # (rebase --continue), и после него дерево чисто, индекс равен HEAD - по
      # одному первому условию успешно разрешённый конфликт докладывался как
      # "дерево не изменилось" и ронял прогон. Нашёл glm-architector.
      target=$(jq -r '.target_branch // "develop"' "${project_dir}/.ntkrc" 2>/dev/null || echo develop)
      if git diff --cached --quiet "$base" -- 2>/dev/null \
         && [ -z "$(git log --oneline "origin/${target}..HEAD" 2>/dev/null)" ]; then
        echo "<signal:NOTHING_DONE>кодер сказал OK, но дерево не изменилось</signal:NOTHING_DONE>"
        exit 0
      fi
      mkdir -p "$MEDULLA_RUN_DIR/artifacts"
      export PATH="/home/medulla/.bun/bin:${PATH}"
      if ! python3 "${TOOLING_ROOT}/lane/bin/gates.py" run; then
        echo "<signal:GATE_FAIL>candidate checks failed; see artifacts/gates for logs and receipts</signal:GATE_FAIL>"
        exit 0
      fi
      # КОНТРАКТ ПАНЕЛИ - ЗДЕСЬ, ПЕРЕД САМОЙ ПАНЕЛЬЮ, И ОДИН РАЗ НА ПРОГОН.
      #
      # ШТАТНЫЙ ПУТЬ КОНТРАКТА - ХУК НА СТАРТЕ СЕССИИ, и для claude и codex он
      # именно так и работает. Для панели он покрывает НЕ ВСЕХ, и вот замеры,
      # чтобы это не выяснялось заново в четвёртый раз:
      #   codex    - hooks.json того же вида, что у claude, но включить их было
      #              нечем: без --dangerously-bypass-hook-trust он МОЛЧА
      #              пропускает наш хук, а С флагом на 0.154.0 оборот умирает
      #              с input_tokens=0 (замерено соседом четырежды на
      #              Linux/x86_64; у нас тот же флаг обороты не убивал -
      #              699117 входных токенов, но защищать ему уже нечего).
      #              Флаг снят, CODEX_HOME оставлен ради MCP.
      #   agy      - хуки ЕСТЬ (~/.gemini/config/hooks.json), но словарь событий
      #              ДРУГОЙ: PreInvocation, а не SessionStart, и сгруппированы
      #              по пространству имён. Наш memory-hook.sh рассчитан на
      #              события claude. Не проверено, умеет ли PreInvocation
      #              вкладывать контекст.
      #   opencode - командных хуков НЕТ вовсе, только JS-плагины (ключ plugin).
      #              Equill подключён MCP-сервером: позвать может, вложить некому.
      # Замер прогона eeea8f74: роли crew-lane-qa в журнале хуков нет НИ РАЗУ -
      # все три места работали на одном узловом промпте, без роли и шагов.
      # Поэтому файл: один и тот же текст, читаемый тремя харнессами одинаково.
      # В узле заявки ему было не место - тикет ждал бы моста Equill; на кругах
      # ниже файл уже готов и второй раз не собирается.
      qa="$MEDULLA_RUN_DIR/artifacts/qa-contract.txt"
      # ПОЛЕ content, А НЕ СЫРОЙ ВЫВОД. В сыром у каждой записи тянется её
      # evidence - директивы, ссылки, обоснования: замер прогона 380dcd95 дал
      # 29210 байт на девяти записях. Собранный контракт - это content, 1.9 КБ.
      # ЧЕРЕЗ ВРЕМЕННЫЙ ФАЙЛ. `>` обрезает цель ДО запуска команды, поэтому
      # при отказе equill на месте остаётся файл нулевой длины - и панель
      # читает не "контракта нет", а "контракт пустой". Замерено на разведке:
      # агент честно доложил "the supplied contract is empty" и потратил круг.
      # Причина отказа бывает обыденной - профиль agent.context.target просто
      # не зарегистрирован в сторе ("registered profiles entry not found").
      if [ ! -s "$qa" ]; then
        if equill context --store "${EQUILL_STORE:-$HOME/.equill/dev}" \
             --profile agent.context.target --role crew-lane-qa --process crew-lane-qa \
             --coordinate rules=none --json 2>"$qa.err" \
           | jq -r '.content // empty' > "$qa.tmp" && [ -s "$qa.tmp" ]; then
          mv "$qa.tmp" "$qa"
        else
          rm -f "$qa.tmp" "$qa"
          echo "контракт QA не собрался ($(head -1 "$qa.err" 2>/dev/null)) - панель пойдёт на одном промпте" >&2
        fi
        rm -f "$qa.err"
      fi
      printf '%s\n%s\n' "$tree" "$base" > "$MEDULLA_RUN_DIR/artifacts/reviewed-tree.txt"
      receipt="$(python3 "${TOOLING_ROOT}/lane/bin/gates.py" verify)"
      echo "<signal:SNAPSHOT>snapshot: $tree. Declared checks passed on this tree; commands, exit codes and logs: $receipt</signal:SNAPSHOT>"
  expert_review:
    timeout: 1800
    max_parallel: 3
    # ВТОРАЯ ПОПЫТКА НА МЕСТО. Замер: agy вернулся за 9 секунд с отказом модели
    # ("Sorry, I cannot fulfill your request...") и НУЛЁМ сигналов. Харнесс при
    # этом отработал успешно, поэтому движок не считал это сбоем и не повторял.
    # Место без вердикта ломает единогласие так же, как реджект: полоса ушла в
    # TOO_MANY_ROUNDS на работе, которую два других места признали чистой.
    max_attempts: 2
    inputs:
    - harness: codex
      model: gpt-6-astra
      effort: high
      slug: architecture
      # ФЛАГ ТОЛЬКО КОДЕКСУ. Он МОЛЧА пропускает хуки, которые считает
      # непросмотренными, а наш hooks.json создаётся заново каждый прогон и
      # таким для него и выглядит. Пустые args движок выбрасывает
      # (engine_body.py:74), поэтому у остальных мест строка не появится.
      # ФЛАГ СНЯТ И ЗДЕСЬ. На codex 0.154.0 он не включает хуки, а убивает
      # оборот: два item.completed{type:"error"} и turn.completed с
      # input_tokens=0. Контракт панели с 72883ec приезжает файлом и от хуков
      # не зависит - флагу нечего защищать, а сломать он может всё место.
      task: Does this change fit the contracts and boundaries the system already has? Name every place it diverges, and what it should have done instead.
    - harness: agy
      model: Gemini 3.1 Pro (High)
      effort: high   # agy игнорирует: у него усилие в суффиксе модели. Ключ нужен,
                     # иначе {{input.effort}} не разрешится и МЕСТО УПАДЁТ — измерено.
      # ЧИСТОТА КОДА, А НЕ БЕЗОПАСНОСТЬ. На задаче "review the diff for security
      # flaws" эта модель встала в отказ - "Sorry, I cannot fulfill your
      # request...", девять секунд, ноль сигналов, - и унесла с собой посадку
      # при двух CLEAR. Здесь формулировка отказ не задевает.
      slug: codereview
      task: Naming, duplication, dead code, and anything that SAYS one thing and DOES another - stale comments, misleading names, tests that assert nothing.
    - harness: opencode
      model: zai-coding-plan/glm-5.3
      effort: high
      slug: security
      task: 'Untrusted input, permissions and secrets: what reaches this code, who is allowed to, and what leaks if it fails.'
    env:
      # БЕЗ ЭТОГО ПАНЕЛЬ РАБОТАЕТ БЕЗ КОНТРАКТА ВООБЩЕ. Замер прогона eeea8f74:
      # в журнале хуков роль crew-lane-qa не встречается НИ РАЗУ - ни одного
      # SessionStart, - потому что кодекс брал дом по умолчанию, где нашего
      # hooks.json нет. Ни роли, ни шагов, ни правил: всё поведение панели
      # задавал один узловой промпт.
      CODEX_HOME: /tmp/codex-home
      EQUILL_ROLE: crew-lane-qa
      EQUILL_RULES: none
      # ВЫДАЧА УРОКОВ. Без него хук выходит на строке 203 - "unset profile
      # disables retrieval" - молча, без предупреждения. Так у нас НИ РАЗУ
      # не приехало ни одного урока: событие было ни при чём, выдачу просто
      # никогда не включали. Флотский пусковик ставит его с самого начала.
      EQUILL_PROMPT_PROFILE: agent.memory.hybrid
      EQUILL_RULE_MODULES: tickets
      EQUILL_PROCESS: crew-lane-qa
      EQUILL_TICKET: '{{var:ticket_id}}'
      EQUILL_PROJECT: '{{var:project_name}}'
      EQUILL_MODULE: '{{var:module_name}}'
    on_signal:
      __done__: expert_review_synthesis
      __failed__: expert_review_synthesis
    agent:
      harness: '{{input.harness}}'
      model: '{{input.model}}'
      effort: '{{input.effort}}'
      args:
      - '{{input.flag:-}}'
    prompt: |
      Ticket {{var:ticket_id}}, worktree {{var:LANE_WT_ROOT}}/wt-{{var:ticket_id}}. {{input.task}}
      YOUR CONTRACT - role, ordered steps, rules - is at
      $MEDULLA_RUN_DIR/artifacts/qa-contract.txt. Read it first; it is what you
      are held to, and it is not repeated here.
      Review `git diff --cached`. Do not change the tree.
      WRITE YOUR REVIEW TO $MEDULLA_RUN_DIR/artifacts/{{input.slug}}.md IN THIS
      SHAPE, AND IN NO OTHER. The author reads that file to fix the work; prose
      around a finding is a finding they have to go hunting for.

      ## FINDINGS
      One line per finding, nothing merged, HIGHEST FIRST:

      - HIGH|MED|LOW - <claim> - <file:line> - <why it matters> - FIX: <what to do>

      HIGH stops the change, MED must be fixed but not today, LOW is worth
      knowing and nothing more. Do not inflate: a file where everything is HIGH
      sorts exactly like a file with no ratings at all.
      FIX IS A PROPOSAL AND IT SAYS HOW - the place, the change and the reason,
      so the author can accept it, adapt it, or refuse it on evidence. "The
      regression is missing" is a diagnosis with no mechanism. "Dispatch the
      second action through the real dispatcher while the first is in flight and
      require a refusal - it currently passes either way" is a proposal. A route,
      not a patch. Do not know the fix? `FIX: unknown - <what would tell you>`,
      which is information; an invented remedy stated with confidence is not.
      Small defects go in too, at LOW - a misleading name, a test that asserts
      nothing. They cost you one line and save the author a round.
      No findings? Write NONE.
      Close with one COVERAGE line, no bullet: what you actually swept and what
      you did NOT reach. That is the difference between "nothing else is wrong"
      and "I did not look".

      NEVER write into the worktree. A file left there is a file the landing has
      to reason about, and one of them already cost a run that had your
      unanimous CLEAR.

      Print your verdict as a tag on its own line: <signal:CLEAR>what is clean</signal:CLEAR> or <signal:REJECT>what you found</signal:REJECT>.
      MANDATORY: Always ask yourself: 'Do we really need this? Can we do it simpler and more reliably?' Keep the solution extensible, minimal, and reliable. Do not overengineer.

  expert_review_synthesis:
    timeout: 60
    on_signal:
      CLEAR: git_landing
      REJECT: reject_gate
      __failed__: notify_failure
      __default__: notify_failure
    shell: |
      python3 - <<'PY'
      import json, os, pathlib, sys

      VERDICTS = {"CLEAR", "REJECT"}
      manifest = os.environ.get("MEDULLA_MANIFEST_EXPERT_REVIEW", "")
      if not manifest or not os.path.isfile(manifest):
          sys.exit("нет манифеста панели")

      rows = [json.loads(l) for l in open(manifest) if l.strip()]

      def verdict(row):
          # Имя сигнала, а не разбор прозы. Два РАЗНЫХ вердикта в одной
          # строке — не вердикт: панелист процитировал шаблон.
          names = [s.get("name") for s in row.get("signals") or []]
          found = {n for n in names if n in VERDICTS}
          return found.pop() if len(found) == 1 else ""

      go, findings, notes = 0, [], []
      for r in rows:
          v = verdict(r)
          who = r.get("harness") or "?"
          line = f"- {who}: {v or 'нет вердикта'} {r.get('message') or ''}".strip()
          # ПИШЕМ ВСЕХ, И СКАЗАВШИХ CLEAR ТОЖЕ. Ревьюеру велено класть
          # неблокирующие находки в то же сообщение - раньше они молча
          # пропадали, потому что сюда попадали только реджекты.
          notes.append(line)
          if v == "CLEAR":
              go += 1
          else:
              findings.append(line)

      art = pathlib.Path(os.environ["MEDULLA_RUN_DIR"]) / "artifacts"
      art.mkdir(parents=True, exist_ok=True)
      # ДОПИСЫВАЕМ, а не перезаписываем: сигнал REJECT режется до 600 символов,
      # и reject_gate собирал историю из этих обрезков. Всё, что длиннее, молча
      # не доезжало до того, кто правит.
      with (art / "panel-findings.txt").open("a") as fh:
          fh.write("\n".join(notes) + "\n---\n")
      print(f"панель: {go} из {len(rows)} сказали CLEAR", file=sys.stderr)

      if rows and go == len(rows):
          print(f"<signal:CLEAR>все {len(rows)} ревьюера сказали CLEAR</signal:CLEAR>")
      else:
          print("<signal:REJECT>" + " ".join(findings)[:600] + "</signal:REJECT>")
      PY
  git_landing:
    env:
      ticket_title: '{{var:ticket_title}}'
      gate_commands: '{{var:gate_commands}}'
      module_name: '{{var:module_name}}'
      GIT_SSH_COMMAND: '{{var:GIT_SSH_COMMAND}}'
      project_name: '{{var:project_name}}'
      TOOLING_ROOT: '{{var:TOOLING_ROOT}}'
      project_dir: '{{var:project_dir}}'
      ticket_id: '{{var:ticket_id}}'
    timeout: 600
    on_signal:
      LAND_FAILED: notify_failure
      CONFLICT: git_fix
      REBASED: prepare_review
      __failed__: notify_failure
      __default__: cleanup
    shell: |
      set -euo pipefail
      cd "${LANE_WT_ROOT}/wt-${ticket_id}" || {
        echo "<signal:LAND_FAILED>worktree is gone</signal:LAND_FAILED>"; exit 0; }
      target=$(jq -r '.target_branch // "develop"' "${project_dir}/.ntkrc" 2>/dev/null || echo develop)

      # КОММИТ ДЕЛАЕТСЯ ЗДЕСЬ. Кодеру контракт запрещает сажать, и он правильно
      # не сажает — но и коммитить ему никто не велит, а land.sh отказывается
      # пушить грязное дерево. В первом сквозном прогоне работа дошла до сюда
      # с вердиктом CLEAR от всех троих и упёрлась ровно в это.
      # Коммитит детерминированная стадия: панель уже посмотрела ровно этот дифф.
      # КОММИТИТСЯ РОВНО ТО, ЧТО СМОТРЕЛА ПАНЕЛЬ. `git add -A` здесь означал бы,
      # что правка ревьюера — а запись в дерево у них есть — уезжает в ствол
      # как одобренная. Поэтому: снимок зафиксирован до панели, здесь сверяется.
      snap="$MEDULLA_RUN_DIR/artifacts/reviewed-tree.txt"
      [ -f "$snap" ] || { echo "<signal:LAND_FAILED>нет зафиксированного снимка панели</signal:LAND_FAILED>"; exit 0; }
      want_tree="$(sed -n 1p "$snap")"
      git diff --quiet || { echo "<signal:LAND_FAILED>дерево изменилось после панели: есть неиндексированные правки</signal:LAND_FAILED>"; exit 0; }
      # Новые файлы после проверок меняют среду кандидата: требуется новый gate.
      new_files="$(git ls-files --others --exclude-standard | head -10 | tr '\n' ' ')"
      [ -z "$new_files" ] || {
        echo "<signal:LAND_FAILED>untracked files appeared after review: ${new_files}</signal:LAND_FAILED>"; exit 0; }
      have_tree="$(git write-tree)"
      [ "$have_tree" = "$want_tree" ] || { echo "<signal:LAND_FAILED>сажаем не то, что смотрела панель: $have_tree против $want_tree</signal:LAND_FAILED>"; exit 0; }
      python3 "${TOOLING_ROOT}/lane/bin/gates.py" verify || {
        echo "<signal:LAND_FAILED>no passing gates for this candidate</signal:LAND_FAILED>"; exit 0; }

      if ! git diff --cached --quiet; then
        # ХУК РЕПОЗИТОРИЯ ЗАПУСКАЕТ bun, И ЕГО НАДО НАЙТИ. Прогон ddbcae27 дошёл
        # до посадки - панель дала CLEAR, - и встал на `nice: bun: No such file
        # or directory`: .githooks/pre-commit зовёт `nice -n 15 bun run
        # typecheck:unsafe`, а bun в окружении коммита не нашёлся. PATH образа
        # его содержит, значит теряется он в том, чем запускается тело узла.
        # Ставим явно: если он и так есть, ничего не меняется.
        # --no-verify НЕ ВАРИАНТ: land.sh отказывается от него по построению, и
        # архитектор сегодня снял разрешение на этот флаг из шага 270.
        export PATH="/home/medulla/.bun/bin:${PATH}"
        cmsg="$(git -c user.name="lane" -c user.email="lane@local" \
            commit -m "${ticket_id}: ${ticket_title:0:60}" 2>&1)" \
          || { echo "<signal:LAND_FAILED>коммит отклонён: $(printf '%s' "$cmsg" | tr '\n' ' ' | cut -c1-300)</signal:LAND_FAILED>"; exit 0; }
      fi
      [ -n "$(git log --oneline "origin/${target}..HEAD" 2>/dev/null)" ] || {
        echo "<signal:LAND_FAILED>nothing to land: no commit above origin/${target}</signal:LAND_FAILED>"; exit 0; }

      land() { rc=0; out="$("${TOOLING_ROOT}/lane/bin/land.sh" "$target" 2>&1)" || rc=$?; printf '%s\n' "$out"; }

      land
      if [ "$rc" -eq 3 ]; then
        # Ветка ушла вперёд, пока шло ревью: при параллельных полосах это норма.
        echo "${target} moved while this was in review; rebasing" >&2
        git fetch origin
        if git rebase "origin/${target}"; then
          echo "<signal:REBASED>target changed; rerun checks and review the rebased candidate</signal:REBASED>"
          exit 0
        else
          git rebase --abort || true
          tried="$(jq -r 'select(.node=="git_fix")|1' "$MEDULLA_RUN_DIR/journal.jsonl" 2>/dev/null | grep -c 1 || true)"
          if [ "${tried:-0}" -ge 1 ]; then
            echo "<signal:LAND_FAILED>rebase onto ${target} still conflicts after a fix attempt; a person has to resolve it</signal:LAND_FAILED>"
          else
            echo "<signal:CONFLICT>rebase onto ${target} conflicts: $(git status --short 2>/dev/null | head -5 | tr '\n' ' ')</signal:CONFLICT>"
          fi
          exit 0
        fi
      fi

      [ "$rc" -eq 0 ] || echo "<signal:LAND_FAILED>land.sh exited ${rc}: $(printf '%s' "$out" | tr '\n' ' ' | cut -c1-300)</signal:LAND_FAILED>"
  cleanup:
    env:
      TOOLING_ROOT: '{{var:TOOLING_ROOT}}'
      project_dir: '{{var:project_dir}}'
      project_name: '{{var:project_name}}'
      ticket_id: '{{var:ticket_id}}'
    timeout: 180
    on_signal:
      LANDED: notify_success
      LANDED_TICKET_STUCK: __exit_fail__
      __failed__: __exit_fail__
      __default__: __exit_fail__
    shell: |
      set -euo pipefail
      mkdir -p "$MEDULLA_RUN_DIR/artifacts"
      head_sha="$(git -C "${LANE_WT_ROOT}/wt-${ticket_id}" rev-parse HEAD)"
      target="$(jq -r '.target_branch // "develop"' "${project_dir}/.ntkrc" 2>/dev/null || echo develop)"
      cd "${project_dir}"
      printf 'Ticket: %s\nLanded SHA: %s\nTarget: %s\n' "$ticket_id" "$head_sha" "$target" > "$MEDULLA_RUN_DIR/artifacts/landing.txt"
      # Best-effort, но не молча: оставленное дерево следующий прогон поймает
      # как BRANCH_HAS_WORK.
      git worktree remove "${LANE_WT_ROOT}/wt-${ticket_id}" --force 2>/dev/null || left=" (дерево осталось: ${LANE_WT_ROOT}/wt-${ticket_id})"
      # Код сел — это правда. Тикет, застрявший в работе, иначе никто не заметит.
      if ! node "${TOOLING_ROOT}/lane/bin/ticket-outcome.mjs" to-test; then
        printf 'LANDED_TICKET_STUCK: %s landed at %s on %s; to_test failed after up to 3 attempts. See to-test-errors.txt. Do not rerun implementation.\n' \
          "$ticket_id" "$head_sha" "$target" > "$MEDULLA_RUN_DIR/artifacts/outcome.txt"
        cat "$MEDULLA_RUN_DIR/artifacts/outcome.txt" >&2
        exit 1
      fi
      # СИГНАЛОМ, а не голым echo. Без тега движок подставляет в сообщение своё
      # объяснение про __default__, и владелец получал его в уведомлении:
      # "no known signal emitted, so the node took __default__ ...; stdout: ..."
      printf '<signal:LANDED>сел %s на %s%s</signal:LANDED>\n' \
        "$head_sha" "$target" "${left:-}"
  notify_failure:
    env:
      TOOLING_ROOT: '{{var:TOOLING_ROOT}}'
      project_dir: '{{var:project_dir}}'
      project_name: '{{var:project_name}}'
      ticket_id: '{{var:ticket_id}}'
    timeout: 180
    on_signal:
      __failed__: __exit_fail__
      __default__: __exit_fail__
    shell: |
      msg="lane stopped on ${MEDULLA_LAST_NODE:-?} (${MEDULLA_LAST_SIGNAL:-none}) for ${ticket_id}. ${MEDULLA_LAST_MESSAGE:-}"
      mkdir -p "$MEDULLA_RUN_DIR/artifacts"
      # Before a confirmed claim, never write the ticket or touch its worktree.
      if [ "${MEDULLA_LAST_SIGNAL:-}" = "CLAIM_REFUSED" ] || ! jq -e \
        --arg id "$ticket_id" --arg ws "$project_name" --arg run "$MEDULLA_RUN_DIR" \
        '.claimed == true and .status == "in_progress" and
         (.id | ascii_downcase) == ($id | ascii_downcase) and .workspace == $ws and .run_dir == $run' \
        "$MEDULLA_RUN_DIR/artifacts/claim.json" >/dev/null 2>&1; then
        printf '%s\nNo confirmed claim; NTK was not modified.\n' "$msg" > "$MEDULLA_RUN_DIR/artifacts/failure.txt"
        cat "$MEDULLA_RUN_DIR/artifacts/failure.txt" >&2
        exit 1
      fi
      # РАБОТА СПАСАЕТСЯ ЗДЕСЬ ИЛИ НИГДЕ. Дерево живёт в контейнере, а он идёт
      # с --rm: всё несохранённое исчезает вместе с ним. Первый сквозной прогон
      # потерял двенадцать минут работы кодера ровно так — а эти две команды
      # стояли под `|| true` и упали МОЛЧА, поэтому никто не узнал.
      # И ЗДЕСЬ ТОЖЕ bun В PATH. Хук репозитория зовёт `nice -n 15 bun run
      # typecheck`, и без него коммит-спасение падает с "nice: 'bun': No such
      # file or directory" - ровно это и случилось: три раунда работы кодера
      # умерли вместе с контейнером, а артефакт честно сказал "РАБОТА НЕ
      # СОХРАНЕНА". Я чинил это в create_worktree и в git_landing, а третье
      # место, где коммит делается, пропустил.
      export PATH="/home/medulla/.bun/bin:${PATH}"
      saved=""
      if [ "${MEDULLA_LAST_SIGNAL:-}" != "CLAIM_REFUSED" ] && [ -d "${LANE_WT_ROOT}/wt-${ticket_id}" ]; then
        if [ -n "$(git -C "${LANE_WT_ROOT}/wt-${ticket_id}" status --porcelain 2>/dev/null)" ]; then
          # --no-verify ИМЕННО ЗДЕСЬ И ТОЛЬКО ЗДЕСЬ. Это не посадка: коммит никуда
          # не уезжает, он существует, чтобы работа пережила контейнер с --rm.
          # Замер: pre-commit репозитория зовёт свою проверку, та падает на
          # "ENOENT ... node_modules/<внутренний пакет>" - установка в дереве
          # неполная, - и сеть безопасности рвётся ровно там, где она нужна.
          # Посадка хуки проходит по-прежнему: land.sh отказывается от --no-verify
          # по построению.
          if git -C "${LANE_WT_ROOT}/wt-${ticket_id}" add -A 2>&1 \
             && git -C "${LANE_WT_ROOT}/wt-${ticket_id}" -c user.name=lane -c user.email=lane@local \
                    commit -q --no-verify -m "SAVE STATE: ${MEDULLA_LAST_NODE:-?}" 2>&1; then
            saved=" Работа сохранена коммитом в ветке ticket-${ticket_id}."
          else
            saved=" РАБОТА НЕ СОХРАНЕНА: коммит не прошёл, дерево умрёт с контейнером."
          fi
        else
          saved=" Сохранять нечего: дерево чистое."
        fi
      fi
      msg="${msg}${saved}"
      printf '%s\n' "$msg" > "$MEDULLA_RUN_DIR/artifacts/failure.txt"
      # Attach the full failure report: ticket bodies have a size limit.
      if ! upd="$(node "${TOOLING_ROOT}/lane/bin/ticket-outcome.mjs" blocked 2>&1)"; then
        msg="${msg} NTK outcome incomplete: ${upd}"
      fi
      # Ошибка записи статуса тоже остаётся в отчёте прогона.
      printf '%s\n' "$msg" > "$MEDULLA_RUN_DIR/artifacts/failure.txt" || exit 1
      printf '%s\n' "$msg" >&2
  notify_success:
    env:
      project_name: '{{var:project_name}}'
      module_name: '{{var:module_name}}'
      ticket_id: '{{var:ticket_id}}'
    timeout: 120
    on_signal:
      # Ошибка сохранения отчёта требует разбора уже состоявшейся посадки.
      __failed__: __exit_fail__
      __default__: __exit_ok__
    shell: |
      [ "${MEDULLA_LAST_SIGNAL:-}" = "LANDED" ] || { echo "Success requires LANDED and confirmed to_test" >&2; exit 1; }
      msg="${ticket_id} заленделся: ${MEDULLA_LAST_MESSAGE:-}"
      mkdir -p "$MEDULLA_RUN_DIR/artifacts"
      # НЕБЛОКИРУЮЩИЕ НАХОДКИ СОБИРАЮТСЯ НА ВЫХОДЕ, ИНАЧЕ ОНИ УМИРАЮТ С ПРОГОНОМ.
      # Панель обязана класть MED и LOW в свой файл: MED - чинить, но не сегодня,
      # LOW - знать и только. Работа села, тикета на них нет, и через неделю их
      # никто не вспомнит. Форма задана нами же, поэтому строки берутся as is.
      # ТИКЕТАМИ ИХ ПОЛОСА НЕ ЗАВОДИТ: файл прогона переживает контейнер, и на
      # этом её работа кончается.
      followups="$MEDULLA_RUN_DIR/artifacts/followups.txt"
      grep -h -E '^- (MED|LOW) ' "$MEDULLA_RUN_DIR"/artifacts/*.md 2>/dev/null \
        | sort -u > "$followups" || true
      n_follow="$(wc -l < "$followups" 2>/dev/null | tr -d ' ')"
      [ "${n_follow:-0}" -gt 0 ] && msg="${msg} Неблокирующих находок ${n_follow}, они в artifacts/followups.txt."
      printf '%s\n' "$msg" > "$MEDULLA_RUN_DIR/artifacts/outcome.txt" || exit 1
      printf '%s\n' "$msg"
  git_fix:
    timeout: 900
    env:
      EQUILL_ROLE: crew-lane-coder
      EQUILL_RULES: none
      # ВЫДАЧА УРОКОВ. Без него хук выходит на строке 203 - "unset profile
      # disables retrieval" - молча, без предупреждения. Так у нас НИ РАЗУ
      # не приехало ни одного урока: событие было ни при чём, выдачу просто
      # никогда не включали. Флотский пусковик ставит его с самого начала.
      EQUILL_PROMPT_PROFILE: agent.memory.hybrid
      EQUILL_RULE_MODULES: tickets
      EQUILL_PROCESS: crew-lane-coder
      EQUILL_TICKET: '{{var:ticket_id}}'
      EQUILL_PROJECT: '{{var:project_name}}'
      EQUILL_MODULE: '{{var:module_name}}'
      EQUILL_PHASE: land
      CBM_MCP_COMMAND: '{{var:CBM_MCP_COMMAND}}'
      LANE_WORKTREE: '{{var:LANE_WT_ROOT}}/wt-{{var:ticket_id}}'
    on_signal:
      # Словарь берётся из контракта: crew-lane-coder знает OK и GATE_FAIL.
      # FIXED и GIVE_UP были синонимами - вели туда же, - и жили ТОЛЬКО в
      # промпте, то есть были вторым источником правды на ровном месте.
      OK: prepare_review
      GATE_FAIL: notify_failure
      __failed__: notify_failure
      __default__: notify_failure
    agent:
      harness: claude-code
      model: claude-sonnet-5
      effort: high
      args:
      - --settings
      - /tmp/lane-settings.json
      - --mcp-config
      - /tmp/codex-home/mcp.json
      - --strict-mcp-config
      - --setting-sources=
    prompt: |
      {{last.message}}
      Before emitting your final signal, write $MEDULLA_RUN_DIR/artifacts/git-fix-report.txt:
      what you attempted, checks and their results, and any exact blocker with evidence
      and what must change to unblock the ticket. Do not create new tickets.
      MANDATORY: Always ask yourself: 'Do we really need this? Can we do it simpler and more reliably?' Keep the solution extensible, minimal, and reliable. Do not overengineer.

  reject_gate:
    env:
      REJECT_ROUNDS: '{{var:REJECT_ROUNDS}}'
    timeout: 60
    on_signal:
      TOO_MANY_ROUNDS: notify_failure
      PANEL_REJECTED: implement_code
      __failed__: notify_failure
      __default__: notify_failure
    shell: |
      set -euo pipefail
      limit="${REJECT_ROUNDS:-3}"
      # Счёт с последней починки конфликта: после неё панель смотрит сведённый
      # код, и прежние отказы к нему не относятся.
      since="$(jq -r 'select(.node=="git_fix")|.step' "$MEDULLA_RUN_DIR/journal.jsonl" 2>/dev/null | tail -1 || true)"
      since="${since:-0}"
      done_rounds="$(jq -r --argjson s "$since" 'select(.signal=="REJECT" and (.step // 0) > $s)|1' "$MEDULLA_RUN_DIR/journal.jsonl" 2>/dev/null | grep -c 1 || true)"
      done_rounds="${done_rounds:-0}"
      finding="$(jq -r --argjson s "$since" 'select(.signal=="REJECT" and (.step // 0) > $s)|.message' "$MEDULLA_RUN_DIR/journal.jsonl" 2>/dev/null | tail -1 || true)"

      # В last.message помещается только последняя находка; остальные здесь.
      mkdir -p "$MEDULLA_RUN_DIR/artifacts"
      {
        printf 'РАУНД %s ИЗ %s%s\n\nПОСЛЕДНЯЯ НАХОДКА:\n%s\n\nРАУНДЫ ПОСЛЕ ПОСЛЕДНЕЙ ПОЧИНКИ:\n' \
          "$done_rounds" "$limit" "$([ "$since" -gt 0 ] && echo ' (счёт сброшен после сведения конфликта)')" "$finding"
        jq -r --argjson s "$since" 'select(.signal=="REJECT" and (.step // 0) > $s)|"- "+.message' "$MEDULLA_RUN_DIR/journal.jsonl" 2>/dev/null || true
      } > "$MEDULLA_RUN_DIR/artifacts/rejects.txt" 2>/dev/null || true

      # Кап ДО первого сигнала: движок маршрутизирует по первому известному.
      if [ "$done_rounds" -ge "$limit" ]; then
        echo "<signal:TOO_MANY_ROUNDS>панель отклонила ${done_rounds} раз; четвёртая попытка это не починка</signal:TOO_MANY_ROUNDS>"
        exit 0
      fi

      # РАЗБОРЫ РЕВЬЮВЕРОВ НАЗЫВАЮТСЯ ПОИМЁННО. Замер прогона 380dcd95: места
      # написали architecture.md 13921 б, security.md 3812 б, codereview.md
      # 975 б - и кодер о них не знал. Ему давали panel-findings.txt, где лежат
      # ОДНОСТРОЧНЫЕ тексты сигналов, обрезанные до 600 символов на весь раунд.
      # Восемнадцать килобайт подробного ревью лежали непрочитанными, пока он
      # чинил по двум строкам, и три круга подряд чинил не то.
      reviews="$(ls "$MEDULLA_RUN_DIR"/artifacts/*.md 2>/dev/null | tr '\n' ' ')"
      printf '<signal:PANEL_REJECTED>ROUND %s OF %s. The panel rejected the work. Finding: %s -- the reviewers wrote their full reviews here, read them: %s -- verdicts of every round: %s/artifacts/panel-findings.txt</signal:PANEL_REJECTED>\n' \
        "$done_rounds" "$limit" "$finding" "${reviews:-нет}" "$MEDULLA_RUN_DIR"
