version: '2'
start: prepare
timeout: 86400
defaults:
  timeout: 300
vars:
  REJECT_ROUNDS: '3'
  ticket_title: ''
  gate_commands: '[]'
  review_commands: ''
  gate_timeout_seconds: '900'
  LAUNCH_CLAIM_FILE: ''
  TICKET_SOURCE: ntk
  TARGET_BRANCH: ''
  REPOSITORY_PREFLIGHT: __ntkrc__
  DELIVERY: target
  DELIVERY_BRANCH: ''
  REQUIREMENT_BRANCH: ''
  REQUIREMENT_HEAD: ''
  REQUIREMENT_FINAL: 'false'
  REQUIREMENT_READER_FILE: ''
  FINALIZE_ONLY: 'false'
  EQUILL_ACTOR: lane
  EQUILL_STORE: ''
  SCOUT_SOURCE: ''
  VERIFY_ONLY: 'false'
  LANE_SHARED_LOCK_DIR: ''
  ticket_test_command: '[]'
  TICKET_CHECKS: '[]'
  CBM_PROJECT: ''
  TOOLING_ROOT: /workspace
  LANE_PATH: /home/medulla/.bun/bin:/home/medulla/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
nodes:
  prepare:
    env:
      # Equill requires the calling actor to assemble the contract.
      EQUILL_ACTOR: '{{var:EQUILL_ACTOR}}'
      EQUILL_STORE: '{{var:EQUILL_STORE}}'
      LANE_PATH: '{{var:LANE_PATH}}'   # читает inject.sh, не тело узла
      # codex-home.sh embeds the shared MCP connector in Codex configuration.
      CBM_MCP_COMMAND: '{{var:CBM_MCP_COMMAND}}'
      TOOLING_ROOT: '{{var:TOOLING_ROOT}}'
      project_dir: '{{var:project_dir}}'
      project_name: '{{var:project_name}}'
      ticket_id: '{{var:ticket_id}}'
      LAUNCH_CLAIM_FILE: '{{var:LAUNCH_CLAIM_FILE}}'
    timeout: 120
    on_signal:
      READY: cbm_discovery
      REQUIREMENT_READY: create_worktree
      __failed__: notify_failure
      __timeout__: notify_failure
      __default__: notify_failure
    shell: |
      set -euo pipefail
      mkdir -p "$MEDULLA_RUN_DIR/artifacts"
      printf '<signal:var key=RUN_ARTIFACTS>%s/artifacts</signal:var>\n' "$MEDULLA_RUN_DIR"
      if [ "$FINALIZE_ONLY" = true ]; then
        jq -e -s --arg id "$ticket_id" --arg ws "$project_name" --arg run "$MEDULLA_RUN_DIR" '
          select(length == 1) | .[0] | select(.source == "joppa-finalization" and
            .id == $id and .workspace == $ws and .delivery.input.finalizeOnly == true and .delivery.plan.final == true) |
          . + {run_dir: $run}' "$LAUNCH_CLAIM_FILE" > "$MEDULLA_RUN_DIR/artifacts/claim.json"
        jq '.ticket' "$MEDULLA_RUN_DIR/artifacts/claim.json" > "$MEDULLA_RUN_DIR/artifacts/ticket.json"
        echo '<signal:REQUIREMENT_READY>Finalize completed Requirement work without a Task claim.</signal:REQUIREMENT_READY>'
        exit 0
      fi
      rm -f "$MEDULLA_RUN_DIR/artifacts/claim.json"
      # Adopt the host worker's confirmed claim. Never claim from the container.
      claim="$MEDULLA_RUN_DIR/artifacts/claim.json"
      jq -e -s --arg id "$ticket_id" --arg ws "$project_name" --arg run "$MEDULLA_RUN_DIR" '
        select(length == 1) | .[0] |
        select(.claimed == true and .status == "in_progress" and
          (.id | ascii_downcase) == ($id | ascii_downcase) and
          .workspace == $ws) |
        . + {workspace: $ws, run_dir: $run}
      ' "$LAUNCH_CLAIM_FILE" > "$claim.tmp"
      mv "$claim.tmp" "$claim"
      cd "${project_dir}"
      bash "${TOOLING_ROOT}/lane/hooks/inject.sh" \
        /tmp/lane-settings.json \
        "${TOOLING_ROOT}/lane/hooks/claude-settings.json"
      # Restrict write tools for the scout settings.
      jq '.permissions.deny += ["Write","Edit","NotebookEdit"]' \
        /tmp/lane-settings.json > /tmp/lane-settings-scout.json
      # Generate Codex hooks and MCP configuration.
      bash "${TOOLING_ROOT}/lane/hooks/codex-home.sh" \
        /tmp/codex-home /tmp/lane-settings.json
      # Full ticket body and acceptance criteria, read by shell over HTTP.
      node "${TOOLING_ROOT}/lane/bin/ticket-input.mjs"
      # Publish only a complete, nonempty Equill contract.
      mkdir -p "$MEDULLA_RUN_DIR/artifacts"
      _sc="$MEDULLA_RUN_DIR/artifacts/scout-contract.txt"
      rm -f "$_sc"
      for attempt in 1 2 3; do
        if timeout --kill-after=2s 30s equill context --store "${EQUILL_STORE:-$HOME/.equill/dev}" \
           --profile agent.context.target --role crew-lane-scout \
           --project "$project_name" \
           --process crew-lane-scout --coordinate rules=none --json >"$_sc.reply" 2>"$_sc.err" \
          && jq -er 'select(.ok != false) | .content | select(type == "string" and test("\\S"))' "$_sc.reply" >"$_sc.tmp" 2>>"$_sc.err"; then
          mv "$_sc.tmp" "$_sc"
          break
        fi
        echo "Scout contract attempt $attempt failed; response: $_sc.reply; error: $_sc.err" >&2
        [ "$attempt" -eq 3 ] || sleep 1
      done
      if [ ! -s "$_sc" ]; then
        rm -f "$_sc.tmp"
        printf '\nEquill response:\n' >> "$_sc.err"
        cat "$_sc.reply" >> "$_sc.err"
        echo "Scout contract unavailable after 3 attempts; response: $_sc.reply; error: $_sc.err" >&2
        cat "$_sc.err" >&2
        exit 1
      fi
      rm -f "$_sc.err" "$_sc.reply"
      if [ -n "${REQUIREMENT_BRANCH:-}" ]; then
        printf '<signal:var key=SCOUT_SOURCE>%s</signal:var>\n' "$LANE_WORKTREE"
        echo '<signal:REQUIREMENT_READY>Prepare the requirement checkout before source inspection.</signal:REQUIREMENT_READY>'
      else
        printf '<signal:var key=SCOUT_SOURCE>%s</signal:var>\n' "$project_dir"
        echo '<signal:READY>lane prepared</signal:READY>'
      fi
  cbm_discovery:
    timeout: 900
    env:
      EQUILL_ROLE: crew-lane-scout
      CODEX_HOME: /tmp/codex-home
      EQUILL_RULES: none
      EQUILL_PROMPT_PROFILE: agent.memory.hybrid
      EQUILL_RULE_MODULES: tickets
      EQUILL_PROCESS: crew-lane-scout
      EQUILL_TICKET: '{{var:ticket_id}}'
      EQUILL_PROJECT: '{{var:project_name}}'
      EQUILL_MODULE: '{{var:module_name}}'
      CBM_MCP_COMMAND: '{{var:CBM_MCP_COMMAND}}'
    on_signal:
      OK: create_worktree          # закрытый набор скаута: OK, DUPLICATE, OUT_OF_MODULE, PREMISE_BROKEN
      DUPLICATE: create_worktree
      PREMISE_BROKEN: notify_failure
      OUT_OF_MODULE: notify_failure
      __failed__: notify_failure
      __timeout__: notify_failure
      __default__: notify_failure
    agent:
      harness: codex
      model: gpt-6.1-sol
      effort: high
      sets: [TICKET_CHECKS]
      args: [-s, read-only]
    prompt: |
      Read {{var:RUN_ARTIFACTS}}/scout-contract.txt and execute its steps.
      Artifacts: {{var:RUN_ARTIFACTS}}.
      Task: {{var:ticket_id}}. Source: {{var:TICKET_SOURCE}}. Workspace: {{var:project_name}}.
      Module: {{var:module_name}}.
      Source checkout: {{var:SCOUT_SOURCE}}.
      CBM project: {{var:CBM_PROJECT}}.
      Repository checks: {{var:review_commands}}
      Test command: {{var:ticket_test_command}}
      Read the ticket:
        rtk proxy node /workspace/lane/bin/ticket-input.mjs --read {{var:ticket_id}} --workspace {{var:project_name}}
      If the ticket has tasks, inspect every Task contract and its writable roots.
      Select DUPLICATE only when every Task already satisfies its contract.

  create_worktree:
    env:
      TARGET_BRANCH: '{{var:TARGET_BRANCH}}'
      REPOSITORY_PREFLIGHT: '{{var:REPOSITORY_PREFLIGHT}}'
      TOOLING_ROOT: '{{var:TOOLING_ROOT}}'
      TICKET_CHECKS: '{{var:TICKET_CHECKS}}'
      GIT_SSH_COMMAND: '{{var:GIT_SSH_COMMAND}}'
      project_dir: '{{var:project_dir}}'
      ticket_id: '{{var:ticket_id}}'
    timeout: 900
    on_signal:
      READY: implement_code
      VERIFY_EXISTING: prepare_review
      REQUIREMENT_SCOUT: cbm_discovery
      FINALIZE_READY: git_landing
      NO_GIT_KEY: notify_failure
      FETCH_FAILED: notify_failure
      MERGE_CONFLICT: notify_failure
      NO_TARGET_BRANCH: notify_failure
      BRANCH_HAS_WORK: notify_failure
      __failed__: notify_failure
      __timeout__: notify_failure
      __default__: notify_failure
    shell: |
      set -euo pipefail
      restore_recovery() {
        recovery_note=""
        if jq -e '.recovery != null' "$MEDULLA_RUN_DIR/artifacts/ticket.json" >/dev/null 2>&1; then
          recovery_ref="$(jq -r '.recovery.ref // empty' "$MEDULLA_RUN_DIR/artifacts/ticket.json")"
          recovery_sha="$(jq -r '.recovery.sha // empty' "$MEDULLA_RUN_DIR/artifacts/ticket.json")"
          recovery_tree="$(jq -r '.recovery.tree // empty' "$MEDULLA_RUN_DIR/artifacts/ticket.json")"
          recovery_base="$(jq -r '.recovery.base // empty' "$MEDULLA_RUN_DIR/artifacts/ticket.json")"
          recovery_instruction="$(jq -r '.recovery.instruction // empty' "$MEDULLA_RUN_DIR/artifacts/ticket.json")"
          case "$recovery_ref" in
            refs/heads/recovery/*) ;;
            *) echo "RECOVERY_VERIFY_FAILED: invalid recovery ref ${recovery_ref}" >&2; exit 1 ;;
          esac
          remote_ref="refs/remotes/origin/${recovery_ref#refs/heads/}"
          fetched_sha="$(git rev-parse --verify --quiet "${remote_ref}^{commit}" || true)"
          if [ -z "$fetched_sha" ] || [ "$fetched_sha" != "$recovery_sha" ]; then
            echo "RECOVERY_VERIFY_FAILED: ${recovery_ref} is ${fetched_sha:-missing}, expected ${recovery_sha}" >&2
            exit 1
          fi
          recovery_source=false
          git merge-base --is-ancestor "$recovery_base" "refs/remotes/origin/${target}" && recovery_source=true
          if [ -n "${REQUIREMENT_BRANCH:-}" ] && [ -n "${REQUIREMENT_HEAD:-}" ]; then
            git merge-base --is-ancestor "$REQUIREMENT_HEAD" "$recovery_base" && recovery_source=true
          fi
          if [ -z "$recovery_base" ] \
             || ! git merge-base --is-ancestor "$recovery_base" "$recovery_sha" \
             || [ "$recovery_source" != true ]; then
            echo "RECOVERY_VERIFY_FAILED: recovery base ${recovery_base} is not an ancestor of ${recovery_sha} and origin/${target}" >&2
            exit 1
          fi
          fetched_tree="$(git rev-parse --verify --quiet "${recovery_sha}^{tree}" || true)"
          base_tree="$(git rev-parse --verify --quiet "${recovery_base}^{tree}" || true)"
          if [ -z "$recovery_tree" ] || [ "$fetched_tree" != "$recovery_tree" ] || [ "$fetched_tree" = "$base_tree" ]; then
            echo "RECOVERY_VERIFY_FAILED: ${recovery_sha} tree is ${fetched_tree:-missing}, expected ${recovery_tree} above ${base_tree:-missing}" >&2
            exit 1
          fi
          if ! git diff -z --no-renames --name-only "${recovery_base}..${recovery_sha}" \
             | jq -R -s -e --slurpfile ticket "$MEDULLA_RUN_DIR/artifacts/ticket.json" '
               ($ticket[0].modulePaths // []) as $roots |
               split("\u0000") | (if length > 0 and .[-1] == "" then .[:-1] else . end) |
               length > 0 and ($roots | length > 0) and all(.[]; . as $f |
                 ($f | length > 0) and ($f | test("[\r\n]") | not) and ($f | split("/") | index("..") | not) and
                 any($roots[]; . as $r | $r != "" and ($r == "." or $f == $r or ($f | startswith(($r | sub("/+$"; "")) + "/"))))
               )
             ' >/dev/null; then
            echo "RECOVERY_VERIFY_FAILED: recovery diff ${recovery_base}..${recovery_sha} is empty or outside modulePaths" >&2
            exit 1
          fi
          if [ "${MEDULLA_LAST_SIGNAL:-}" != "DUPLICATE" ]; then
            git checkout -B "ticket-${ticket_id}" "$recovery_sha"
            if [ -n "${REQUIREMENT_BRANCH:-}" ]; then
              git rebase --onto "$task_base" "$recovery_base" || {
                echo 'RECOVERY_VERIFY_FAILED: checkpoint conflicts with the current requirement branch' >&2; exit 1; }
              printf '%s\n' "$task_base" > .git/lane-base
            else
              printf '%s\n' "$recovery_base" > .git/lane-base
            fi
            recovery_note=" ${recovery_instruction}"
          fi
        fi
      }
      if [ -n "${REQUIREMENT_BRANCH:-}" ] && [ "${MEDULLA_LAST_NODE:-}" = cbm_discovery ]; then
        cd "$LANE_WORKTREE"
        [ "$(git symbolic-ref --short HEAD)" = "ticket-${ticket_id}" ] || exit 1
        target="$(bash "$TOOLING_ROOT/lane/bin/target.sh" "$project_dir")"
        task_base="$(cat .git/lane-base)"
        if [ ! -s "$MEDULLA_RUN_DIR/artifacts/scout.txt" ]; then
          printf '%s\n' "${MEDULLA_LAST_MESSAGE:-No scout report was supplied.}" > "$MEDULLA_RUN_DIR/artifacts/scout.txt"
        fi
        if [ "${MEDULLA_LAST_SIGNAL:-}" = DUPLICATE ]; then
          printf '%s\n' "$TICKET_CHECKS" > "$MEDULLA_RUN_DIR/artifacts/ticket-checks.json"
          echo '<signal:var key=VERIFY_ONLY>true</signal:var>'
          echo '<signal:VERIFY_EXISTING>Verify existing behavior on the requirement branch.</signal:VERIFY_EXISTING>'
        else
          restore_recovery
          printf '<signal:READY>Requirement checkout is ready for this Task.%s</signal:READY>\n' "${recovery_note:-}"
        fi
        exit 0
      fi
      # Every Git write belongs to this checkout, including objects and refs.
      if [ -n "$(ls -A "${LANE_WORKTREE}")" ]; then
        echo "<signal:BRANCH_HAS_WORK>checkout retained at ${LANE_WORKTREE}; inspect before retrying</signal:BRANCH_HAS_WORK>"
        exit 0
      fi
      origin="$(git -C "$project_dir" remote get-url origin)"
      if [ -z "${GIT_SSH_COMMAND:-}" ] && printf '%s' "$origin" | grep -q '^ssh://\|^git@'; then
        echo "<signal:NO_GIT_KEY>origin is ssh and no key was mounted; launch with --ssh-dir</signal:NO_GIT_KEY>"
        exit 0
      fi
      # No shared objects, hardlinks, worktree registration or canonical Git writes.
      git clone --no-hardlinks --no-checkout "$project_dir" "$LANE_WORKTREE"
      cd "$LANE_WORKTREE"
      if [ -f "$project_dir/.git/info/exclude" ]; then
        mkdir -p .git/info
        printf '\n' >> .git/info/exclude
        cat "$project_dir/.git/info/exclude" >> .git/info/exclude
      fi
      git config user.name lane
      git config user.email lane@local
      git remote set-url origin "$origin"
      timeout 120 git fetch origin > "$MEDULLA_RUN_DIR/artifacts/fetch.txt" 2>&1 && rc=0 || rc=$?
      [ "$rc" -ne 124 ] || echo 'timeout: git fetch did not finish in 120s' >> "$MEDULLA_RUN_DIR/artifacts/fetch.txt"
      cat "$MEDULLA_RUN_DIR/artifacts/fetch.txt"
      if [ "$rc" -ne 0 ]; then
        echo "<signal:FETCH_FAILED>git fetch origin exited ${rc}; full log: ${MEDULLA_RUN_DIR}/artifacts/fetch.txt</signal:FETCH_FAILED>"
        exit 0
      fi
      target="$(bash "${TOOLING_ROOT}/lane/bin/target.sh" "$project_dir")"
      if ! git rev-parse --verify --quiet "refs/remotes/origin/${target}" >/dev/null; then
        echo "<signal:NO_TARGET_BRANCH>origin/${target} does not exist after fetch</signal:NO_TARGET_BRANCH>"
        exit 0
      fi
      checkout_base="origin/${target}"
      if [ -n "${REQUIREMENT_BRANCH:-}" ]; then
        actual="$(git rev-parse --verify --quiet "refs/remotes/origin/${REQUIREMENT_BRANCH}^{commit}" || true)"
        [ "$actual" = "${REQUIREMENT_HEAD:-}" ] || {
          echo '<signal:FETCH_FAILED>Requirement branch changed after claim; retry with its current head.</signal:FETCH_FAILED>'; exit 0; }
        [ -z "$actual" ] || checkout_base="origin/${REQUIREMENT_BRANCH}"
      fi
      git checkout -B "ticket-${ticket_id}" "$checkout_base"
      git rev-parse HEAD > .git/lane-base
      if [ -n "${REQUIREMENT_BRANCH:-}" ]; then
        git merge --no-edit "origin/${target}" >> "$MEDULLA_RUN_DIR/artifacts/fetch.txt" 2>&1 || {
          git status --short > "$MEDULLA_RUN_DIR/artifacts/rebase-status.txt"
          git merge --abort || exit 1
          echo '<signal:MERGE_CONFLICT>Default branch merge conflicts; see artifacts/fetch.txt.</signal:MERGE_CONFLICT>'; exit 0; }
      fi
      task_base="$(git rev-parse HEAD)"
      # This is the checkout base until land.sh replaces it with the pre-push target tip.
      git rev-parse HEAD > .git/lane-base
      if [ -z "${REQUIREMENT_BRANCH:-}" ]; then restore_recovery; fi
      # Use repository setup when present; otherwise bind its tracked hooks locally.
      if [ -f scripts/install-git-hooks.sh ]; then
        bash scripts/install-git-hooks.sh
      elif [ -d .githooks ]; then
        for hook in .githooks/*; do
          [ -f "$hook" ] || continue
          name="$(basename "$hook")"
          printf '#!/usr/bin/env bash\nexec bash "$(git rev-parse --show-toplevel)/.githooks/%s" "$@"\n' "$name" > ".git/hooks/$name"
          chmod +x ".git/hooks/$name"
        done
      elif grep -qE '^[[:space:]]*hooksPath[[:space:]]*=' "$project_dir/.git/config"; then
        echo "Source uses external hooks; no tracked .githooks in candidate" >&2
        exit 1
      fi
      # Repository setup and Git hooks need Bun on PATH.
      export PATH="/home/medulla/.bun/bin:${PATH}"
      # A repository may own dependency setup through .ntkrc preflight.
      deps=""
      pf="${REPOSITORY_PREFLIGHT-__ntkrc__}"
      if [ "$pf" = __ntkrc__ ]; then pf="$(jq -r '.preflight // empty' "${project_dir}/.ntkrc" 2>/dev/null || true)"; fi
      if [ -n "$pf" ]; then
        if [ -x "${LANE_WORKTREE}/$pf" ]; then
          if (cd "${LANE_WORKTREE}" && timeout 600 "./$pf" \
                > "$MEDULLA_RUN_DIR/artifacts/preflight.txt" 2>&1); then
            deps=" Repository preflight ($pf) ran."
          else
            cat "$MEDULLA_RUN_DIR/artifacts/preflight.txt" >&2
            echo "Repository preflight ($pf) failed; see artifacts/preflight.txt" >&2
            exit 1
          fi
        else
          echo "Repository preflight ($pf) is not executable in the candidate" >&2
          exit 1
        fi
      # Объявил предполёт - он и отвечает за зависимости; нашей установки нет.
      elif [ -f "${LANE_WORKTREE}/package.json" ] && command -v bun >/dev/null 2>&1; then
        # Keep installation failure details for the coder.
        if (cd "${LANE_WORKTREE}" && timeout 240 bun install --frozen-lockfile \
              > "$MEDULLA_RUN_DIR/artifacts/bun-install.txt" 2>&1); then
          deps=" Dependencies are installed."
        else
          deps=" NOTE: bun install did not complete. Full log: ${MEDULLA_RUN_DIR}/artifacts/bun-install.txt"
        fi
      fi
      if [ -n "${REQUIREMENT_BRANCH:-}" ]; then
        if [ "$FINALIZE_ONLY" = true ]; then
          printf '%s\n%s\n' "$(git write-tree)" "$(git rev-parse HEAD)" > "$MEDULLA_RUN_DIR/artifacts/reviewed-tree.txt"
          echo '<signal:FINALIZE_READY>Run full gates and deliver completed Requirement work.</signal:FINALIZE_READY>'
          exit 0
        fi
        echo '<signal:REQUIREMENT_SCOUT>Inspect this requirement checkout before implementation.</signal:REQUIREMENT_SCOUT>'
        exit 0
      fi
      # Preserve the scout report; use its signal as data only when the report is missing.
      mkdir -p "$MEDULLA_RUN_DIR/artifacts"
      if [ ! -s "$MEDULLA_RUN_DIR/artifacts/scout.txt" ]; then
        printf 'РАЗВЕДЧИК НЕ ОСТАВИЛ ОТЧЁТА. Всё, что от него есть:\n%s\n' \
          "${MEDULLA_LAST_MESSAGE:-}" > "$MEDULLA_RUN_DIR/artifacts/scout.txt"
      fi
      if [ "${MEDULLA_LAST_SIGNAL:-}" = "DUPLICATE" ]; then
        printf '%s\n' "$TICKET_CHECKS" > "$MEDULLA_RUN_DIR/artifacts/ticket-checks.json"
        echo '<signal:var key=VERIFY_ONLY>true</signal:var>'
        echo "<signal:VERIFY_EXISTING>Check existing implementation at $(git rev-parse HEAD). ${deps:-}</signal:VERIFY_EXISTING>"
        exit 0
      fi
      echo "<signal:READY>Worktree: ${LANE_WORKTREE}; branch ticket-${ticket_id}; base origin/${target}.${deps:-}${recovery_note:-}</signal:READY>"

  implement_code:
    timeout: 7200   # writing the code
    env:
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
      BASH_MAX_TIMEOUT_MS: '900000'
      EQUILL_ROLE: crew-lane-coder
      EQUILL_RULES: none
      EQUILL_PROMPT_PROFILE: agent.memory.hybrid
      EQUILL_RULE_MODULES: tickets
      EQUILL_PROCESS: crew-lane-coder
      EQUILL_TICKET: '{{var:ticket_id}}'
      EQUILL_PROJECT: '{{var:project_name}}'
      EQUILL_MODULE: '{{var:module_name}}'
      EQUILL_PHASE: unit
      CBM_MCP_COMMAND: '{{var:CBM_MCP_COMMAND}}'
      LANE_WORKTREE: '{{var:LANE_WORKTREE}}'
    on_signal:
      OK: prepare_review
      GATE_FAIL: notify_failure
      __failed__: notify_failure
      __timeout__: notify_failure
      __default__: notify_failure
    agent:
      harness: claude-code
      model: claude-opus-5-5
      effort: high
      # Reuse the coder session across review rounds.
      session: coder
      args:
      - --settings
      - /tmp/lane-settings.json
      - --mcp-config
      - /tmp/codex-home/mcp.json
      - --strict-mcp-config
      - --setting-sources=
    prompt: |
      EQUILL_PHASE=unit.
      Follow your Equill contract.
      Current handoff: {{last.message}}
      Repository checks: {{var:review_commands}}
      Test command: {{var:ticket_test_command}}
      Ticket {{var:ticket_id}} in workspace {{var:project_name}}:
        rtk proxy node /workspace/lane/bin/ticket-input.mjs --read {{var:ticket_id}} --workspace {{var:project_name}}
      Read {{var:RUN_ARTIFACTS}}/scout.txt.
      If the ticket has tasks, execute them in executionOrder in this coder session.
      Keep each Task within its contract and writable roots. Record each Task result in coder-report.txt.
      Artifacts: {{var:RUN_ARTIFACTS}}.

  prepare_review:
    env:
      TARGET_BRANCH: '{{var:TARGET_BRANCH}}'
      DELIVERY: '{{var:DELIVERY}}'
      GIT_SSH_COMMAND: '{{var:GIT_SSH_COMMAND}}'
      VERIFY_ONLY: '{{var:VERIFY_ONLY}}'
      ticket_test_command: '{{var:ticket_test_command}}'
      ticket_title: '{{var:ticket_title}}'
      TOOLING_ROOT: '{{var:TOOLING_ROOT}}'
      gate_commands: '{{var:gate_commands}}'
      review_commands: '{{var:review_commands}}'
      gate_timeout_seconds: '{{var:gate_timeout_seconds}}'
      module_name: '{{var:module_name}}'
      ticket_id: '{{var:ticket_id}}'
      project_dir: '{{var:project_dir}}'
      project_name: '{{var:project_name}}'
      EQUILL_STORE: '{{var:EQUILL_STORE}}'
      EQUILL_ACTOR: '{{var:EQUILL_ACTOR}}'
    timeout: 3600
    on_signal:
      SNAPSHOT: expert_review
      CONFLICT: git_fix
      LAND_FAILED: notify_failure
      GATE_FAIL: reject_gate
      NOTHING_DONE: notify_failure
      __failed__: notify_failure
      __timeout__: notify_failure
      __default__: notify_failure
    shell: |
      set -euo pipefail
      cd "${LANE_WORKTREE}"
      git add -A
      # Freeze the candidate checked before landing.
      tree="$(git write-tree)"
      base="$(git rev-parse HEAD)"
      if [ "${VERIFY_ONLY}" = "true" ] && ! git diff --cached --quiet "$base"; then
        echo '<signal:GATE_FAIL>verification checkout contains source changes</signal:GATE_FAIL>'
        exit 0
      fi
      # A resolved rebase may have commits to land with an empty index.
      target="$(bash "${TOOLING_ROOT}/lane/bin/target.sh" "$project_dir")"
      change_base="origin/${target}"
      if [ -n "${REQUIREMENT_BRANCH:-}" ]; then change_base="$(cat .git/lane-base)"; fi
      if [ "${VERIFY_ONLY}" != "true" ] && git diff --cached --quiet "$base" -- 2>/dev/null \
         && [ -z "$(git log --oneline "${change_base}..HEAD" 2>/dev/null)" ]; then
        echo "<signal:NOTHING_DONE>кодер сказал OK, но дерево не изменилось</signal:NOTHING_DONE>"
        exit 0
      fi
      mkdir -p "$MEDULLA_RUN_DIR/artifacts"
      export PATH="/home/medulla/.bun/bin:${PATH}"
      # Native check receipts can bind to the commit reviewed and pushed.
      if [ "${VERIFY_ONLY}" != "true" ] && ! git diff --cached --quiet; then
        if ! git -c user.name=lane -c user.email=lane@local \
            commit -m "${ticket_id}: implement ticket" -m "$ticket_title" > "$MEDULLA_RUN_DIR/artifacts/commit.txt" 2>&1; then
          cat "$MEDULLA_RUN_DIR/artifacts/commit.txt" >&2
          echo '<signal:GATE_FAIL>commit rejected; see artifacts/commit.txt</signal:GATE_FAIL>'
          exit 0
        fi
      fi
      if [ "${VERIFY_ONLY}" != true ] && [ "$DELIVERY" = target ]; then
        rc=0
        bash "${TOOLING_ROOT}/lane/bin/rebase.sh" "$target" || rc=$?
        case "$rc" in
          0) ;;
          3) echo '<signal:CONFLICT>Target rebase conflicts; see artifacts/rebase-log.txt.</signal:CONFLICT>'; exit 0 ;;
          *) echo '<signal:LAND_FAILED>Target refresh or rebase failed; see artifacts/fetch.txt and rebase-log.txt.</signal:LAND_FAILED>'; exit 0 ;;
        esac
      fi
      tree="$(git write-tree)"
      base="$(git rev-parse HEAD)"
      review_base="origin/${target}"
      if [ -n "${REQUIREMENT_BRANCH:-}" ]; then review_base="$(cat .git/lane-base)"; fi
      git diff --binary "${review_base}...HEAD" > "$MEDULLA_RUN_DIR/artifacts/diff.patch"
      export gate_commands="${review_commands:-$gate_commands}"
      if ! python3 "${TOOLING_ROOT}/lane/bin/gates.py" run; then
        echo "<signal:GATE_FAIL>candidate checks failed; see artifacts/gates for logs and receipts</signal:GATE_FAIL>"
        exit 0
      fi
      printf '%s\n%s\n' "$tree" "$base" > "$MEDULLA_RUN_DIR/artifacts/reviewed-tree.txt"
      receipt="$(python3 "${TOOLING_ROOT}/lane/bin/gates.py" verify)"
      # Share one Equill contract across all review harnesses and rounds.
      qa="$MEDULLA_RUN_DIR/artifacts/qa-contract.txt"
      # Extract content and publish atomically after a successful read.
      if [ ! -s "$qa" ]; then
        for attempt in 1 2 3; do
          if timeout --kill-after=2s 30s equill context --store "${EQUILL_STORE:-$HOME/.equill/dev}" \
             --profile agent.context.target --role crew-lane-qa --process crew-lane-qa \
             --project "$project_name" \
             --coordinate rules=none --json >"$qa.reply" 2>"$qa.err" \
            && jq -er 'select(.ok != false) | .content | select(type == "string" and test("\\S"))' "$qa.reply" >"$qa.tmp" 2>>"$qa.err"; then
            mv "$qa.tmp" "$qa"
            break
          fi
          echo "QA contract attempt $attempt failed; response: $qa.reply; error: $qa.err" >&2
          [ "$attempt" -eq 3 ] || sleep 1
        done
        if [ ! -s "$qa" ]; then
          rm -f "$qa.tmp"
          printf '\nEquill response:\n' >> "$qa.err"
          cat "$qa.reply" >> "$qa.err"
          echo "QA contract unavailable after 3 attempts; response: $qa.reply; error: $qa.err" >&2
          cat "$qa.err" >&2
          exit 1
        fi
        rm -f "$qa.err" "$qa.reply"
      fi
      echo "<signal:SNAPSHOT>snapshot: $tree. Declared checks passed on this tree; commands, exit codes and logs: $receipt</signal:SNAPSHOT>"
  expert_review:
    timeout: 480
    max_parallel: 3
    # Retry a reviewer that returns no verdict.
    max_attempts: 2
    inputs:
    - harness: codex
      model: gpt-6.1-sol
      effort: high
      slug: architecture
    - harness: agy
      model: gemini-4-argon-high
      effort: high
      slug: codereview
    - harness: claude-code
      model: claude-sonnet-5-5
      effort: high
      slug: security
    env:
      CODEX_HOME: /tmp/codex-home
      EQUILL_ROLE: crew-lane-qa
      EQUILL_RULES: none
      EQUILL_PROMPT_PROFILE: agent.memory.hybrid
      EQUILL_RULE_MODULES: tickets
      EQUILL_PROCESS: crew-lane-qa
      EQUILL_TICKET: '{{var:ticket_id}}'
      EQUILL_PROJECT: '{{var:project_name}}'
      EQUILL_MODULE: '{{var:module_name}}'
    on_signal:
      __done__: expert_review_synthesis
      __failed__: expert_review_synthesis
      __timeout__: expert_review_synthesis
    agent:
      harness: '{{input.harness}}'
      model: '{{input.model}}'
      effort: '{{input.effort}}'
      args:
      - '{{input.flag:-}}'
    post: |
      [ "$MEDULLA_BODY_RC" = 0 ] || exit 1
      case "$MEDULLA_BODY_SIGNAL" in
        CLEAR|REJECT) exit 0 ;;
        *) echo 'Return CLEAR or REJECT as a signal. A report with NONE does not supply a verdict.' >&2
           exit 1 ;;
      esac
    prompt: |
      Read {{var:RUN_ARTIFACTS}}/qa-contract.txt and execute its steps.
      Ticket: {{var:ticket_id}}. Perspective: {{input.slug}}.
      Workspace: {{var:project_name}}. Verification only: {{var:VERIFY_ONLY}}.
      Worktree: {{var:LANE_WORKTREE}}.
      Input: {{var:RUN_ARTIFACTS}}/scout.txt; {{var:RUN_ARTIFACTS}}/gates/current.json;
      {{var:RUN_ARTIFACTS}}/coder-report.txt if present;
      {{var:RUN_ARTIFACTS}}/diff.patch.
      Read {{var:RUN_ARTIFACTS}}/ticket.json. If it has tasks, review every Task contract and its writable roots.
      Write {{var:RUN_ARTIFACTS}}/{{input.slug}}.md:
      ## FINDINGS
      - HIGH|MED|LOW - <claim> - <file:line> - <impact> - FIX: <change or unknown; reason>
      Or NONE. End with COVERAGE: <checked; not checked>.

  expert_review_synthesis:
    timeout: 60
    on_signal:
      CLEAR: git_landing
      REJECT: reject_gate
      REVIEW_INCOMPLETE: notify_failure
      __failed__: notify_failure
      __timeout__: notify_failure
      __default__: notify_failure
    shell: |
      python3 - <<'PY'
      import json, os, pathlib, re, sys

      VERDICTS = {"CLEAR", "REJECT"}
      manifest = os.environ.get("MEDULLA_MANIFEST_EXPERT_REVIEW", "")
      if not manifest or not os.path.isfile(manifest):
          sys.exit("нет манифеста панели")

      rows = [json.loads(l) for l in open(manifest) if l.strip()]

      def verdict(row):
          # Accept exactly one distinct verdict per reviewer.
          names = [s.get("name") for s in row.get("signals") or []]
          found = {n for n in names if n in VERDICTS}
          return found.pop() if len(found) == 1 else ""

      go, findings, notes, incomplete = 0, [], [], []
      art = pathlib.Path(os.environ["MEDULLA_RUN_DIR"]) / "artifacts"
      art.mkdir(parents=True, exist_ok=True)
      inputs = json.loads((pathlib.Path(manifest).parent / "inputs.json").read_text())
      expected = [item["slug"] for item in inputs]
      if (not expected or len(set(expected)) != len(expected)
              or any(not isinstance(seat, str) or not re.fullmatch(r"[A-Za-z0-9_-]+", seat) for seat in expected)):
          sys.exit("Reviewer inputs need distinct valid slugs")
      seats = [r.get("slug") or (r.get("input") or {}).get("slug") for r in rows]
      if sorted(str(s) for s in seats) != sorted(expected):
          incomplete.append("Expected one result from every configured reviewer seat.")
      for r in rows:
          v = verdict(r)
          who = r.get("harness") or "?"
          result = v or 'no verdict'
          seat = r.get("slug") or (r.get("input") or {}).get("slug")
          report = ""
          if seat in expected:
              try:
                  report = (art / f"{seat}.md").read_text()
              except OSError:
                  pass
          if not re.search(r"^COVERAGE:[ \t]*\S[^\r\n]*$", report, re.M):
              incomplete.append(f"{who}: missing report or coverage statement")
          high = re.findall(r"^- HIGH\b[^\r\n]*", report, re.M)
          if v == "CLEAR" and high:
              v = "REJECT"
              result = "REJECT: HIGH findings contradict CLEAR"
          if r.get("timed_out"):
              v = ""
              result = f"TIMEOUT ({r.get('model') or '?'}, rc={r.get('rc')}, attempts={r.get('attempts')})"
              print(f"[lane] {who}: {result}", file=sys.stderr)
          if r.get("ok") is not True or r.get("rc") != 0 or r.get("timed_out") or not v:
              incomplete.append(f"{who}: {result}; attempts={r.get('attempts')}")
          line = f"- {who}: {result} {r.get('message') or ''}".strip()
          # Keep every reviewer result, including nonblocking findings.
          notes.append(line)
          notes.extend(high)
          if v == "CLEAR":
              go += 1
          else:
              findings.append(line)

      # Preserve full verdict history across rounds.
      with (art / "panel-findings.txt").open("a") as fh:
          fh.write("\n".join(notes) + "\n---\n")
      print(f"панель: {go} из {len(rows)} сказали CLEAR", file=sys.stderr)

      if incomplete:
          detail = "; ".join(incomplete)
          print(f"<signal:REVIEW_INCOMPLETE>{detail}; full results: {art / 'panel-findings.txt'}</signal:REVIEW_INCOMPLETE>")
      elif go == len(rows):
          print(f"<signal:CLEAR>все {len(rows)} ревьюера сказали CLEAR</signal:CLEAR>")
      else:
          print(f"<signal:REJECT>Reviewer blockers; full verdicts: {art / 'panel-findings.txt'}</signal:REJECT>")
      PY
  git_landing:
    env:
      TARGET_BRANCH: '{{var:TARGET_BRANCH}}'
      DELIVERY: '{{var:DELIVERY}}'
      DELIVERY_BRANCH: '{{var:DELIVERY_BRANCH}}'
      VERIFY_ONLY: '{{var:VERIFY_ONLY}}'
      ticket_test_command: '{{var:ticket_test_command}}'
      ticket_title: '{{var:ticket_title}}'
      gate_commands: '{{var:gate_commands}}'
      review_commands: '{{var:review_commands}}'
      gate_timeout_seconds: '{{var:gate_timeout_seconds}}'
      LANE_SHARED_LOCK_DIR: '{{var:LANE_SHARED_LOCK_DIR}}'
      module_name: '{{var:module_name}}'
      GIT_SSH_COMMAND: '{{var:GIT_SSH_COMMAND}}'
      project_name: '{{var:project_name}}'
      TOOLING_ROOT: '{{var:TOOLING_ROOT}}'
      project_dir: '{{var:project_dir}}'
      ticket_id: '{{var:ticket_id}}'
    # Bound final checks, target lock wait and integration retries.
    timeout: 8100
    on_signal:
      VERIFIED: cleanup
      ALREADY_LANDED: cleanup
      LAND_FAILED: notify_failure
      CONFLICT: git_fix
      MERGE_CONFLICT: notify_failure
      REQUIREMENT_GATE_FAIL: notify_failure
      REQUIREMENT_CHANGED: notify_failure
      GATE_FAIL: reject_gate
      __failed__: notify_failure
      __timeout__: notify_failure
      __default__: cleanup
    shell: |
      set -euo pipefail
      cd "${LANE_WORKTREE}" || {
        echo "<signal:LAND_FAILED>worktree is gone</signal:LAND_FAILED>"; exit 0; }
      target="$(bash "${TOOLING_ROOT}/lane/bin/target.sh" "$project_dir")"

      # Push the checked candidate. A clean rebase retains the panel approval.
      snap="$MEDULLA_RUN_DIR/artifacts/reviewed-tree.txt"
      [ -f "$snap" ] || { echo "<signal:LAND_FAILED>нет зафиксированного снимка панели</signal:LAND_FAILED>"; exit 0; }
      want_tree="$(sed -n 1p "$snap")"
      [ "$(git rev-parse HEAD)" = "$(sed -n 2p "$snap")" ] || {
        echo '<signal:LAND_FAILED>HEAD changed after review</signal:LAND_FAILED>'; exit 0; }
      git diff --quiet || { echo "<signal:LAND_FAILED>дерево изменилось после панели: есть неиндексированные правки</signal:LAND_FAILED>"; exit 0; }
      # Новые файлы после проверок меняют среду кандидата: требуется новый gate.
      new_files="$(git ls-files --others --exclude-standard | tr '\n' ' ')"
      [ -z "$new_files" ] || {
        echo "<signal:LAND_FAILED>untracked files appeared after review: ${new_files}</signal:LAND_FAILED>"; exit 0; }
      have_tree="$(git write-tree)"
      [ "$have_tree" = "$want_tree" ] || { echo "<signal:LAND_FAILED>сажаем не то, что смотрела панель: $have_tree против $want_tree</signal:LAND_FAILED>"; exit 0; }
      if [ "$FINALIZE_ONLY" != true ]; then
        gate_commands="${review_commands:-$gate_commands}" python3 "${TOOLING_ROOT}/lane/bin/gates.py" verify || {
          echo "<signal:LAND_FAILED>no passing gates for this candidate</signal:LAND_FAILED>"; exit 0; }
      fi

      if [ "${VERIFY_ONLY}" = "true" ] && [ "$DELIVERY" != requirement ]; then
        git diff --cached --quiet HEAD || {
          echo '<signal:LAND_FAILED>verification changed source files</signal:LAND_FAILED>'; exit 0; }
        git fetch origin
        head="$(git rev-parse HEAD)"
        [ "$head" = "$(sed -n 2p "$snap")" ] && [ "$head" = "$(git rev-parse "origin/${target}")" ] || {
          echo '<signal:LAND_FAILED>target changed after verification; retry against the current target</signal:LAND_FAILED>'; exit 0; }
        echo "<signal:VERIFIED>Existing implementation checked and reviewed at ${head} on ${target}; no commit or push.</signal:VERIFIED>"
        exit 0
      fi

      [ "$DELIVERY" = requirement ] || [ -n "$(git log --oneline "origin/${target}..HEAD" 2>/dev/null)" ] || {
        echo "<signal:LAND_FAILED>nothing to land: no commit above origin/${target}</signal:LAND_FAILED>"; exit 0; }

      export PATH="/home/medulla/.bun/bin:${PATH}"
      land() {
        rc=0
        "${TOOLING_ROOT}/lane/bin/land.sh" "$target" > "$MEDULLA_RUN_DIR/artifacts/landing-log.txt" 2>&1 || rc=$?
        cat "$MEDULLA_RUN_DIR/artifacts/landing-log.txt"
      }

      if [ "$DELIVERY" = requirement ]; then
        [ -n "${REQUIREMENT_BRANCH:-}" ] || {
          echo '<signal:LAND_FAILED>Requirement branch is missing.</signal:LAND_FAILED>'; exit 0; }
        if [ "${REQUIREMENT_FINAL:-false}" != true ]; then
          timeout --kill-after=5s 60s node "$TOOLING_ROOT/lane/bin/requirement-current.mjs" --publish || {
            echo '<signal:REQUIREMENT_CHANGED>Task claim or Requirement context changed before publication.</signal:REQUIREMENT_CHANGED>'; exit 0; }
          task_base="$(cat .git/lane-base)"
          rc=0
          gate_commands="${review_commands:-$gate_commands}" \
            bash "$TOOLING_ROOT/lane/bin/land.sh" "$REQUIREMENT_BRANCH" \
            > "$MEDULLA_RUN_DIR/artifacts/landing-log.txt" 2>&1 || rc=$?
          printf '%s\n' "$task_base" > .git/lane-base
          cat "$MEDULLA_RUN_DIR/artifacts/landing-log.txt"
          [ "$rc" -eq 0 ] || echo "<signal:LAND_FAILED>Requirement publication exited $rc.</signal:LAND_FAILED>"
          exit 0
        fi
        # A failed final Task stays private. Retirement must not publish its code.
        # Existing-code verification still needs full gates before requirement delivery.
        export VERIFY_ONLY=false
        echo '<signal:var key=VERIFY_ONLY>false</signal:var>'
      fi

      if [ "$DELIVERY" = branch ]; then
        if ! python3 "${TOOLING_ROOT}/lane/bin/gates.py" verify >/dev/null 2>&1; then
          if ! python3 "${TOOLING_ROOT}/lane/bin/gates.py" run; then
            echo '<signal:GATE_FAIL>Final candidate checks failed; see artifacts/gates for logs and receipts.</signal:GATE_FAIL>'
            exit 0
          fi
        fi
        python3 "${TOOLING_ROOT}/lane/bin/gates.py" verify || {
          echo '<signal:LAND_FAILED>Final gate receipt is invalid.</signal:LAND_FAILED>'; exit 0; }
        target="${DELIVERY_BRANCH:-ticket-${ticket_id}}"
        land
        [ "$rc" -eq 0 ] || echo "<signal:LAND_FAILED>Candidate branch publication exited ${rc}; see artifacts/landing-log.txt</signal:LAND_FAILED>"
        exit 0
      fi
      if [ -z "$LANE_SHARED_LOCK_DIR" ] || [ ! -d "$LANE_SHARED_LOCK_DIR" ]; then
        echo '<signal:LAND_FAILED>Target landing requires a configured sharedLockDir.</signal:LAND_FAILED>'
        exit 0
      fi
      key="$(printf '%s\n%s\n' "$(git remote get-url origin)" "$target" | sha256sum | cut -d ' ' -f 1)"
      echo 'landing: waiting for the shared target lock' >&2
      rc=0
      flock --exclusive --wait 3600 --conflict-exit-code 75 --close \
        "$LANE_SHARED_LOCK_DIR/landing-$key.lock" \
        bash "$TOOLING_ROOT/lane/bin/integrate.sh" "$target" || rc=$?
      if [ "$rc" -eq 75 ]; then
        echo '<signal:LAND_FAILED>Target lock wait exceeded 3600 seconds.</signal:LAND_FAILED>'
      elif [ "$rc" -ne 0 ]; then
        echo "<signal:LAND_FAILED>Target integration exited $rc.</signal:LAND_FAILED>"
      fi
  cleanup:
    env:
      TARGET_BRANCH: '{{var:TARGET_BRANCH}}'
      DELIVERY: '{{var:DELIVERY}}'
      DELIVERY_BRANCH: '{{var:DELIVERY_BRANCH}}'
      VERIFY_ONLY: '{{var:VERIFY_ONLY}}'
      TOOLING_ROOT: '{{var:TOOLING_ROOT}}'
      project_dir: '{{var:project_dir}}'
      project_name: '{{var:project_name}}'
      ticket_id: '{{var:ticket_id}}'
    timeout: 180
    on_signal:
      LANDED: notify_success
      VERIFIED: notify_success
      LANDED_TICKET_STUCK: __exit_fail__
      __failed__: __exit_fail__
      __timeout__: __exit_fail__
      __default__: __exit_fail__
    shell: |
      set -euo pipefail
      mkdir -p "$MEDULLA_RUN_DIR/artifacts"
      head_sha="$(git -C "${LANE_WORKTREE}" rev-parse HEAD)"
      target="$(bash "${TOOLING_ROOT}/lane/bin/target.sh" "$project_dir")"
      if { [ "${VERIFY_ONLY}" != true ] && [ "$DELIVERY" = branch ]; } \
        || { [ "$DELIVERY" = requirement ] && [ "${REQUIREMENT_FINAL:-false}" != true ]; }; then
        target="${DELIVERY_BRANCH:-ticket-${ticket_id}}"
      fi
      cd "${project_dir}"
      if [ "$FINALIZE_ONLY" = true ]; then
        if [ -f "$LANE_WORKTREE/.git/lane-verified" ]; then
          printf 'Requirement: %s\nVerified existing SHA: %s\nTarget: %s\nRequirement head was already on target; no checks or push repeated.\n' \
            "$ticket_id" "$head_sha" "$target" > "$MEDULLA_RUN_DIR/artifacts/verification.txt"
          echo '<signal:VERIFIED>Requirement work was already delivered.</signal:VERIFIED>'
        else
          printf 'Requirement: %s\nLanded SHA: %s\nTarget: %s\n' "$ticket_id" "$head_sha" "$target" > "$MEDULLA_RUN_DIR/artifacts/landing.txt"
          echo '<signal:LANDED>Requirement work delivered.</signal:LANDED>'
        fi
        exit 0
      fi
      if [ "${VERIFY_ONLY}" = "true" ] && [ "$DELIVERY" != requirement ]; then
        touch "${LANE_WORKTREE}/.git/lane-verified"
        printf 'Ticket: %s\nVerified existing SHA: %s\nTarget: %s\nChecks and review passed; no commit or push.\n' \
          "$ticket_id" "$head_sha" "$target" > "$MEDULLA_RUN_DIR/artifacts/verification.txt"
      else
        printf 'Ticket: %s\nLanded SHA: %s\nTarget: %s\n' "$ticket_id" "$head_sha" "$target" > "$MEDULLA_RUN_DIR/artifacts/landing.txt"
      fi
      # The host removes the private checkout after the workflow succeeds.
      # Код сел — это правда. Тикет, застрявший в работе, иначе никто не заметит.
      if ! node "${TOOLING_ROOT}/lane/bin/ticket-outcome.mjs" to-test; then
        printf 'LANDED_TICKET_STUCK: %s checked at %s on %s; to_test failed after up to 3 attempts. See to-test-errors.txt. Do not rerun work.\n' \
          "$ticket_id" "$head_sha" "$target" > "$MEDULLA_RUN_DIR/artifacts/outcome.txt"
        cat "$MEDULLA_RUN_DIR/artifacts/outcome.txt" >&2
        exit 1
      fi
      if [ "${VERIFY_ONLY}" = "true" ] && [ "$DELIVERY" != requirement ]; then
        echo "<signal:VERIFIED>Existing implementation verified at ${head_sha}; ticket is to_test.</signal:VERIFIED>"
        exit 0
      fi
      printf '<signal:LANDED>Landed %s on %s.</signal:LANDED>\n' "$head_sha" "$target"
  notify_failure:
    env:
      TOOLING_ROOT: '{{var:TOOLING_ROOT}}'
      project_dir: '{{var:project_dir}}'
      project_name: '{{var:project_name}}'
      ticket_id: '{{var:ticket_id}}'
    timeout: 180
    on_signal:
      __failed__: __exit_fail__
      __timeout__: __exit_fail__
      __default__: __exit_fail__
    shell: |
      msg="lane stopped on ${MEDULLA_LAST_NODE:-?} (${MEDULLA_LAST_SIGNAL:-none}) for ${ticket_id}. ${MEDULLA_LAST_MESSAGE:-}"
      mkdir -p "$MEDULLA_RUN_DIR/artifacts"
      jq -n --arg node "${MEDULLA_LAST_NODE:-?}" --arg signal "${MEDULLA_LAST_SIGNAL:-none}" \
        --arg message "${MEDULLA_LAST_MESSAGE:-}" '{node: $node, signal: $signal, message: $message}' \
        > "$MEDULLA_RUN_DIR/artifacts/origin.json"
      if [ "$FINALIZE_ONLY" = true ]; then
        printf '%s\nNo Task claim or Task outcome was changed.\n' "$msg" > "$MEDULLA_RUN_DIR/artifacts/failure.txt"
        cat "$MEDULLA_RUN_DIR/artifacts/failure.txt" >&2
        exit 1
      fi
      # Before a confirmed claim, never write the ticket or touch its worktree.
      if [ "${MEDULLA_LAST_SIGNAL:-}" = "CLAIM_REFUSED" ] || ! jq -e \
        --arg id "$ticket_id" --arg ws "$project_name" --arg run "$MEDULLA_RUN_DIR" \
        '.claimed == true and .status == "in_progress" and
         (.id | ascii_downcase) == ($id | ascii_downcase) and .workspace == $ws and .run_dir == $run' \
        "$MEDULLA_RUN_DIR/artifacts/claim.json" >/dev/null 2>&1; then
        printf '%s\nNo confirmed claim; NTK was not modified.\n' "$msg" > "$MEDULLA_RUN_DIR/artifacts/failure.txt"
        cat "$MEDULLA_RUN_DIR/artifacts/failure.txt" >&2
        exit 1
      fi
      # The host retains failed checkouts with commits or changes.
      export PATH="/home/medulla/.bun/bin:${PATH}"
      saved=""
      if [ -d "${LANE_WORKTREE}/.git" ]; then
        if [ -n "$(git -C "${LANE_WORKTREE}" status --porcelain 2>/dev/null)" ]; then
          # Recovery commits bypass hooks and stay local; landing still runs hooks.
          if git -C "${LANE_WORKTREE}" add -A 2>&1 \
             && git -C "${LANE_WORKTREE}" -c user.name=lane -c user.email=lane@local \
                    commit -q --no-verify -m "SAVE STATE: ${MEDULLA_LAST_NODE:-?}" 2>&1; then
            saved=" Local recovery commit $(git -C "${LANE_WORKTREE}" rev-parse --short HEAD) at ${LANE_WORKTREE}; not pushed; checkout retained."
          else
            saved=" Recovery commit failed; worktree retained at ${LANE_WORKTREE}."
          fi
        else
          saved=" Clean worktree at ${LANE_WORKTREE}; existing HEAD $(git -C "${LANE_WORKTREE}" rev-parse HEAD 2>/dev/null || printf unknown). No additional recovery commit created."
        fi
      fi
      msg="${msg}${saved}"
      printf '%s\n' "$msg" > "$MEDULLA_RUN_DIR/artifacts/failure.txt"
      # Attach the full failure report: ticket bodies have a size limit.
      if ! upd="$(node "${TOOLING_ROOT}/lane/bin/ticket-outcome.mjs" blocked 2>&1)"; then
        msg="${msg} NTK outcome incomplete: ${upd}"
      fi
      # Ошибка записи статуса тоже остаётся в отчёте прогона.
      printf '%s\n' "$msg" > "$MEDULLA_RUN_DIR/artifacts/failure.txt" || exit 1
      printf '%s\n' "$msg" >&2
  notify_success:
    env:
      TOOLING_ROOT: '{{var:TOOLING_ROOT}}'
      project_name: '{{var:project_name}}'
      module_name: '{{var:module_name}}'
      ticket_id: '{{var:ticket_id}}'
    timeout: 1800
    on_signal:
      # Ошибка сохранения отчёта требует разбора уже состоявшейся посадки.
      __failed__: __exit_fail__
      __timeout__: __exit_fail__
      __default__: __exit_ok__
    shell: |
      case "${MEDULLA_LAST_SIGNAL:-}" in
        LANDED) msg="${ticket_id} landed: ${MEDULLA_LAST_MESSAGE:-}" ;;
        VERIFIED) msg="${ticket_id} verified: ${MEDULLA_LAST_MESSAGE:-}" ;;
        *) echo 'Success requires LANDED or VERIFIED and confirmed to_test' >&2; exit 1 ;;
      esac
      mkdir -p "$MEDULLA_RUN_DIR/artifacts"
      # Retain nonblocking findings in the run artifacts.
      followups="$MEDULLA_RUN_DIR/artifacts/followups.txt"
      grep -h -E '^- (MED|LOW) ' "$MEDULLA_RUN_DIR"/artifacts/*.md 2>/dev/null \
        | sort -u > "$followups" || true
      n_follow="$(wc -l < "$followups" 2>/dev/null | tr -d ' ')"
      if [ "${n_follow:-0}" -gt 0 ]; then
        if finding="$(node "${TOOLING_ROOT}/lane/bin/ticket-outcome.mjs" findings 2>&1)"; then
          msg="${msg} ${finding}"
        else
          printf '%s\nFindings publication failed: %s\nSource ticket remains to_test; retry reporting only.\n' \
            "$msg" "$finding" > "$MEDULLA_RUN_DIR/artifacts/outcome.txt"
          cat "$MEDULLA_RUN_DIR/artifacts/outcome.txt" >&2
          exit 1
        fi
      fi
      printf '%s\n' "$msg" > "$MEDULLA_RUN_DIR/artifacts/outcome.txt" || exit 1
      printf '%s\n' "$msg"
  git_fix:
    timeout: 900
    env:
      TARGET_BRANCH: '{{var:TARGET_BRANCH}}'
      EQUILL_ROLE: crew-lane-coder
      EQUILL_RULES: none
      EQUILL_PROMPT_PROFILE: agent.memory.hybrid
      EQUILL_RULE_MODULES: tickets
      EQUILL_PROCESS: crew-lane-coder
      EQUILL_TICKET: '{{var:ticket_id}}'
      EQUILL_PROJECT: '{{var:project_name}}'
      EQUILL_MODULE: '{{var:module_name}}'
      EQUILL_PHASE: land
      CBM_MCP_COMMAND: '{{var:CBM_MCP_COMMAND}}'
      LANE_WORKTREE: '{{var:LANE_WORKTREE}}'
    on_signal:
      OK: prepare_review
      GATE_FAIL: notify_failure
      __failed__: notify_failure
      __timeout__: notify_failure
      __default__: notify_failure
    agent:
      harness: claude-code
      model: claude-sonnet-5-5
      effort: high
      args:
      - --settings
      - /tmp/lane-settings.json
      - --mcp-config
      - /tmp/codex-home/mcp.json
      - --strict-mcp-config
      - --setting-sources=
    prompt: |
      EQUILL_PHASE=land.
      Resolve the landing conflict for ticket {{var:ticket_id}}.
      {{last.message}}
      1. In {{var:LANE_WORKTREE}}, read the target with
         bash /workspace/lane/bin/target.sh {{var:project_dir}}. The failed rebase was aborted;
         restart git rebase onto origin/<target_branch>.
      2. Resolve conflicts preserving the ticket's AC and target-branch changes,
         stage resolved files and complete the rebase.
      3. Confirm a clean Git status, no unmerged paths, and no rebase state.
         Run git diff --check origin/<target_branch>...HEAD.
      4. Write {{var:RUN_ARTIFACTS}}/git-fix-report.txt with resolved files and blockers.
         Emit OK when the rebase and Git checks pass. Otherwise emit GATE_FAIL.
         prepare_review runs the tests and lint checks.

  reject_gate:
    env:
      REJECT_ROUNDS: '{{var:REJECT_ROUNDS}}'
      VERIFY_ONLY: '{{var:VERIFY_ONLY}}'
    timeout: 60
    on_signal:
      VERIFICATION_FAILED: notify_failure
      TOO_MANY_ROUNDS: notify_failure
      PANEL_REJECTED: implement_code
      __failed__: notify_failure
      __timeout__: notify_failure
      __default__: notify_failure
    shell: |
      set -euo pipefail
      if [ "${VERIFY_ONLY}" = "true" ]; then
        printf '<signal:VERIFICATION_FAILED>Existing implementation failed checks or review: %s.</signal:VERIFICATION_FAILED>\n' "${MEDULLA_LAST_MESSAGE:-}"
        exit 0
      fi
      limit="${REJECT_ROUNDS:-3}"
      # Share the repair limit across failed checks and review rounds.
      since="$(jq -r 'select(.node=="git_fix")|.step' "$MEDULLA_RUN_DIR/journal.jsonl" 2>/dev/null | tail -1 || true)"
      since="${since:-0}"
      done_rounds="$(jq -r --argjson s "$since" 'select((.signal=="REJECT" or ((.node=="prepare_review" or .node=="git_landing") and .signal=="GATE_FAIL")) and (.step // 0) > $s)|1' "$MEDULLA_RUN_DIR/journal.jsonl" 2>/dev/null | grep -c 1 || true)"
      done_rounds="${done_rounds:-0}"
      finding="$(jq -r --argjson s "$since" 'select((.signal=="REJECT" or ((.node=="prepare_review" or .node=="git_landing") and .signal=="GATE_FAIL")) and (.step // 0) > $s)|.message' "$MEDULLA_RUN_DIR/journal.jsonl" 2>/dev/null | tail -1 || true)"

      # Preserve the full repair history for the coder.
      mkdir -p "$MEDULLA_RUN_DIR/artifacts"
      {
        printf 'Round %s of %s\n\nLatest blocker:\n%s\n\nRepair history:\n' \
          "$done_rounds" "$limit" "$finding"
        jq -r --argjson s "$since" 'select((.signal=="REJECT" or ((.node=="prepare_review" or .node=="git_landing") and .signal=="GATE_FAIL")) and (.step // 0) > $s)|"- "+.message' "$MEDULLA_RUN_DIR/journal.jsonl" 2>/dev/null || true
      } > "$MEDULLA_RUN_DIR/artifacts/rejects.txt" 2>/dev/null || true

      # Check the limit before emitting a repair signal.
      if [ "$done_rounds" -ge "$limit" ]; then
        echo "<signal:TOO_MANY_ROUNDS>Checks or review failed ${done_rounds} times. Latest blocker: ${finding}</signal:TOO_MANY_ROUNDS>"
        exit 0
      fi

      # Pass full review paths without excerpts.
      reviews="$(ls "$MEDULLA_RUN_DIR"/artifacts/*.md 2>/dev/null | tr '\n' ' ' || true)"
      printf '<signal:PANEL_REJECTED>Repair round %s of %s. Blocker: %s. Read the named check logs and full reviews: %s. Resolve blocking findings. History: %s/artifacts/rejects.txt</signal:PANEL_REJECTED>\n' \
        "$done_rounds" "$limit" "$finding" "${reviews:-none}" "$MEDULLA_RUN_DIR"
