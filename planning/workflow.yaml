version: '2'
start: prepare
# Covers prepare 480 + research 600 + necessity 1200, then up to two
# rounds of design 1200 + critics 1200, + publication. At 1800 s a real run died
# in the critics pool; a rejected plan gets one revision round (critique_join),
# and a clean base advance at finish gets one drift review of 600.
timeout: 9300
defaults:
  timeout: 60
vars:
  RESEARCH_MODEL: gpt-6.1-sol
  DESIGN_MODEL: claude-opus-5-5
  PLANNING_PYTHON: python3
  OUTPUT_CONTRACT: ''
  critique: ''
nodes:
  prepare:
    timeout: 480
    shell: '"$PLANNING_PYTHON" "$MEDULLA_WORKFLOW_DIR/stages.py" prepare'
    on_signal:
      PREPARED: research
      BLOCKED: __exit_fail__
      __failed__: failed
      __default__: failed
  research:
    # A branch whose report fails validation gets one more attempt before the
    # whole plan turns NOT_READY (min_success needs every branch); the step
    # timeout covers both attempts.
    timeout: 600
    max_attempts: 2
    env: &agent_environment
      JOPPA_TOKEN: ''
      JOPPA_TOKEN_FILE: ''
      NTK_KEY: ''
      NTK_CONFIG: /dev/null
    max_parallel: 3
    min_success: 3
    inputs:
      - slug: code
        question: Inspect current behavior and relevant history with CBM. Verify reuse and SIMILAR_TO candidates in source. Inspect the ticket module and affected interfaces. Do not design edits. Never index or start a watcher.
      - slug: knowledge
        question: Reconcile the assignment with owner decisions, applicable Equill knowledge, repository documentation and failure evidence. Identify missing decisions and contradictions.
      - slug: external
        question: Decide whether external research is needed. If needed, consult primary documentation for the actual project versions and explain applicability. If unnecessary, return not_needed with the concrete reason. Never invent sources.
    agent:
      harness: codex
      model: '{{var:RESEARCH_MODEL}}'
      effort: high
      sandbox: read-only
      args:
        - --ignore-user-config
        - -c
        - 'mcp_servers.codebase-memory.command={{var:CBM_BIN_TOML}}'
        - -c
        - 'mcp_servers.codebase-memory.env.CBM_CACHE_DIR={{var:CBM_CACHE_DIR_TOML}}'
        - -c
        - 'mcp_servers.codebase-memory.env.CBM_ALLOWED_ROOT={{var:CBM_ALLOWED_ROOT_TOML}}'
        - -c
        - 'mcp_servers.codebase-memory.enabled_tools=["list_projects","search_graph","search_code","get_code_snippet","query_graph","trace_path","get_graph_schema","get_architecture","index_status","check_index_coverage"]'
        - -c
        - 'mcp_servers.codebase-memory.required=true'
        - -c
        - 'web_search="live"'
    prompt: |
      {{file:prompts/research.md}}
      Mandatory Equill contract:
      {{var:researcher_contract}}
      Assignment: {{var:assignment}}
      Recent Git history: {{var:source_history}}
      Applicable Equill knowledge: {{var:knowledge}}
      Your independent branch: {{input.slug}}
      Your question: {{input.question}}
    post: '"$PLANNING_PYTHON" "$MEDULLA_WORKFLOW_DIR/stages.py" capture research'
    on_signal:
      __done__: research_join
      __failed__: failed
      __empty__: failed
  research_join:
    shell: '"$PLANNING_PYTHON" "$MEDULLA_WORKFLOW_DIR/stages.py" research_join'
    on_signal:
      RESEARCHED: necessity
      BLOCKED: __exit_fail__
      __failed__: failed
  necessity:
    timeout: 1200
    max_attempts: 2
    env:
      JOPPA_TOKEN: ''
      JOPPA_TOKEN_FILE: ''
      NTK_KEY: ''
      NTK_CONFIG: /dev/null
      PLANNING_ASSESSMENT_DIGEST: '{{var:assessment_digest}}'
    agent:
      harness: codex
      model: gpt-6.1-sol
      effort: high
      sandbox: read-only
      args:
        - --ignore-user-config
    prompt: |
      {{file:prompts/necessity.md}}
      Mandatory Equill contract:
      {{var:critic_contract}}
      Assignment: {{var:assignment}}
      Research: {{var:research}}
    post: '"$PLANNING_PYTHON" "$MEDULLA_WORKFLOW_DIR/stages.py" capture necessity'
    on_signal:
      ASSESSED: design
      NEEDS_HUMAN: needs_human
      __failed__: failed
      __default__: failed
  needs_human:
    timeout: 660
    shell: '"$PLANNING_PYTHON" "$MEDULLA_WORKFLOW_DIR/stages.py" needs_human'
    on_signal:
      BLOCKED: __exit_fail__
      __failed__: failed
      __default__: failed
  design:
    # Real repositories need more than five minutes of reading and reasoning
    # (first live run: design was still working at 300 s).
    timeout: 1200
    # A vetoed report retries once; Medulla puts the veto reason in the prompt
    # (first live design exceeded the NTK text limit and had no second chance).
    max_attempts: 2
    env: *agent_environment
    agent:
      harness: claude-code
      model: '{{var:DESIGN_MODEL}}'
      effort: high
      sandbox: read-only
      args:
        - --strict-mcp-config
        - --setting-sources=
        - --mcp-config
        - '{"mcpServers":{}}'
    prompt: |
      {{file:prompts/design.md}}
      Mandatory Equill contract:
      {{var:designer_contract}}
      Assignment: {{var:assignment}}
      Research: {{var:research}}
      Necessity assessment: {{var:necessity}}
      Critic findings on your previous plan (empty in the first round): {{var:critique}}
      Additional output contract: {{var:OUTPUT_CONTRACT}}
    post: '"$PLANNING_PYTHON" "$MEDULLA_WORKFLOW_DIR/stages.py" capture plan'
    on_signal:
      PLANNED: review_input
      __failed__: failed
      __default__: failed
  review_input:
    shell: '"$PLANNING_PYTHON" "$MEDULLA_WORKFLOW_DIR/stages.py" review_input'
    on_signal:
      REVIEW: critics
      BLOCKED: __exit_fail__
      __failed__: failed
  critics:
    pre: '"$PLANNING_PYTHON" "$MEDULLA_WORKFLOW_DIR/stages.py" prepare_critic'
    # Real repositories need more than five minutes of reading and reasoning
    # (first live run: design was still working at 300 s).
    timeout: 1200
    # A vetoed report retries once; Medulla puts the veto reason in the prompt
    # (first live design exceeded the NTK text limit and had no second chance).
    max_attempts: 2
    env:
      JOPPA_TOKEN: ''
      JOPPA_TOKEN_FILE: ''
      NTK_KEY: ''
      NTK_CONFIG: /dev/null
      PLANNING_REVIEW_DIGEST: '{{var:plan_digest}}'
    max_parallel: 2
    min_success: 2
    inputs:
      - &simplicity_seat
        slug: simplicity
        harness: agy
        model: Gemini 3.1 Pro (High)
        env:
          BROKER_AGY_HOME: '{{var:AGY_PROFILE_HOME}}'
          BROKER_ISOLATE_MCP: '1'
        question: Does the plan solve the underlying problem or prop up a flawed design? Identify workarounds. Compare concrete alternatives by AC, simplicity, efficiency, reliability and extensibility. Cite code evidence and explain the advantage. Reject speculative abstractions; preference alone is not a blocker.
      - &correctness_seat
        slug: correctness
        harness: opencode
        model: zai-coding-plan/glm-5.3
        flag: --pure
        env:
          XDG_CONFIG_HOME: '{{var:OPENCODE_CONFIG_HOME}}'
          OPENCODE_CONFIG_DIR: '{{var:OPENCODE_CONFIG_HOME}}/opencode'
          OPENCODE_CONFIG: ''
          OPENCODE_DISABLE_PROJECT_CONFIG: 'true'
        question: Can the mechanisms meet the AC within the declared modules? Are prerequisite outputs sufficient? Do observable checks cover success and failure? Check assumptions and compatibility. Lane owns files, functions and build details.
    agent: &critic_agent
      harness: '{{input.harness}}'
      model: '{{input.model}}'
      effort: high
      sandbox: read-only
      args:
        - '{{input.flag:-}}'
    prompt: |
      {{file:prompts/critic.md}}
      Mandatory Equill contract:
      {{var:critic_contract}}
      Assignment: {{var:assignment}}
      Research: {{var:research}}
      Necessity assessment: {{var:necessity}}
      Frozen plan: {{var:plan}}
      Your independent perspective: {{input.slug}}
      Your question: {{input.question}}
      Additional output contract: {{var:OUTPUT_CONTRACT}}
    post: '"$PLANNING_PYTHON" "$MEDULLA_WORKFLOW_DIR/stages.py" capture critic'
    on_signal:
      __done__: critique_join
      __failed__: failed
      __empty__: failed
  critique_join:
    # A rejected plan goes back to design once with the blocking findings
    # (first live reject: two fixable findings ended the run with no second chance).
    shell: '"$PLANNING_PYTHON" "$MEDULLA_WORKFLOW_DIR/stages.py" critique_join'
    on_signal:
      REVIEWED: finish
      REVISE: design
      __failed__: failed
      __default__: failed
  finish:
    # Publication can take up to 600 seconds, plus the freshness checks.
    timeout: 660
    shell: '"$PLANNING_PYTHON" "$MEDULLA_WORKFLOW_DIR/stages.py" finish'
    on_signal:
      READY: __exit_ok__
      DRIFT: drift_review
      BLOCKED: __exit_fail__
      __failed__: failed
      __default__: failed
  drift_review:
    # The base advanced cleanly after the critics cleared the plan. The same seats
    # judge whether the landed diff affects it. finish runs once more and publishes
    # only if every seat clears; a failed or missing verdict there is code drift.
    pre: '"$PLANNING_PYTHON" "$MEDULLA_WORKFLOW_DIR/stages.py" prepare_critic'
    timeout: 600
    max_attempts: 2
    env:
      JOPPA_TOKEN: ''
      JOPPA_TOKEN_FILE: ''
      NTK_KEY: ''
      NTK_CONFIG: /dev/null
      PLANNING_DRIFT_DIGEST: '{{var:drift_digest}}'
    max_parallel: 3
    min_success: 3
    inputs:
      - slug: necessity
        harness: codex
        model: gpt-6.1-sol
        flag: --ignore-user-config
      - *simplicity_seat
      - *correctness_seat
    agent: *critic_agent
    prompt: |
      {{file:prompts/drift.md}}
      Mandatory Equill contract:
      {{var:critic_contract}}
      Assignment: {{var:assignment}}
      Research: {{var:research}}
      Necessity assessment: {{var:necessity}}
      Frozen plan: {{var:plan}}
      Base advance: {{var:drift}}
      Landed diff:
      {{var:drift_diff}}
      Your independent perspective: {{input.slug}}
    post: '"$PLANNING_PYTHON" "$MEDULLA_WORKFLOW_DIR/stages.py" capture drift'
    on_signal:
      __done__: finish
      __failed__: finish
      __empty__: finish
  failed:
    shell: '"$PLANNING_PYTHON" "$MEDULLA_WORKFLOW_DIR/stages.py" fail'
    on_signal:
      BLOCKED: __exit_fail__
      __failed__: __exit_fail__
      __default__: __exit_fail__
