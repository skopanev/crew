version: '2'
keep_runs: 1000
start: prepare
# Tasker writes the implementation Tasks of one claimed AC. It runs as a configured flow of planning-joppa.
# Owner 17 Nov: 2 hours in all, no per-step limits. The deadline runs failed once to release the claim.
timeout: &workflow_timeout 7200
on_timeout: failed
defaults:
  timeout: *workflow_timeout
vars:
  PLANNING_PYTHON: python3
  # launch.py supplies the shared flow stages, the selected item and the publication policy.
  CREW_FLOW_STAGES: ''
  FLOW_PUBLICATION: ''
  AGY_PROFILE_HOME: ''
  # The project supplies these in config.vars.
  TASKER_REPOS: ''
  TASKER_GATE_REPOSITORIES: '[]'
  TASKER_TREE_ROOT: ''
  CREW_WORKFLOW_DIR: ''
  CBM_BIN: ''
  CBM_CACHE_DIR: ''
  CBM_ALLOWED_ROOT: ''
  TASK_STAGE: to_implement
  TASKER_BUN: bun
  PLAN_MAX_FILES: '8'
  PLAN_MAX_LINES: '300'
  AUTHOR_MODEL: claude-opus-5-5
  CRITIC_CODEX_MODEL: gpt-6.2-sol
  CRITIC_SECOND_HARNESS: claude-code
  CRITIC_SECOND_MODEL: claude-sonnet-5-5
  REWORK_LIMIT: '3'
  TASKER_RETURN_LIMIT: '3'
  FINDING_CRITERIA: ''
  STUCK_TAG: ''
  TASKER_RETURN_STAGE: ''
  TASKER_TEST_RETURN_STAGE: ''
  TASKER_TASK_REVIEW_STAGE: ''
  TASKER_IMPLEMENT_STAGE: ''
  TASKER_GAP_TAGS: ''
  # true: run the whole flow, publish nothing and release the claim with outcome DRY_RUN.
  DRY_RUN: 'false'
  round: '1'
  tasker_assignment_path: ''
  draft: ''
  draft_digest: ''
  critique: ''
  check: ''
nodes:
  prepare:
    shell: |
      set -eu
      for name in CREW_FLOW_STAGES FLOW_PUBLICATION TASKER_REPOS TASKER_TREE_ROOT CREW_WORKFLOW_DIR CBM_BIN CBM_CACHE_DIR CBM_ALLOWED_ROOT FINDING_CRITERIA STUCK_TAG TASKER_RETURN_STAGE TASKER_TEST_RETURN_STAGE TASKER_TASK_REVIEW_STAGE TASKER_IMPLEMENT_STAGE TASKER_GAP_TAGS; do
        eval "value=\${$name:-}"
        [ -n "$value" ] || { echo "tasker: $name is required" >&2; exit 2; }
      done
      case "$REWORK_LIMIT$PLAN_MAX_FILES$PLAN_MAX_LINES$TASKER_RETURN_LIMIT" in
        *[!0-9]*) echo 'tasker: REWORK_LIMIT, PLAN_MAX_FILES, PLAN_MAX_LINES and TASKER_RETURN_LIMIT must be integers' >&2; exit 2 ;;
      esac
      [ "${TASKER_RETURN_LIMIT:-0}" -gt 0 ] || { echo 'tasker: TASKER_RETURN_LIMIT must be positive' >&2; exit 2; }
      case "$DRY_RUN" in true|false) ;; *) echo 'tasker: DRY_RUN must be true or false' >&2; exit 2 ;; esac
      case "$CRITIC_SECOND_HARNESS" in claude-code|codex) ;; *) echo 'tasker: CRITIC_SECOND_HARNESS must be claude-code or codex' >&2; exit 2 ;; esac
      [ "$CRITIC_CODEX_MODEL" != "$CRITIC_SECOND_MODEL" ] && [ "$AUTHOR_MODEL" != "$CRITIC_SECOND_MODEL" ] || {
        echo 'tasker: the author and the two critics need distinct models' >&2; exit 2; }
      printf '%s' "$FLOW_PUBLICATION" | jq -e '(.allowed_operations | index("note") != null) and
        ((.create_kinds == ["task"] and (.update_kinds | sort) == ["ac", "test"]) or
         (.create_kinds == [] and (.update_kinds | sort) == ["ac", "task"]))' >/dev/null || {
        echo 'tasker: publication must match the AC or Task input policy' >&2; exit 2; }
      preclaim="$("$TASKER_BUN" "$MEDULLA_WORKFLOW_DIR/completion.mjs" preclaim)"
      case "$preclaim" in *'<signal:BLOCKED>'*) printf '%s\n' "$preclaim"; exit 0 ;; esac
      prepared="$(FLOW_ASSIGNMENT_INLINE=false "$PLANNING_PYTHON" "$CREW_FLOW_STAGES" prepare)"
      # Keep the contracts. This node emits its own assignment path and routing signal after the active Task check.
      printf '%s\n' "$prepared" | grep -v -e '^<signal:PREPARED>' -e '^<signal:var key=assignment>' || true
      case "$prepared" in *'<signal:PREPARED>'*) ;; *) exit 0 ;; esac
      a="$(cd "$MEDULLA_RUN_DIR/artifacts" && pwd -P)"
      file="$(printf '%s' "$FLOW_PUBLICATION" | jq -er '.file | select(type == "string" and test("^[A-Za-z0-9._-]+[.]json$"))')"
      completion="$("$TASKER_BUN" "$MEDULLA_WORKFLOW_DIR/completion.mjs" prepare)"
      case "$completion" in *'<signal:DECISION>'*) printf '%s\n' "$completion"; exit 0 ;; esac
      # The native filter excludes an AC with a Task in to_implement. A Task in in_progress or to_review,
      # or a Task that a lane holds, also keeps the AC out: release the claim and write nothing else.
      active="$(jq -r '[.children[] | select(.kind == "task") | select(.document.data.stage == "in_progress" or
        .document.data.stage == "to_review" or ((.document.data.assignee // "") | startswith("crew-lane:"))) | .address] | join(", ")' "$a/input.json")"
      if [ -n "$active" ]; then
        jq -n --arg active "$active" '{operations: [], outcome: {status: "blocked", reason_code: "ACTIVE_TASK",
          reason: ("The AC has an active Task: " + $active)}}' > "$a/$file"
        echo '<signal:ACTIVE>The AC has an active Task. Release the claim.</signal:ACTIVE>'
        exit 0
      fi
      bash "$MEDULLA_WORKFLOW_DIR/trees.sh" add
      # Agents read the AC, its Sources, its Tests and Tasks, and the develop trees. input.json stays complete for publication.
      if [ "$(jq -r '.schema.types[.selected.kind].role' "$a/input.json")" = task ]; then
        view="$(node "$MEDULLA_WORKFLOW_DIR/repair-context.mjs" prepare "$a")"
      else
      view="$(jq -c --slurpfile trees "$a/trees.json" '
        ([.selected.kind, "test", "task"] + [.references[]?[]?.kind]) as $kinds |
        del(.help, .claim_revision, .claim_revisions) |
        .schema.types |= with_entries(select(.key as $kind | $kinds | index($kind) != null)) |
        . + {develop_trees: ($trees[0] | map_values({path, sha}))}' "$a/input.json")"
      fi
      # Escape template markers as JSON strings. Decoding the JSON preserves the complete view.
      printf '%s' "$view" | jq -r 'tojson | gsub("\\{\\{"; "\\u007b\\u007b")' > "$a/tasker-assignment.json.tmp"
      mv "$a/tasker-assignment.json.tmp" "$a/tasker-assignment.json"
      printf '<signal:var key=tasker_assignment_path>%s</signal:var>\n' "$a/tasker-assignment.json"
      printf '<signal:var key=TASKER_TREES>%s</signal:var>\n' "$TASKER_TREE_ROOT/tasker-$(basename "$MEDULLA_RUN_DIR")"
      # The CBM server of the planner: the shared index store, no watcher and no indexing outside the allowed root.
      printf '<signal:var key=TASKER_MCP_CONFIG>%s</signal:var>\n' "$(jq -nc --arg bin "$CBM_BIN" --arg cache "$CBM_CACHE_DIR" --arg root "$CBM_ALLOWED_ROOT" \
        '{mcpServers: {"codebase-memory": {command: $bin, args: [], env: {CBM_CACHE_DIR: $cache, CBM_ALLOWED_ROOT: $root}}}}')"
      for name in CBM_BIN CBM_CACHE_DIR CBM_ALLOWED_ROOT; do
        eval "value=\${$name}"
        printf '<signal:var key=%s_TOML>%s</signal:var>\n' "$name" "$(jq -nc --arg value "$value" '$value')"
      done
      echo '<signal:READY_TO_WRITE>The claim, the context and the develop trees are ready.</signal:READY_TO_WRITE>'
    on_signal:
      READY_TO_WRITE: author
      ACTIVE: publish
      DECISION: publish
      BLOCKED: __exit_fail__
      __failed__: failed
      __default__: failed
  author:
    max_attempts: 2
    # No tracker credentials. Read-only tools on the develop trees and the CBM index.
    env: &agent_environment
      LANE_MEMORY_CONFIG: ''
      JOPPA_TOKEN: ''
      JOPPA_TOKEN_FILE: ''
      NTK_KEY: ''
      NTK_CONFIG: /dev/null
    agent:
      harness: claude-code
      model: '{{var:AUTHOR_MODEL}}'
      effort: high
      sandbox: read-only
      args: &claude_args
        - --strict-mcp-config
        - --setting-sources=
        - --mcp-config
        - '{{var:TASKER_MCP_CONFIG}}'
        - --add-dir
        - '{{var:TASKER_TREES}}'
        - --allowedTools
        - Read,Grep,Glob,mcp__codebase-memory__list_projects,mcp__codebase-memory__search_graph,mcp__codebase-memory__search_code,mcp__codebase-memory__get_code_snippet,mcp__codebase-memory__query_graph,mcp__codebase-memory__trace_path,mcp__codebase-memory__get_graph_schema,mcp__codebase-memory__get_architecture,mcp__codebase-memory__index_status,mcp__codebase-memory__check_index_coverage
        - --disallowedTools
        - Bash,WebFetch,WebSearch,Task,Edit,Write,NotebookEdit,mcp__codebase-memory__index_repository,mcp__codebase-memory__delete_project,mcp__codebase-memory__manage_adr,mcp__codebase-memory__ingest_traces
    prompt: |
      {{file:prompts/author.md}}
      Mandatory role contract:
      {{var:author_contract}}
      The critics review your draft with this contract:
      {{var:critic_contract}}
      Limits: {{var:PLAN_MAX_FILES}} files and {{var:PLAN_MAX_LINES}} changed lines for each Task. Migration SQL and metadata do not count.
      Assignment: {{file:{{var:tasker_assignment_path}}}}
      Your previous draft (empty in the first round): {{var:draft}}
      Machine check of your previous draft (empty in the first round): {{var:check}}
      Critic findings on your previous draft (empty in the first round): {{var:critique}}
    post: '"$PLANNING_PYTHON" "$CREW_FLOW_STAGES" capture draft'
    on_signal:
      CAPTURED: draft_check
      __failed__: failed
      __default__: failed
  draft_check:
    # Size, gate forecast, paths and Reporter names, on the develop trees. The critics review these exact bytes.
    shell: |
      set -eu
      a="$MEDULLA_RUN_DIR/artifacts"
      rm -f "$a"/critic-*.json "$a/rejected-review.json"
      rc=0
      node "$MEDULLA_WORKFLOW_DIR/check.mjs" "$a" || rc=$?
      [ "$rc" -le 1 ] || exit "$rc"
      printf '<signal:var key=check>%s</signal:var>\n' "$(jq -c . "$a/check.json")"
      if [ "$rc" -eq 0 ]; then
        if command -v sha256sum >/dev/null; then hash="$(sha256sum "$a/draft.json")"; else hash="$(shasum -a 256 "$a/draft.json")"; fi
        printf '<signal:var key=draft_digest>%s</signal:var>\n' "${hash%% *}"
        echo '<signal:CHECKED>The draft passed the machine checks. The critics review it.</signal:CHECKED>'
      elif [ "${round:-1}" -le "$REWORK_LIMIT" ]; then
        echo '<signal:var key=critique>{}</signal:var>'
        printf '<signal:var key=round>%s</signal:var>\n' "$(( ${round:-1} + 1 ))"
        echo '<signal:REVISE>The draft failed the machine checks. The author corrects it.</signal:REVISE>'
      else
        jq -r '"Tasker stopped: the draft still fails the machine checks. " + (.problems | join("\n"))' "$a/check.json" > "$a/failure.txt"
        echo '<signal:REJECTED>The revised draft still fails the machine checks.</signal:REJECTED>'
      fi
    on_signal:
      CHECKED: critics
      REVISE: author
      REJECTED: rejected
      __failed__: failed
      __default__: failed
  critics:
    max_attempts: 2
    env:
      LANE_MEMORY_CONFIG: ''
      JOPPA_TOKEN: ''
      JOPPA_TOKEN_FILE: ''
      NTK_KEY: ''
      NTK_CONFIG: /dev/null
      TASKER_DRAFT_DIGEST: '{{var:draft_digest}}'
    max_parallel: 2
    min_success: 2
    # Two independent seats with different models. Neither seat sees the other seat.
    inputs:
      shell: |
        tools='Read,Grep,Glob,mcp__codebase-memory__list_projects,mcp__codebase-memory__search_graph,mcp__codebase-memory__search_code,mcp__codebase-memory__get_code_snippet,mcp__codebase-memory__query_graph,mcp__codebase-memory__trace_path,mcp__codebase-memory__get_graph_schema,mcp__codebase-memory__get_architecture,mcp__codebase-memory__index_status,mcp__codebase-memory__check_index_coverage'
        denied='Bash,WebFetch,WebSearch,Task,Edit,Write,NotebookEdit,mcp__codebase-memory__index_repository,mcp__codebase-memory__delete_project,mcp__codebase-memory__manage_adr,mcp__codebase-memory__ingest_traces'
        jq -nc --arg codex "$CRITIC_CODEX_MODEL" --arg harness "$CRITIC_SECOND_HARNESS" --arg model "$CRITIC_SECOND_MODEL" \
          --arg bin "$CBM_BIN_TOML" --arg cache "$CBM_CACHE_DIR_TOML" --arg root "$CBM_ALLOWED_ROOT_TOML" \
          --arg mcp "$TASKER_MCP_CONFIG" --arg trees "$TASKER_TREES" --arg tools "$tools" --arg denied "$denied" '
          def codex: {a1: "--ignore-user-config", a2: "-c", a3: ("mcp_servers.codebase-memory.command=" + $bin),
            a4: "-c", a5: ("mcp_servers.codebase-memory.env.CBM_CACHE_DIR=" + $cache),
            a6: "-c", a7: ("mcp_servers.codebase-memory.env.CBM_ALLOWED_ROOT=" + $root),
            a8: "-c", a9: "mcp_servers.codebase-memory.enabled_tools=[\"list_projects\",\"search_graph\",\"search_code\",\"get_code_snippet\",\"query_graph\",\"trace_path\",\"get_graph_schema\",\"get_architecture\",\"index_status\",\"check_index_coverage\"]",
            a10: "-c", a11: "mcp_servers.codebase-memory.required=true"};
          [{slug: "codex", harness: "codex", model: $codex} + codex,
           ({slug: "second", harness: $harness, model: $model} +
            if $harness == "codex" then codex
            else {a1: "--strict-mcp-config", a2: "--setting-sources=", a3: "--mcp-config", a4: $mcp, a5: "--add-dir", a6: $trees,
              a7: "--allowedTools", a8: $tools, a9: "--disallowedTools", a10: $denied} end)]'
    agent:
      harness: '{{input.harness}}'
      model: '{{input.model}}'
      effort: high
      sandbox: read-only
      args:
        - '{{input.a1:-}}'
        - '{{input.a2:-}}'
        - '{{input.a3:-}}'
        - '{{input.a4:-}}'
        - '{{input.a5:-}}'
        - '{{input.a6:-}}'
        - '{{input.a7:-}}'
        - '{{input.a8:-}}'
        - '{{input.a9:-}}'
        - '{{input.a10:-}}'
        - '{{input.a11:-}}'
    prompt: |
      {{file:prompts/critic.md}}
      Mandatory role contract:
      {{var:critic_contract}}
      Limits: {{var:PLAN_MAX_FILES}} files and {{var:PLAN_MAX_LINES}} changed lines for each Task. Migration SQL and metadata do not count.
      Assignment: {{file:{{var:tasker_assignment_path}}}}
      Machine check of the draft: {{var:check}}
      Draft digest: {{var:draft_digest}}
      Frozen draft: {{var:draft}}
    post: '"$PLANNING_PYTHON" "$CREW_FLOW_STAGES" capture "critic-$(printf %s "$MEDULLA_INPUT" | jq -r .slug)"'
    on_signal:
      __done__: review_join
      __failed__: failed
      __empty__: failed
  review_join:
    # Publish only when both seats reviewed this exact draft, approve it and answer yes to every check.
    shell: |
      set -eu
      a="$MEDULLA_RUN_DIR/artifacts"
      file="$(printf '%s' "$FLOW_PUBLICATION" | jq -er '.file | select(type == "string" and test("^[A-Za-z0-9._-]+[.]json$"))')"
      if command -v sha256sum >/dev/null; then hash="$(sha256sum "$a/draft.json")"; else hash="$(shasum -a 256 "$a/draft.json")"; fi
      verdict="$(jq -nc --arg digest "${hash%% *}" --arg run "$(basename "$MEDULLA_RUN_DIR")" --arg stage "$TASK_STAGE" --arg dry "$DRY_RUN" \
        --arg implement_stage "$TASKER_IMPLEMENT_STAGE" --argjson gap_tags "$TASKER_GAP_TAGS" \
        --slurpfile draft "$a/draft.json" --slurpfile input "$a/input.json" \
        --slurpfile codex "$a/critic-codex.json" --slurpfile second "$a/critic-second.json" \
        -f "$MEDULLA_WORKFLOW_DIR/publication.jq")"
      if [ "$(printf '%s' "$verdict" | jq -r .approved)" = true ] &&
          [ "$(jq -r '.schema.types[.selected.kind].role' "$a/input.json")" = task ]; then
        verdict="$(node "$MEDULLA_WORKFLOW_DIR/repair-context.mjs" publication "$a")"
      fi
      if [ "$(jq -r '.schema.types[.selected.kind].role' "$a/input.json")" != task ]; then
        verdict="$(printf '%s' "$verdict" | node "$MEDULLA_WORKFLOW_DIR/test-bindings.mjs" "$a")"
      fi
      if [ "$(printf '%s' "$verdict" | jq -r .approved)" = true ]; then
        printf '%s' "$verdict" | jq .would_publish > "$a/would-publish.json"
        printf '%s' "$verdict" | jq .publication > "$a/$file"
        echo '<signal:APPROVED>Both independent critics approved the draft.</signal:APPROVED>'
      elif [ "${round:-1}" -le "$REWORK_LIMIT" ]; then
        critique="$(printf '%s' "$verdict" | jq -c '.critique | tojson | gsub("</signal:var>"; "") | fromjson? // {}')"
        printf '<signal:var key=critique>%s</signal:var>\n' "$critique"
        printf '<signal:var key=round>%s</signal:var>\n' "$(( ${round:-1} + 1 ))"
        echo '<signal:REVISE>The critics did not approve the draft. The author revises it within the configured limit.</signal:REVISE>'
      else
        printf '%s' "$verdict" > "$a/rejected-review.json"
        printf '%s' "$verdict" | jq -r --arg limit "$REWORK_LIMIT" '"Tasker stopped after " + $limit + " reworks.\n" + (.critique | tojson)' > "$a/failure.txt"
        echo '<signal:REJECTED>The critics did not approve the revised draft.</signal:REJECTED>'
      fi
    on_signal:
      APPROVED: publish
      REVISE: author
      REJECTED: rejected
      __failed__: failed
      __default__: failed
  rejected:
    # Only supported findings return an AC. A Task repair never changes AC returns.
    shell: |
      set -eu
      a="$MEDULLA_RUN_DIR/artifacts"
      file="$(printf '%s' "$FLOW_PUBLICATION" | jq -er '.file | select(type == "string" and test("^[A-Za-z0-9._-]+[.]json$"))')"
      review_file="$a/rejected-review.json"
      [ -s "$review_file" ] || review_file=/dev/null
      jq -n --arg dry "$DRY_RUN" --arg run "$(basename "$MEDULLA_RUN_DIR")" \
        --arg finding_criteria "$FINDING_CRITERIA" --arg stuck_tag "$STUCK_TAG" \
        --arg return_stage "$TASKER_RETURN_STAGE" --arg test_return_stage "$TASKER_TEST_RETURN_STAGE" \
        --arg task_review_stage "$TASKER_TASK_REVIEW_STAGE" \
        --slurpfile review "$review_file" --argjson return_limit "${TASKER_RETURN_LIMIT:?TASKER_RETURN_LIMIT is required}" \
        --argjson repository "$(node "$MEDULLA_WORKFLOW_DIR/repair-context.mjs" repository "$a")" \
        --slurpfile input "$a/input.json" --rawfile reason "$a/failure.txt" \
        -f "$MEDULLA_WORKFLOW_DIR/rejected.jq" > "$a/$file"
      echo '<signal:DECISION>Publish the refusal and release the claim.</signal:DECISION>'
    on_signal:
      DECISION: publish
      __failed__: failed
      __default__: failed
  publish:
    # The shared stage adds the claim release and refuses operations outside config.publication.
    shell: |
      rc=0
      "$TASKER_BUN" "$MEDULLA_WORKFLOW_DIR/completion.mjs" verify || rc=$?
      if [ "$rc" -eq 0 ]; then "$PLANNING_PYTHON" "$CREW_FLOW_STAGES" publish || rc=$?; fi
      bash "$MEDULLA_WORKFLOW_DIR/trees.sh" remove >&2 || true
      exit "$rc"
    on_signal:
      READY: __exit_ok__
      BLOCKED: __exit_fail__
      __failed__: failed
      __default__: failed
  failed:
    # A shared stage that already recorded result.json released or retained its claim. Do not repeat it.
    shell: |
      set -eu
      a="$MEDULLA_RUN_DIR/artifacts"
      bash "$MEDULLA_WORKFLOW_DIR/trees.sh" remove >&2 || true
      record_code() {
        if [ -s "$a/failure-code.txt" ] && [ -e "$a/result.json" ]; then
          jq --arg code "$(cat "$a/failure-code.txt")" '. + {reason_code: $code}' "$a/result.json" > "$a/result.json.tmp"
          mv "$a/result.json.tmp" "$a/result.json"
        fi
      }
      if [ -e "$a/result.json" ]; then
        record_code
        echo '<signal:BLOCKED>The shared stage already recorded the result.</signal:BLOCKED>'
        exit 0
      fi
      [ -s "$a/failure.txt" ] || printf '%s\n' "${MEDULLA_LAST_MESSAGE:-Tasker stopped before publication}" | cut -c1-1000 > "$a/failure.txt"
      rc=0
      "$PLANNING_PYTHON" "$CREW_FLOW_STAGES" fail || rc=$?
      record_code
      exit "$rc"
    on_signal:
      BLOCKED: __exit_fail__
      __failed__: __exit_fail__
      __default__: __exit_fail__
