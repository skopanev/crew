# Crew copy of runtime-d7eeb0d/writer (owner, 21 Nov 2026, process:sample0004 r4). The engine stays unchanged.
# Changes (scheme crew_team, step Writer): READY moves the AC to READY_STAGE and sets returns to 0.
# Only an AC defect with a three-part finding moves it to RETURN_STAGE. A GAP adds the question tag and keeps the stage.
# REJECTED keeps the stage. A defect or a REJECTED adds 1 to returns. INVALID breaks the output contract:
# it is a technical failure, and the shared release keeps the stage and returns.
# At RETURNS_LIMIT the AC gets STUCK_TAG and a question to the Owner.
version: '2'
keep_runs: 1000
start: prepare
# The workflow deadline invokes failed once to release its claim.
timeout: &workflow_timeout 3600
on_timeout: failed
# Override Medulla's shorter action fallback with the same global budget.
defaults:
  timeout: *workflow_timeout
vars:
  PLANNING_PYTHON: python3
  # launch.py supplies the shared flow stages, the selected item and the publication policy.
  CREW_FLOW_STAGES: ''
  FLOW_PUBLICATION: ''
  AUTHOR_MODEL: claude-opus-5-5
  CRITIC_CODEX_MODEL: gpt-6.1-sol
  CRITIC_SECOND_HARNESS: claude-code
  CRITIC_SECOND_MODEL: claude-sonnet-5-5
  AGY_PROFILE_HOME: ''
  # The project names its native Test kind in config.vars.
  TEST_KIND: ''
  SOURCE_GAP_TAG: ''
  TEST_OPERATION: create
  DRY_RUN: 'false'
  REWORK_LIMIT: '1'
  # The project config names the AC stages, the criterion letters, the returns limit and the stuck tag.
  READY_STAGE: ''
  RETURN_STAGE: ''
  FINDING_CRITERIA: ''
  RETURNS_LIMIT: ''
  STUCK_TAG: ''
  round: '1'
  writer_assignment_path: ''
  draft: ''
  draft_digest: ''
  critique: ''
nodes:
  prepare:
    shell: |
      set -eu
      node "$MEDULLA_WORKFLOW_DIR/control.mjs" policy
      prepared="$(FLOW_ASSIGNMENT_INLINE=false "$PLANNING_PYTHON" "$CREW_FLOW_STAGES" prepare)"
      printf '%s\n' "$prepared" | grep -v -e '^<signal:PREPARED>' -e '^<signal:var key=assignment>' || true
      case "$prepared" in *'<signal:PREPARED>'*) ;; *) exit 0 ;; esac
      a="$(cd "$MEDULLA_RUN_DIR/artifacts" && pwd -P)"
      # Agents derive acceptance from the item, its references and its existing Tests, not from Task plans.
      # input.json stays complete for the shared publication fence.
      view="$(jq -c --arg test "$TEST_KIND" '
        ([.selected.kind, $test] + [.references[]?[]?.kind]) as $kinds |
        del(.help, .claim_revision, .claim_revisions) | .children |= map(select(.kind == $test)) |
        .schema.types |= with_entries(select(.key as $kind | $kinds | index($kind) != null))' \
        "$a/input.json")"
      # Use the same escaped JSON artifact as Tasker and Auditor. Decoding preserves the complete view.
      printf '%s' "$view" | jq -r 'tojson | gsub("\\{\\{"; "\\u007b\\u007b")' > "$a/writer-assignment.json.tmp"
      mv "$a/writer-assignment.json.tmp" "$a/writer-assignment.json"
      printf '<signal:var key=writer_assignment_path>%s</signal:var>\n' "$a/writer-assignment.json"
      echo '<signal:PREPARED>The claim and the complete Writer view are ready.</signal:PREPARED>'
    on_signal:
      PREPARED: author
      BLOCKED: __exit_fail__
      # The failed node records the result when the shared stage did not.
      __failed__: failed
      __default__: failed
  author:
    max_attempts: 2
    # Agents get no tracker credentials, no MCP servers and no tools. The prompt holds everything they need.
    env: &agent_environment
      LANE_MEMORY_CONFIG: ''
      JOPPA_TOKEN: ''
      JOPPA_TOKEN_FILE: ''
      NTK_KEY: ''
      NTK_CONFIG: /dev/null
    agent:
      harness: claude-code
      model: '{{var:AUTHOR_MODEL}}'
      effort: high
      sandbox: read-only
      args:
        - --strict-mcp-config
        - --setting-sources=
        - --mcp-config
        - '{"mcpServers":{}}'
        - --tools=
    prompt: |
      {{file:prompts/author.md}}
      Mandatory role contract:
      {{var:author_contract}}
      The critics score each Test with the questions of this contract:
      {{var:critic_contract}}
      Native Test kind: {{var:TEST_KIND}}
      Test operation: {{var:TEST_OPERATION}}
      Assignment: {{file:{{var:writer_assignment_path}}}}
      Your previous draft (empty in the first round): {{var:draft}}
      Critic findings on your previous draft (empty in the first round): {{var:critique}}
    post: '"$PLANNING_PYTHON" "$CREW_FLOW_STAGES" capture draft'
    on_signal:
      CAPTURED: draft_check
      __failed__: failed
      __default__: failed
  draft_check:
    # The schema of the native Test kind supplies every limit. The critics review these exact bytes.
    shell: |
      set -eu
      a="$MEDULLA_RUN_DIR/artifacts"
      rm -f "$a"/critic-*.json
      if [ "$TEST_OPERATION" = create ] && [ -n "$SOURCE_GAP_TAG" ] && \
        gap="$(jq -ce --arg gap_tag "$SOURCE_GAP_TAG" --arg run "$(basename "$MEDULLA_RUN_DIR")" \
          --slurpfile input "$a/input.json" -f "$MEDULLA_WORKFLOW_DIR/source-gap.jq" "$a/draft.json")"; then
        file="$(printf '%s' "$FLOW_PUBLICATION" | jq -er '.file | select(type == "string" and test("^[A-Za-z0-9._-]+[.]json$"))')"
        printf '%s\n' "$gap" > "$a/$file"
        echo '<signal:SOURCE_GAP>The source does not define a testable outcome. Return the item to its owner.</signal:SOURCE_GAP>'
      elif { if [ "$TEST_OPERATION" = reconcile ]; then node "$MEDULLA_WORKFLOW_DIR/reconcile.mjs" check "$a";
        else jq -e --arg test "$TEST_KIND" --arg mode "$TEST_OPERATION" --slurpfile input "$a/input.json" \
          -f "$MEDULLA_WORKFLOW_DIR/draft.jq" "$a/draft.json" >/dev/null; fi; }; then
        if command -v sha256sum >/dev/null; then hash="$(sha256sum "$a/draft.json")"; else hash="$(shasum -a 256 "$a/draft.json")"; fi
        printf '<signal:var key=draft_digest>%s</signal:var>\n' "${hash%% *}"
        echo '<signal:DRAFTED>The draft is ready for independent review.</signal:DRAFTED>'
      elif [ "${round:-1}" -le "$REWORK_LIMIT" ]; then
        echo '<signal:var key=critique>{"draft":"The draft must match the configured operation: unique ids and titles, no existing Test title in create mode, existing child IDs and preserved cases in update mode, name rules and limits, every required field, the listed values of each typed field, and complete coverage."}</signal:var>'
        printf '<signal:var key=round>%s</signal:var>\n' "$(( ${round:-1} + 1 ))"
        echo '<signal:REVISE>The draft does not match the output contract or the Test schema.</signal:REVISE>'
      else
        echo 'Writer technical failure: the revised author draft does not match the Writer output contract or the Test schema.' > "$a/failure.txt"
        echo '<signal:INVALID>The revised draft does not match the output contract or the Test schema.</signal:INVALID>'
      fi
    on_signal:
      SOURCE_GAP: publish
      DRAFTED: critics
      REVISE: author
      INVALID: failed
      __failed__: failed
      __default__: failed
  critics:
    pre: '"$PLANNING_PYTHON" "$CREW_FLOW_STAGES" prepare_critic'
    max_attempts: 2
    env:
      LANE_MEMORY_CONFIG: ''
      JOPPA_TOKEN: ''
      JOPPA_TOKEN_FILE: ''
      NTK_KEY: ''
      NTK_CONFIG: /dev/null
      WRITER_DRAFT_DIGEST: '{{var:draft_digest}}'
    max_parallel: 2
    min_success: 2
    # Two independent seats use different models. Neither seat sees the other seat or the author.
    inputs:
      shell: |
        node "$MEDULLA_WORKFLOW_DIR/control.mjs" seats
    agent:
      harness: '{{input.harness}}'
      model: '{{input.model}}'
      effort: high
      sandbox: read-only
      args:
        - '{{input.a1:-}}'
        - '{{input.a2:-}}'
        - '{{input.a3:-}}'
        - '{{input.a4:-}}'
        - '{{input.a5:-}}'
        - '{{input.a6:-}}'
        - '{{input.a7:-}}'
        - '{{input.a8:-}}'
        - '{{input.a9:-}}'
        - '{{input.a10:-}}'
        - '{{input.a11:-}}'
    prompt: |
      {{file:prompts/critic.md}}
      Mandatory role contract:
      {{var:critic_contract}}
      Native Test kind: {{var:TEST_KIND}}
      Test operation: {{var:TEST_OPERATION}}
      Assignment: {{file:{{var:writer_assignment_path}}}}
      Criterion letters of rule ac.check.11111r: {{var:FINDING_CRITERIA}}
      Draft digest: {{var:draft_digest}}
      Frozen draft: {{var:draft}}
    post: '"$PLANNING_PYTHON" "$CREW_FLOW_STAGES" capture "critic-$(printf %s "$MEDULLA_INPUT" | jq -r .slug)"'
    on_signal:
      __done__: review_join
      __failed__: failed
      __empty__: failed
  review_join:
    # Publish only when both seats reviewed this exact draft, every Test scores 11111 and coverage is complete.
    shell: |
      set -eu
      a="$MEDULLA_RUN_DIR/artifacts"
      file="$(printf '%s' "$FLOW_PUBLICATION" | jq -er '.file | select(type == "string" and test("^[A-Za-z0-9._-]+[.]json$"))')"
      verdict="$(node "$MEDULLA_WORKFLOW_DIR/control.mjs" review "$a")"
      if [ "$(printf '%s' "$verdict" | jq -r .approved)" = true ]; then
        printf '%s' "$verdict" | jq 'if .outcome then {operations, outcome} elif (.operations | length) == 0 then
          {operations, outcome: {status: "published", reason: "No Test text changed.", reason_code: "NO_CHANGES"}}
          else {operations} end' > "$a/$file"
        echo '<signal:APPROVED>Both independent critics approved every Test and complete coverage.</signal:APPROVED>'
      elif [ "$(printf '%s' "$verdict" | jq -r '.decision_required // false')" = true ]; then
        printf '%s' "$verdict" | jq '{operations, outcome}' > "$a/$file"
        echo '<signal:MISSING>The acceptance contract needs an owner decision. No Tests are published.</signal:MISSING>'
      elif [ "${round:-1}" -le "$REWORK_LIMIT" ]; then
        critique="$(printf '%s' "$verdict" | jq -c '.critique | tojson | gsub("</signal:var>"; "") | fromjson? // {}')"
        printf '<signal:var key=critique>%s</signal:var>\n' "$critique"
        printf '<signal:var key=round>%s</signal:var>\n' "$(( ${round:-1} + 1 ))"
        echo '<signal:REVISE>The critics did not approve the draft. The author revises it within the configured limit.</signal:REVISE>'
      else
        # Keep every finding of both critics in full. The note on the AC holds this file without a cut.
        printf '%s' "$verdict" | jq -r --arg limit "$REWORK_LIMIT" '"Writer stopped after " + $limit + (if $limit == "1" then " rework." else " reworks." end) +
          (.critique | to_entries | map("\n" + .key + ":" + (.value | (
            [.failing[]? | "\n- Test " + (.id | tostring) + " score " + (.score | tostring) + ": " + ((.reasons // []) | map(tostring) | join(" "))] +
            [.updates[]? | "\n- Update " + (.id | tostring) + ": " + (.evidence | tostring)] +
            [.retirements[]? | "\n- Retirement " + (.id | tostring) + ": " + (.evidence | tostring)] +
            [.missing[]? | "\n- Missing: " + tostring] +
            [(.invalid // empty), (.summary // empty) | "\n- " + tostring]) | join(""))) | join(""))' > "$a/failure.txt"
        echo '<signal:REJECTED>The critics did not approve the revised draft.</signal:REJECTED>'
      fi
    on_signal:
      APPROVED: publish
      MISSING: publish
      REVISE: author
      REJECTED: rejected
      __failed__: failed
      __default__: failed
  rejected:
    # Release the claim with the AC in its stage, returns + 1 and the reason as a note in every mode.
    shell: |
      set -eu
      a="$MEDULLA_RUN_DIR/artifacts"
      file="$(printf '%s' "$FLOW_PUBLICATION" | jq -er '.file | select(type == "string" and test("^[A-Za-z0-9._-]+[.]json$"))')"
      node "$MEDULLA_WORKFLOW_DIR/control.mjs" rejected "$a"
      echo '<signal:RETURN>Count the failed step on the AC with the reason.</signal:RETURN>'
    on_signal:
      RETURN: publish
      __failed__: failed
      __default__: failed
  publish:
    # The shared stage adds the claim release and refuses operations outside config.publication.
    shell: |
      set -eu
      node "$MEDULLA_WORKFLOW_DIR/control.mjs" preview "$MEDULLA_RUN_DIR/artifacts"
      "$PLANNING_PYTHON" "$CREW_FLOW_STAGES" publish
    on_signal:
      READY: __exit_ok__
      BLOCKED: __exit_fail__
      __failed__: failed
      __default__: failed
  failed:
    # A shared stage that already recorded result.json released or retained its claim. Do not repeat it.
    # A business rejection leaves failure.txt. Other stops record the last step message.
    shell: |
      set -eu
      a="$MEDULLA_RUN_DIR/artifacts"
      if [ -e "$a/result.json" ]; then
        echo '<signal:BLOCKED>The shared stage already recorded the result.</signal:BLOCKED>'
        exit 0
      fi
      [ -s "$a/failure.txt" ] || printf '%s\n' "${MEDULLA_LAST_MESSAGE:-Writer stopped before publication}" | cut -c1-1000 > "$a/failure.txt"
      exec "$PLANNING_PYTHON" "$CREW_FLOW_STAGES" fail
    on_signal:
      BLOCKED: __exit_fail__
      __failed__: __exit_fail__
      __default__: __exit_fail__
