version: '2'
start: prepare
# The workflow deadline invokes failed once to release its claim.
timeout: &workflow_timeout 3600
on_timeout: failed
# Override Medulla's shorter action fallback with the same global budget.
defaults:
  timeout: *workflow_timeout
vars:
  PLANNING_PYTHON: python3
  # launch.py supplies the shared flow stages, the selected item and the publication policy.
  CREW_FLOW_STAGES: ''
  FLOW_PUBLICATION: ''
  AUTHOR_MODEL: claude-opus-5-5
  CRITIC_CODEX_MODEL: gpt-6.1-sol
  CRITIC_CLAUDE_MODEL: claude-sonnet-5-5
  # The project names its native kinds and Task stages in config.vars. Crew has no default vocabulary.
  TEST_KIND: ''
  TASK_KIND: ''
  WAITING_STAGE: ''
  READY_STAGE: ''
  DECISION_STAGE: ''
  TEST_OPERATION: create
  REWORK_LIMIT: '1'
  round: '1'
  draft: ''
  draft_digest: ''
  critique: ''
nodes:
  prepare:
    shell: |
      set -eu
      for name in CREW_FLOW_STAGES FLOW_PUBLICATION TEST_KIND TASK_KIND WAITING_STAGE READY_STAGE; do
        eval "value=\${$name:-}"
        [ -n "$value" ] || { echo "writer: $name is required" >&2; exit 2; }
      done
      case "$REWORK_LIMIT" in
        ''|*[!0-9]*) echo 'writer: REWORK_LIMIT must be a nonnegative integer' >&2; exit 2 ;;
      esac
      case "$TEST_OPERATION" in
        create) ;;
        update)
          printf '%s' "$FLOW_PUBLICATION" | jq -e --arg test "$TEST_KIND" \
            '.create_kinds == [] and .update_kinds == [$test]' >/dev/null || {
              echo 'writer: update requires no create kinds and only TEST_KIND in update_kinds' >&2; exit 2; }
          ;;
        *) echo 'writer: TEST_OPERATION must be create or update' >&2; exit 2 ;;
      esac
      if [ "$TEST_OPERATION" = create ] && [ -n "$DECISION_STAGE" ]; then
        printf '%s' "$FLOW_PUBLICATION" | jq -e '.allowed_operations | index("note") != null' >/dev/null || {
          echo 'writer: DECISION_STAGE requires note publication permission' >&2; exit 2; }
      fi
      # The Claude critic must review independently of the author. The same vendor is allowed, the same model is not.
      [ "$AUTHOR_MODEL" != "$CRITIC_CLAUDE_MODEL" ] || { echo "writer: CRITIC_CLAUDE_MODEL must differ from AUTHOR_MODEL" >&2; exit 2; }
      prepared="$("$PLANNING_PYTHON" "$CREW_FLOW_STAGES" prepare)"
      # Agents derive acceptance from the item, its references and its existing Tests, not from Task plans.
      # input.json stays complete: review_join reads the waiting Tasks from it.
      view="$(jq -c --arg test "$TEST_KIND" '
        ([.selected.kind, $test] + [.references[]?[]?.kind]) as $kinds |
        del(.help, .claim_revision, .claim_revisions) | .children |= map(select(.kind == $test)) |
        .schema.types |= with_entries(select(.key as $kind | $kinds | index($kind) != null))' \
        "$MEDULLA_RUN_DIR/artifacts/input.json")"
      case "$view" in *'</signal:var>'*) echo 'writer: reserved signal delimiter in the assignment' >&2; exit 1;; esac
      printf '%s\n' "$prepared"
      printf '<signal:var key=writer_assignment>%s</signal:var>\n' "$view"
    on_signal:
      PREPARED: author
      BLOCKED: __exit_fail__
      # The failed node records the result when the shared stage did not.
      __failed__: failed
      __default__: failed
  author:
    max_attempts: 2
    # Agents get no tracker credentials, no MCP servers and no tools. The prompt holds everything they need.
    env: &agent_environment
      LANE_MEMORY_CONFIG: ''
      JOPPA_TOKEN: ''
      JOPPA_TOKEN_FILE: ''
      NTK_KEY: ''
      NTK_CONFIG: /dev/null
    agent:
      harness: claude-code
      model: '{{var:AUTHOR_MODEL}}'
      effort: high
      sandbox: read-only
      args:
        - --strict-mcp-config
        - --setting-sources=
        - --mcp-config
        - '{"mcpServers":{}}'
        - --disallowedTools
        - Bash,Read,Glob,Grep,WebFetch,WebSearch,Task,Edit,Write,NotebookEdit
    prompt: |
      {{file:prompts/author.md}}
      Mandatory role contract:
      {{var:author_contract}}
      The critics score each Test with the questions of this contract:
      {{var:critic_contract}}
      Native Test kind: {{var:TEST_KIND}}
      Test operation: {{var:TEST_OPERATION}}
      Assignment: {{var:writer_assignment}}
      Your previous draft (empty in the first round): {{var:draft}}
      Critic findings on your previous draft (empty in the first round): {{var:critique}}
    post: '"$PLANNING_PYTHON" "$CREW_FLOW_STAGES" capture draft'
    on_signal:
      CAPTURED: draft_check
      __failed__: failed
      __default__: failed
  draft_check:
    # The schema of the native Test kind supplies every limit. The critics review these exact bytes.
    shell: |
      set -eu
      a="$MEDULLA_RUN_DIR/artifacts"
      rm -f "$a"/critic-*.json
      if jq -e --arg test "$TEST_KIND" --arg task "$TASK_KIND" --arg waiting "$WAITING_STAGE" \
        --arg mode "$TEST_OPERATION" --slurpfile input "$a/input.json" \
        -f "$MEDULLA_WORKFLOW_DIR/draft.jq" "$a/draft.json" >/dev/null; then
        if command -v sha256sum >/dev/null; then hash="$(sha256sum "$a/draft.json")"; else hash="$(shasum -a 256 "$a/draft.json")"; fi
        printf '<signal:var key=draft_digest>%s</signal:var>\n' "${hash%% *}"
        echo '<signal:DRAFTED>The draft is ready for independent review.</signal:DRAFTED>'
      elif [ "${round:-1}" -le "$REWORK_LIMIT" ]; then
        echo '<signal:var key=critique>{"draft":"The draft must match the configured operation: unique ids and titles, no existing Test title in create mode, existing child IDs and preserved cases in update mode, name rules and limits, every required field, the listed values of each typed field, and complete coverage."}</signal:var>'
        printf '<signal:var key=round>%s</signal:var>\n' "$(( ${round:-1} + 1 ))"
        echo '<signal:REVISE>The draft does not match the output contract or the Test schema.</signal:REVISE>'
      else
        echo 'The revised author draft does not match the Writer output contract or the Test schema.' > "$a/failure.txt"
        echo '<signal:INVALID>The revised draft does not match the output contract or the Test schema.</signal:INVALID>'
      fi
    on_signal:
      DRAFTED: critics
      REVISE: author
      INVALID: failed
      __failed__: failed
      __default__: failed
  critics:
    max_attempts: 2
    env:
      LANE_MEMORY_CONFIG: ''
      JOPPA_TOKEN: ''
      JOPPA_TOKEN_FILE: ''
      NTK_KEY: ''
      NTK_CONFIG: /dev/null
      WRITER_DRAFT_DIGEST: '{{var:draft_digest}}'
    max_parallel: 2
    min_success: 2
    # Two independent seats from different vendors. Neither seat sees the other seat or the author.
    inputs:
      shell: |
        jq -nc --arg codex '{{var:CRITIC_CODEX_MODEL}}' --arg claude '{{var:CRITIC_CLAUDE_MODEL}}' '[
          {slug: "codex", harness: "codex", model: $codex, a1: "--ignore-user-config", a2: "-c", a3: "mcp_servers={}"},
          {slug: "claude", harness: "claude-code", model: $claude, a1: "--strict-mcp-config", a2: "--setting-sources=",
           a3: "--mcp-config", a4: "{\"mcpServers\":{}}", a5: "--disallowedTools",
           a6: "Bash,Read,Glob,Grep,WebFetch,WebSearch,Task,Edit,Write,NotebookEdit"}]'
    agent:
      harness: '{{input.harness}}'
      model: '{{input.model}}'
      effort: high
      sandbox: read-only
      args:
        - '{{input.a1:-}}'
        - '{{input.a2:-}}'
        - '{{input.a3:-}}'
        - '{{input.a4:-}}'
        - '{{input.a5:-}}'
        - '{{input.a6:-}}'
    prompt: |
      {{file:prompts/critic.md}}
      Mandatory role contract:
      {{var:critic_contract}}
      Native Test kind: {{var:TEST_KIND}}
      Test operation: {{var:TEST_OPERATION}}
      Assignment: {{var:writer_assignment}}
      Draft digest: {{var:draft_digest}}
      Frozen draft: {{var:draft}}
    post: '"$PLANNING_PYTHON" "$CREW_FLOW_STAGES" capture "critic-$(printf %s "$MEDULLA_INPUT" | jq -r .slug)"'
    on_signal:
      __done__: review_join
      __failed__: failed
      __empty__: failed
  review_join:
    # Publish only when both seats reviewed this exact draft, every Test scores 11111 and coverage is complete.
    shell: |
      set -eu
      a="$MEDULLA_RUN_DIR/artifacts"
      file="$(printf '%s' "$FLOW_PUBLICATION" | jq -er '.file | select(type == "string" and test("^[A-Za-z0-9._-]+[.]json$"))')"
      if command -v sha256sum >/dev/null; then hash="$(sha256sum "$a/draft.json")"; else hash="$(shasum -a 256 "$a/draft.json")"; fi
      verdict="$(jq -nc --arg digest "${hash%% *}" --arg test "$TEST_KIND" --arg task "$TASK_KIND" \
        --arg decision "$DECISION_STAGE" --arg run "$(basename "$MEDULLA_RUN_DIR")" \
        --arg waiting "$WAITING_STAGE" --arg ready "$READY_STAGE" --slurpfile draft "$a/draft.json" \
        --slurpfile codex "$a/critic-codex.json" --slurpfile claude "$a/critic-claude.json" \
        --arg mode "$TEST_OPERATION" --slurpfile input "$a/input.json" \
        -f "$MEDULLA_WORKFLOW_DIR/publication.jq")"
      if [ "$(printf '%s' "$verdict" | jq -r .approved)" = true ]; then
        printf '%s' "$verdict" | jq 'if (.operations | length) == 0 then
          {operations, outcome: {status: "published", reason: "No Test text changed.", reason_code: "NO_CHANGES"}}
          else {operations} end' > "$a/$file"
        echo '<signal:APPROVED>Both independent critics approved every Test and complete coverage.</signal:APPROVED>'
      elif [ "$(printf '%s' "$verdict" | jq -r '.decision_required // false')" = true ]; then
        printf '%s' "$verdict" | jq '{operations, outcome}' > "$a/$file"
        echo '<signal:MISSING>The Tests passed, but acceptance coverage needs an owner decision.</signal:MISSING>'
      elif [ "${round:-1}" -le "$REWORK_LIMIT" ]; then
        critique="$(printf '%s' "$verdict" | jq -c '.critique | tojson | gsub("</signal:var>"; "") | fromjson? // {}')"
        printf '<signal:var key=critique>%s</signal:var>\n' "$critique"
        printf '<signal:var key=round>%s</signal:var>\n' "$(( ${round:-1} + 1 ))"
        echo '<signal:REVISE>The critics did not approve the draft. The author revises it within the configured limit.</signal:REVISE>'
      else
        printf '%s' "$verdict" | jq -r --arg limit "$REWORK_LIMIT" '"Writer stopped after " + $limit + (if $limit == "1" then " rework. " else " reworks. " end) +
          (.critique | to_entries | map(.key + ": " +
            ((.value.failing[0].reasons[0] // .value.invalid // .value.summary // "Incomplete coverage") | .[0:400])) | join(" "))' |
          cut -c1-1000 > "$a/failure.txt"
        echo '<signal:REJECTED>The critics did not approve the revised draft.</signal:REJECTED>'
      fi
    on_signal:
      APPROVED: publish
      MISSING: publish
      REVISE: author
      REJECTED: failed
      __failed__: failed
      __default__: failed
  publish:
    # The shared stage adds the claim release and refuses operations outside config.publication.
    shell: '"$PLANNING_PYTHON" "$CREW_FLOW_STAGES" publish'
    on_signal:
      READY: __exit_ok__
      BLOCKED: __exit_fail__
      __failed__: failed
      __default__: failed
  failed:
    # A shared stage that already recorded result.json released or retained its claim. Do not repeat it.
    # A business rejection leaves failure.txt. Other stops record the last step message.
    shell: |
      set -eu
      a="$MEDULLA_RUN_DIR/artifacts"
      if [ -e "$a/result.json" ]; then
        echo '<signal:BLOCKED>The shared stage already recorded the result.</signal:BLOCKED>'
        exit 0
      fi
      [ -s "$a/failure.txt" ] || printf '%s\n' "${MEDULLA_LAST_MESSAGE:-Writer stopped before publication}" | cut -c1-1000 > "$a/failure.txt"
      exec "$PLANNING_PYTHON" "$CREW_FLOW_STAGES" fail
    on_signal:
      BLOCKED: __exit_fail__
      __failed__: __exit_fail__
      __default__: __exit_fail__
